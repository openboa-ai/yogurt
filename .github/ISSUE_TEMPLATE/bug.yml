name: Bug report
description: Report a reproducible problem. Use private vulnerability reporting for security issues.
body:
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe the expected result and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the relevant version or commit and any environment details. Remove credentials from logs.
    validations:
      required: true
