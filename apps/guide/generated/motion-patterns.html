  --yg-text: light-dark(var(--boa-color-mist-950), var(--boa-color-mist-50));
  --yg-muted: light-dark(var(--boa-color-mist-700), var(--boa-color-mist-300));
}

/* Extended component anatomy. All color roles follow the nearest Yogurt. */
.yg-bottom-action[data-fixed] {
  position: fixed;
  inset-inline: 0;
  inset-block-end: 0;
  z-index: 3;
  padding: var(--boa-space-12) var(--boa-space-16)
    max(var(--boa-space-12), env(safe-area-inset-bottom));
  background: var(--yg-canvas);
}
.yg-aspect {
  width: 100%;
  overflow: hidden;
  border-radius: var(--yg-radius-control);
}
.yg-aspect > :is(img, video) {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.yg-card,
.yg-elevation,
.yg-gradient,
.yg-slide,
.yg-sidebar {
  padding: var(--boa-space-16);
  border-radius: var(--yg-radius-panel);
  background: var(--yg-surface);
}
.yg-card {
  display: grid;
  gap: var(--boa-space-8);
}
.yg-card p,
.yg-section-line p,
.yg-stepper p,
.yg-post p {
  margin: 0;
}
.yg-asset,
.yg-avatar {
  display: inline-grid;
  place-items: center;
  flex: none;
  overflow: hidden;
  vertical-align: middle;
}
.yg-asset[data-framed],
.yg-avatar {
  background: var(--yg-action-soft);
  color: var(--yg-action);
  border-radius: var(--yg-radius-control);
}
.yg-asset > :is(img, video, svg),
.yg-avatar img {
  max-width: 100%;
  max-height: 100%;
  object-fit: cover;
}
.yg-avatar {
  border-radius: 50%;
  font: var(--yg-font-action);
}
.yg-gradient {
  background: linear-gradient(115deg, var(--yg-action-soft), var(--yg-surface));
}
.yg-gradient[data-tone="accent"] {
  background: linear-gradient(
    115deg,
    var(--yg-accent-soft),
    var(--yg-action-soft)
  );
}
.yg-gradient[data-tone="success"] {
  background: linear-gradient(
    115deg,
    var(--yg-success-soft),
    var(--yg-surface)
  );
}
.yg-gradient[data-tone="warning"] {
  background: linear-gradient(
    115deg,
    var(--yg-warning-soft),
    var(--yg-surface)
  );
}
.yg-gradient[data-tone="danger"] {
  background: linear-gradient(115deg, var(--yg-danger-soft), var(--yg-surface));
}
.yg-gradient[data-tone="neutral"] {
  background: linear-gradient(115deg, var(--yg-field), var(--yg-surface));
}
.yg-elevation {
  background: var(--yg-canvas);
}
.yg-elevation[data-level="raised"] {
  box-shadow: var(--yg-lift-shadow);
}
.yg-elevation[data-level="floating"],
.yg-flyout {
  box-shadow: var(--yg-float-shadow);
}
.yg-shortcut {
  display: inline-flex;
  gap: var(--boa-space-4);
}
.yg-shortcut kbd {
  font: var(--yg-font-help);
  color: var(--yg-muted);
  background: var(--yg-field);
  border-radius: var(--yg-radius-small);
  padding: var(--boa-space-2) var(--boa-space-8);
}
.yg-post {
  max-inline-size: 65ch;
  line-height: 1.6;
  overflow-wrap: anywhere;
}
.yg-post > * + * {
  margin-block-start: var(--boa-space-12);
}
.yg-grid-list,
.yg-stepper,
.yg-trace ol,
.yg-bars ul,
.yg-navigation-menu ul {
  list-style: none;
  margin: 0;
  padding: 0;
}
.yg-grid-list {
  display: grid;
  gap: var(--boa-space-12);
  grid-template-columns: repeat(
    auto-fit,
    minmax(min(100%, var(--yg-cell)), 1fr)
  );
}
.yg-section-line,
.yg-value-row,
.yg-code header,
.yg-carousel footer,
.yg-quantity,
.yg-range > div,
.yg-sidebar header,
.yg-navbar,
.yg-attachment {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--boa-space-12);
  min-width: 0;
}
.yg-section-line,
.yg-value-row {
  flex-wrap: wrap;
}
.yg-section-line .yg-heading {
  font: var(--yg-font-action);
}
.yg-bottom-info {
  padding: var(--boa-space-12);
  background: var(--yg-field);
  color: var(--yg-muted);
  font: var(--yg-font-help);
  border-radius: var(--yg-radius-control);
}
.yg-highlight {
  background: var(--yg-warning-soft);
  color: var(--yg-warning);
  border-radius: var(--boa-space-2);
  padding-inline: var(--boa-space-2);
}
.yg-loading {
  display: inline-flex;
  align-items: center;
  color: var(--yg-action);
}
.yg-value-row {
  margin: 0;
  min-height: var(--yg-size-regular);
}
.yg-value-row dt {
  color: var(--yg-muted);
}
.yg-value-row dd {
  margin: 0;
  font-weight: var(--boa-weight-medium);
}
.yg-amount {
  display: grid;
  gap: var(--boa-space-4);
}
.yg-amount strong {
  font-size: 1.75rem;
  line-height: 1.2;
  letter-spacing: -0.035em;
}
.yg-amount small {
  font: var(--yg-font-action);
}
.yg-bars {
  margin: 0;
}
.yg-bars figcaption,
.yg-file-name strong {
  font: var(--yg-font-action);
}
.yg-bars ul {
  margin-block: var(--boa-space-8);
}
.yg-bars li {
  display: grid;
  grid-template-columns: minmax(4ch, auto) minmax(3rem, 1fr) auto;
  align-items: center;
  gap: var(--boa-space-8);
  min-height: var(--yg-size-compact);
}
.yg-bar-track {
  position: relative;
  height: var(--boa-space-8);
  background: var(--yg-field);
  border-radius: var(--yg-radius-small);
  overflow: hidden;
}
.yg-bar-track i {
  position: absolute;
  inset-block: 0;
  background: var(--yg-action);
}
.yg-bars small,
.yg-attachment small,
.yg-carousel footer > span,
.yg-trace small {
  font: var(--yg-font-help);
  color: var(--yg-muted);
}
.yg-bubble {
  width: fit-content;
  max-width: 90%;
  padding: var(--boa-space-8) var(--boa-space-12);
  border-radius: var(--yg-radius-panel);
  background: var(--yg-field);
  overflow-wrap: anywhere;
}
.yg-bubble[data-outgoing] {
  margin-inline-start: auto;
  background: var(--yg-action-soft);
  color: var(--yg-action);
}
.yg-attachment,
.yg-code,
.yg-quantity > div,
.yg-context-target,
.yg-toggle-group {
  background: var(--yg-field);
  border-radius: var(--yg-radius-control);
}
.yg-attachment {
  justify-content: start;
  padding: var(--boa-space-8);
  flex-wrap: wrap;
}
.yg-file-name {
  display: grid;
  min-width: 0;
  text-align: start;
  flex: 1;
  overflow-wrap: anywhere;
}
.yg-attachment button.yg-file-name {
  border: 0;
  background: transparent;
}
.yg-marker {
  display: flex;
  align-items: center;
  gap: var(--boa-space-8);
  color: var(--yg-muted);
  font: var(--yg-font-help);
}
.yg-code {
  min-width: 0;
  max-width: 100%;
  overflow: hidden;
}
.yg-code header,
.yg-code pre {
  padding: var(--boa-space-8) var(--boa-space-12);
  margin: 0;
}
.yg-code header {
  color: var(--yg-muted);
  font: var(--yg-font-help);
}
.yg-code pre {
  overflow: auto;
  text-align: start;
}
.yg-code code {
  font: var(--yg-font-body);
  font-variant-numeric: tabular-nums;
}
.yg-trace li {
  padding-block: var(--boa-space-4);
}
.yg-trace small {
  margin-inline-start: var(--boa-space-8);
}
.yg-trace details > div {
  color: var(--yg-muted);
  padding: var(--boa-space-8) var(--boa-space-16);
}
.yg-input-group {
  gap: var(--boa-space-8);
}
.yg-input-group > :not(input) {
  flex: none;
}
.yg-input-group input {
  width: 0;
}
.yg-otp {
  position: relative;
  width: fit-content;
  max-width: 100%;
}
.yg-otp input {
  position: absolute;
  inset: 0;
  z-index: 1;
  width: 100%;
  height: 100%;
  opacity: 0;
  font: var(--yg-font-touch);
}
.yg-otp-slots {
  display: grid;
  grid-template-columns: repeat(
    var(--yg-digits),
    minmax(0, var(--yg-size-regular))
  );
  gap: var(--boa-space-4);
}
.yg-otp-slots > span {
  display: grid;
  place-items: center;
  min-height: var(--yg-size-regular);
  border-radius: var(--yg-radius-small);
  background: var(--yg-field);
  font: var(--yg-font-action);
}
.yg-otp:focus-within [data-cursor] {
  outline: var(--boa-stroke-focus) solid var(--yg-action);
  outline-offset: -2px;
}
.yg-split-inputs,
.yg-split-inputs > span,
.yg-key-actions,
.yg-key-row,
.yg-toggle-group {
  display: flex;
  align-items: center;
  gap: var(--boa-space-8);
}
.yg-split-inputs > span {
  min-width: 0;
  flex: 1;
}
.yg-split-inputs i {
  font-style: normal;
  color: var(--yg-muted);
}
.yg-range {
  display: grid;
  gap: var(--boa-space-4);
}
.yg-range output {
  color: var(--yg-action);
  font: var(--yg-font-action);
  font-variant-numeric: tabular-nums;
}
.yg-range input {
  display: block;
  width: 100%;
  margin: 0;
  min-height: var(--yg-size-regular);
  accent-color: var(--yg-action);
}
.yg-quantity > div {
  display: inline-flex;
  align-items: center;
}
.yg-quantity output {
  min-inline-size: 3ch;
  text-align: center;
  font-variant-numeric: tabular-nums;
}
.yg-rating {
  display: flex;
  flex-wrap: wrap;
}
.yg-rating label {
  position: relative;
  display: grid;
  place-items: center;
  width: var(--yg-size-regular);
  height: var(--yg-size-regular);
  font-size: 1.35rem;
  color: var(--yg-muted);
}
.yg-rating input {
  position: absolute;
  inset: 0;
  opacity: 0;
  cursor: pointer;
}
.yg-rating [data-filled] {
  color: var(--yg-action);
}
.yg-rating label:has(:focus-visible) {
  outline: var(--boa-stroke-focus) solid var(--yg-action);
  border-radius: var(--yg-radius-small);
}
.yg-agreement > div {
  margin-inline-start: var(--boa-space-12);
}
.yg-keypad {
  display: grid;
  gap: var(--boa-space-4);
  max-width: 30rem;
}
.yg-key-row {
  justify-content: center;
  gap: var(--boa-space-2);
}
.yg-key-row > * {
  flex: 1;
  min-width: 0;
  max-width: 3.5rem;
}
.yg-key-row button,
.yg-toggle-item,
.yg-menu-bar > button,
.yg-navigation-menu li > button,
.yg-date-trigger,
.yg-sidebar a,
.yg-flyout [role="menuitem"],
.yg-flyout a,
.yg-command-list [role="option"] {
  border: 0;
  border-radius: var(--yg-radius-small);
  color: var(--yg-text);
  background: transparent;
  font: var(--yg-font-body);
  padding: var(--boa-space-4) var(--boa-space-8);
  min-height: var(--yg-size-regular);
}
.yg-key-row button {
  background: var(--yg-field);
  padding-inline: 0;
}
.yg-key-actions {
  justify-content: flex-end;
}
.yg-keypad[data-mode="number"] .yg-key-row > * {
  max-width: none;
}
.yg-keypad[data-mode="number"] .yg-key-row:last-of-type > * {
  max-width: 33%;
}
.yg-toggle-group {
  width: fit-content;
  max-width: 100%;
  flex-wrap: wrap;
  gap: var(--boa-space-2);
  padding: var(--boa-space-2);
}
.yg-toggle-item[data-state="on"],
.yg-sidebar a[aria-current],
.yg-command-list [aria-selected="true"],
.yg-menu-bar [data-state="open"] {
  background: var(--yg-action-soft);
  color: var(--yg-action);
}
.yg-accordion h3 {
  margin: 0;
  font: inherit;
}
.yg-accordion h3 button,
.yg-date-trigger {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--boa-space-8);
  width: 100%;
  min-height: var(--yg-size-touch);
  border: 0;
  background: none;
  text-align: start;
}
.yg-accordion h3 button {
  padding: var(--boa-space-8) 0;
  font: var(--yg-font-action);
}
.yg-accordion h3 button[data-state="open"] .yg-icon {
  rotate: 180deg;
}
.yg-accordion-content {
  padding-block: 0 var(--boa-space-12);
  color: var(--yg-muted);
}
.yg-context-target {
  padding: var(--boa-space-16);
}
.yg-flyout,
.yg-command-list {
  padding: var(--boa-space-4);
  border-radius: var(--yg-radius-panel);
  background: light-dark(var(--yg-canvas), var(--yg-field));
  color: var(--yg-text);
  max-width: min(22rem, 92vi);
  z-index: 8;
}
.yg-flyout {
  max-height: var(--radix-popper-available-height, 80dvh);
  overflow: auto;
}
.yg-flyout [role="menuitem"],
.yg-flyout a,
.yg-command-list [role="option"] {
  display: flex;
  align-items: center;
  cursor: pointer;
  white-space: normal;
  text-decoration: none;
  outline-offset: -2px;
}
.yg-flyout [data-highlighted],
.yg-flyout a:focus-visible,
.yg-key-row button:active {
  background: var(--yg-hover);
}
.yg-flyout [data-disabled],
.yg-command-list [aria-disabled="true"] {
  color: var(--yg-off);
  cursor: default;
}
.yg-command-list {
  max-width: 100%;
  max-height: 16rem;
  overflow: auto;
}
.yg-hover-content {
  padding: var(--boa-space-12);
}
.yg-menu-bar,
.yg-navigation-menu ul {
  display: flex;
  align-items: center;
  gap: var(--boa-space-4);
  flex-wrap: wrap;
}
.yg-navigation-menu li {
  position: relative;
}
.yg-navigation-menu li > button {
  display: flex;
  align-items: center;
  gap: var(--boa-space-4);
}
.yg-navigation-menu .yg-flyout {
  position: absolute;
  inset-block-start: 100%;
  inset-inline-start: 0;
  min-width: min(11rem, 80vi);
}
.yg-sidebar {
  max-width: 18rem;
}
.yg-sidebar nav a {
  display: flex;
  align-items: center;
  text-decoration: none;
}
.yg-navbar {
  min-height: var(--yg-size-touch);
}
.yg-navbar > strong {
  flex: 1;
}
.yg-carousel {
  min-width: 0;
}
.yg-slide {
  background: var(--yg-field);
  touch-action: pan-y;
}
.yg-carousel footer {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
  align-items: center;
  gap: var(--boa-space-4);
  margin-block-start: var(--boa-space-8);
}
.yg-carousel footer > span {
  overflow-wrap: anywhere;
}
.yg-carousel-nav {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--boa-space-4);
}
.yg-stepper {
  display: grid;
  gap: var(--boa-space-12);
}
.yg-stepper li {
  display: flex;
  align-items: center;
  gap: var(--boa-space-8);
}
.yg-step-number {
  display: grid;
  place-items: center;
  background: var(--yg-field);
  color: var(--yg-muted);
  width: var(--yg-size-compact);
  height: var(--yg-size-compact);
  border-radius: 50%;
  flex: none;
  font: var(--yg-font-meta);
}
.yg-stepper [aria-current] .yg-step-number,
.yg-stepper [data-complete] .yg-step-number {
  background: var(--yg-action-soft);
  color: var(--yg-action);
}
.yg-stepper[data-variant="progress"] {
  grid-template-columns: repeat(auto-fit, minmax(min(6rem, 100%), 1fr));
}
.yg-stepper[data-variant="progress"] li {
  flex-direction: column;
  align-items: flex-start;
}
.yg-resizable > [data-panel] {
  background: var(--yg-field);
  border-radius: var(--yg-radius-control);
  padding: var(--boa-space-12);
  overflow-wrap: anywhere;
}
.yg-resize-handle {
  width: var(--boa-space-12);
  display: grid;
  place-items: center;
}
.yg-resize-handle::before {
  content: "";
  width: var(--boa-space-2);
  height: var(--boa-space-24);
  background: var(--yg-muted);
  border-radius: var(--yg-radius-small);
}
.yg-date-trigger {
  background: var(--yg-field);
  padding-inline: var(--yg-inset-regular);
  min-height: var(--yg-size-regular);
  border-radius: var(--yg-radius-control);
}
.yg-calendar {
  position: relative;
  width: fit-content;
  max-width: 100%;
  --yg-date-size: clamp(1.75rem, 8.5vi, 2.5rem);
}
.yg-date-popup {
  padding: var(--boa-space-8);
}
.yg-calendar .rdp-month_caption {
  min-height: var(--yg-size-touch);
  display: flex;
  align-items: center;
  font: var(--yg-font-action);
  padding-inline: var(--boa-space-8) 5rem;
}
.yg-calendar .rdp-nav {
  position: absolute;
  inset-block-start: 0;
  inset-inline-end: 0;
  display: flex;
  gap: var(--boa-space-2);
}
.yg-calendar table {
  border-collapse: collapse;
}
.yg-calendar td,
.yg-calendar th {
  padding: 0;
  text-align: center;
}
.yg-calendar th {
  color: var(--yg-muted);
  font: var(--yg-font-meta);
  height: var(--yg-size-compact);
}
.yg-calendar button {
  border: 0;
  background: transparent;
  border-radius: var(--yg-radius-small);
  color: var(--yg-text);
  display: grid;
  place-items: center;
  width: var(--yg-date-size);
  height: var(--yg-date-size);
  padding: 0;
  font: var(--yg-font-body);
}
.yg-calendar .rdp-chevron {
  fill: currentColor;
  width: var(--yg-glyph);
  height: var(--yg-glyph);
}
.yg-calendar .rdp-selected button {
  background: var(--yg-action);
  color: var(--yg-on-action);
}
.yg-calendar .rdp-today:not(.rdp-selected) button {
  font-weight: var(--boa-weight-medium);
  color: var(--yg-action);
}
.yg-calendar .rdp-disabled button {
  color: var(--yg-off);
  cursor: default;
}
.yg-question {
  justify-items: stretch;
}
@media (hover: hover) {
  .yg-calendar button:not(:disabled):hover,
  .yg-toggle-item:not(:disabled):hover,
  .yg-sidebar a:hover,
  .yg-menu-bar > button:hover,
  .yg-navigation-menu li > button:hover {
    background: var(--yg-hover);
    color: var(--yg-text);
  }
}
@media (pointer: coarse) {
  .yg-resize-handle {
    width: var(--boa-space-24);
  }
  .yg-rating label,
  .yg-key-row button,
  .yg-calendar button {
    min-height: var(--yg-size-touch);
  }
  .yg-flyout [role="menuitem"] {
    min-height: var(--yg-size-touch);
  }
}
@media (forced-colors: active) {
  .yg-otp-slots > span,
  .yg-key-row button {
    outline: 1px solid ButtonText;
  }
  .yg-calendar .rdp-selected button,
  .yg-stepper [aria-current] .yg-step-number {
    outline: 2px solid Highlight;
  }
}

.yg-stage-list > progress {
  display: block;
  width: 100%;
  height: var(--boa-space-4);
  margin-block-end: var(--boa-space-12);
  accent-color: var(--yg-action);
}
.yg-stepper li > div {
  min-width: 0;
  overflow-wrap: anywhere;
}
.yg-dialog.yg-drawer {
  margin: auto auto 0;
  width: min(34rem, 100%);
  max-height: 85dvh;
  padding-block-start: 0;
  padding-block-end: max(var(--boa-space-24), env(safe-area-inset-bottom));
  border-radius: var(--yg-radius-panel) var(--yg-radius-panel) 0 0;
  translate: 0 var(--yg-drag-distance, 0);
  transition: translate var(--yg-layer) var(--yg-settle);
}
.yg-drawer[data-dragging] {
  transition: none;
}
.yg-drawer-grip {
  display: grid;
  place-items: center;
  height: var(--boa-space-32);
  margin-inline: calc(-1 * var(--boa-space-24));
  touch-action: none;
  cursor: grab;
}
.yg-drawer-grip:active {
  cursor: grabbing;
}
.yg-drawer-grip::before {
  content: "";
  width: var(--boa-space-32);
  height: var(--boa-space-4);
  border-radius: var(--yg-radius-control);
  background: var(--yg-muted);
}
.yg-table-sort {
  display: inline-flex;
  align-items: center;
  gap: var(--boa-space-4);
  min-block-size: var(--boa-space-32);
  padding: 0;
  border: 0;
  background: transparent;
  color: inherit;
  font: inherit;
  cursor: pointer;

.yg-fan-cards-list button[aria-pressed="true"] { transform: translateY(-6px); background: var(--yg-action-soft); border-color: currentColor; }
.yg-fan-cards-list button > :last-child { align-self: flex-end; }
.yg-fan-number { font-size: .75em; opacity: .65; }
.yg-fan-detail { display: grid; gap: 4px; margin: 0; }
.yg-stat-card { display: grid; gap: 8px; padding: 20px; }
.yg-stat-label, .yg-stat-detail { font-size: .875em; }
.yg-stat-value { display: block; font-size: 2.5rem; line-height: 1; font-variant-numeric: tabular-nums; }
.yg-profile-card { padding: 20px; }
.yg-profile-header { display: flex; align-items: center; gap: 14px; }
.yg-profile-header p { margin: 4px 0 0; }
.yg-profile-avatar { display: grid; place-items: center; flex: none; width: 48px; height: 48px; border-radius: 50%; background: var(--yg-action-soft); font-weight: 700; }
.yg-profile-card details { margin-top: 16px; }
.yg-profile-card summary { cursor: pointer; }
.yg-profile-extra { padding-top: 12px; }
:where(.yg-expand-card summary, .yg-fan-cards button, .yg-profile-card summary):focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
@media (prefers-reduced-motion: no-preference) {
  .yg-card-disclosure, .yg-fan-cards-list button { transition: transform var(--yg-travel) var(--yg-settle), background-color var(--yg-travel) var(--yg-settle); }
  .yg-expand-card[open] .yg-expand-card-body, .yg-fan-detail, .yg-profile-card details[open] .yg-profile-extra, .yg-stat-value { animation: yg-card-arrive var(--yg-change) var(--yg-settle); }
}
@keyframes yg-card-arrive { from { opacity: 0; transform: translateY(5px); } }

.yg-motion-range, .yg-motion-password, .yg-motion-dial { display: grid; gap: 12px; inline-size: min(100%, 360px); }
.yg-motion-range-heading { display: flex; justify-content: space-between; gap: 16px; font-weight: 600; }
.yg-motion-range-heading output { font-variant-numeric: tabular-nums; }
.yg-motion-range input, .yg-motion-dial input { inline-size: 100%; accent-color: var(--yg-action); cursor: pointer; }
.yg-motion-range-ends, .yg-motion-dial-options { display: flex; justify-content: space-between; gap: 8px; color: var(--yg-muted); font-size: 0.8em; }
.yg-motion-password label, .yg-motion-dial > label { font-weight: 600; }
.yg-motion-password > input { box-sizing: border-box; inline-size: 100%; padding: 12px; border: 1px solid var(--yg-off); border-radius: var(--yg-radius-control, 8px); background: var(--yg-field); color: inherit; font: inherit; }
.yg-motion-password-meter { display: flex; gap: 4px; }
.yg-motion-password-meter span { flex: 1; height: 4px; border-radius: 4px; background: var(--yg-field); transition: background-color var(--yg-change, 180ms); }
.yg-motion-password-meter span[data-active] { background: var(--yg-action); }
.yg-motion-password-checks { font-size: .85em; color: var(--yg-muted); }
.yg-motion-password-checks ul { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 4px; }
.yg-motion-password-checks li[data-passed] { color: var(--yg-text, inherit); }
.yg-motion-checklist { border: 0; padding: 0; margin: 0; display: grid; gap: 8px; min-inline-size: 0; }
.yg-motion-checklist legend { font-weight: 600; margin-bottom: 12px; }
.yg-motion-checklist-item { display: flex; gap: 10px; align-items: center; padding: 12px; border: 1px solid var(--yg-off); border-radius: 8px; cursor: pointer; }
.yg-motion-checklist-item:has(input:checked) { background: var(--yg-action-soft); }
.yg-motion-checklist-item input { accent-color: var(--yg-action); }
.yg-motion-dial { justify-items: center; }
.yg-motion-dial-face { position: relative; display: grid; place-items: center; inline-size: 144px; aspect-ratio: 1; border: 1px solid var(--yg-off); border-radius: 50%; background: var(--yg-field); box-shadow: inset 0 0 0 8px var(--yg-surface, transparent); }
.yg-motion-dial-marker { position: absolute; inset: 8px; border-radius: 50%; transform: rotate(var(--yg-dial-angle)); transition: transform var(--yg-change, 180ms) var(--yg-settle, ease); }
.yg-motion-dial-marker::before { content: ""; position: absolute; inset-block-start: 0; inset-inline-start: calc(50% - 2px); inline-size: 4px; block-size: 13px; border-radius: 4px; background: var(--yg-action); }
.yg-motion-dial-value { max-inline-size: 90px; text-align: center; font-weight: 600; }
.yg-motion-dial-options { inline-size: 100%; flex-wrap: wrap; }
.yg-motion-dial-options [data-selected] { color: var(--yg-text, inherit); font-weight: 600; }
@media (prefers-reduced-motion: reduce) { .yg-motion-password-meter span, .yg-motion-dial-marker { transition: none; } }

.yg-hold-confirm, .yg-slide-confirm {
  position: relative;
  display: inline-grid;
  place-items: center;
  min-block-size: 48px;
  min-inline-size: 220px;
  padding: var(--boa-space-12) var(--boa-space-24);
  overflow: hidden;
  border: 1px solid var(--yg-action);
  border-radius: var(--boa-radius-round);
  background: var(--yg-field);
  color: var(--yg-text);
  font: inherit;
  cursor: pointer;
  user-select: none;
}
.yg-hold-confirm:focus-visible, .yg-slide-confirm:focus-visible {
  outline: 2px solid var(--yg-action);
  outline-offset: 3px;
}
.yg-confirm-fill {
  position: absolute;
  inset: 0;
  background: var(--yg-action-soft);
  transform: scaleX(var(--yg-confirm-progress, 0));
  transform-origin: left center;
  pointer-events: none;
}
.yg-confirm-label { position: relative; pointer-events: none; }
.yg-slide-confirm { touch-action: pan-y; padding-inline: 52px; }
.yg-slide-confirm-handle {
  position: absolute;
  left: calc(4px + var(--yg-confirm-progress, 0) * (100% - 48px));
  inline-size: 40px;
  block-size: 40px;
  display: grid;
  place-items: center;
  border-radius: var(--boa-radius-round);
  background: var(--yg-action);
  color: var(--yg-on-action, white);
  pointer-events: none;
}
@media (prefers-reduced-motion: reduce) {
  .yg-hold-confirm, .yg-slide-confirm, .yg-confirm-fill, .yg-slide-confirm-handle { transition: none; animation: none; }
}

.yg-root {
  color-scheme: light dark;
  color: var(--yg-text);
  background: var(--yg-canvas);
  font: var(--yg-font-body);
  text-align: start;
}
.yg-root[data-appearance="light"] {
  color-scheme: light;
}
.yg-root[data-appearance="dark"] {
  color-scheme: dark;
}
.yg-root,
.yg-root :where(*, ::before, ::after) {
  box-sizing: border-box;
}
.yg-root :where(button, input, select, textarea) {
  font: inherit;
  color: inherit;
}
.yg-root :where(button, summary, select) {
  cursor: pointer;
  touch-action: manipulation;
}
.yg-root :where(:disabled, [aria-disabled="true"]) {
  cursor: default;
}
.yg-root :where(:focus-visible) {
  outline: var(--boa-stroke-focus) solid var(--yg-action);
  outline-offset: 2px;
}
.yg-root [hidden] {
  display: none !important;
}
.yg-heading {
  margin: 0;
  letter-spacing: -0.025em;
  font: var(--yg-font-heading);
  text-wrap: balance;
}
.yg-text {
  font: var(--yg-font-body);
}
.yg-help,
.yg-text[data-type="help"],
.yg-error {
  display: block;
  margin: 0;
  font: var(--yg-font-help);
  color: var(--yg-muted);
}
.yg-meta,
.yg-text[data-type="meta"] {
  font: var(--yg-font-meta);
  color: var(--yg-muted);
  font-variant-numeric: tabular-nums;
}
.yg-error {
  color: var(--yg-danger);
}
.yg-label {
  display: block;
  font: var(--yg-font-action);
}
.yg-stack,
.yg-grid,
.yg-field {
  display: grid;
  gap: var(--yg-gap, var(--boa-space-8));
  min-width: 0;
  align-content: start;
}
.yg-inline,
.yg-bottom-action,
.yg-modal-header {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--yg-gap, var(--boa-space-8));
  min-width: 0;
}
.yg-grid {
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 12rem), 1fr));
}
.yg-surface {
  padding: var(--boa-space-16);
  border-radius: var(--yg-radius-panel);
  background: var(--yg-surface);
}
.yg-divider {
  border: 0;
  height: 1px;
  width: 100%;
  background: var(--yg-hover);
  margin: var(--boa-space-8) 0;
}
.yg-scroll {
  overflow: auto;
  overscroll-behavior: contain;
  max-block-size: 15rem;
  scrollbar-width: thin;
}
.yg-icon {
  inline-size: var(--yg-glyph);
  block-size: var(--yg-glyph);
  flex: none;
  vertical-align: middle;
}
.yg-button,
.yg-reading-anchor {
  border: 0;
  appearance: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  vertical-align: middle;
  gap: var(--boa-space-8);
  min-block-size: var(--yg-size-regular);
  padding: var(--boa-space-4) var(--yg-inset-regular);
  border-radius: var(--yg-radius-control);
  background: var(--yg-action);
  color: var(--yg-on-action);
  font: var(--yg-font-action);
  text-align: center;
  overflow-wrap: anywhere;
  transition: background-color var(--yg-press) linear;
}
.yg-button[data-control-size="compact"] {
  min-block-size: var(--yg-size-compact);
  padding-inline: var(--yg-inset-compact);
  border-radius: var(--yg-radius-small);
}
.yg-button[data-control-size="touch"] {
  min-block-size: var(--yg-size-touch);
  padding-inline: var(--yg-inset-roomy);
}
.yg-button[data-emphasis="soft"] {
  background: var(--yg-action-soft);
  color: var(--yg-action);
}
.yg-button[data-emphasis="quiet"],
.yg-reading-anchor {
  background: transparent;
  color: var(--yg-action);
}
.yg-button[data-tone="danger"] {
  --yg-action: var(--yg-danger);
  --yg-on-action: light-dark(
    var(--boa-color-coral-50),
    var(--boa-color-coral-950)
  );
  --yg-action-soft: var(--yg-danger-soft);
  --yg-action-hover: light-dark(
    var(--boa-color-coral-800),
    var(--boa-color-coral-100)
  );
  --yg-action-press: light-dark(
    var(--boa-color-coral-900),
    var(--boa-color-coral-300)
  );
  --yg-action-soft-hover: light-dark(
    var(--boa-color-coral-100),
    var(--boa-color-coral-850)
  );
}
.yg-button-label,
.yg-sdk-Button-ButtonInner {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--boa-space-8);
}
.yg-button-label {
  transition: transform var(--yg-press) var(--yg-settle);
}
.yg-button:active:not(:disabled, [aria-disabled="true"]) .yg-button-label {
  transform: translateY(1px);
}
.yg-button[data-emphasis="filled"]:active:not(
    :disabled,
    [aria-disabled="true"]
  ) {
  background: var(--yg-action-press);
}
.yg-button:is(:disabled, [aria-disabled="true"]):not([aria-busy="true"]) {
  color: var(--yg-muted);
  background: var(--yg-field);
}
.yg-icon-button {
  width: var(--yg-size-icon);
  min-height: var(--yg-size-icon);
  padding: 0;
  flex: none;
}
.yg-bottom-action {
  padding: var(--boa-space-12) 0
    max(var(--boa-space-12), env(safe-area-inset-bottom));
  background: var(--yg-canvas);
}
.yg-bottom-action > * {
  flex: 1;
}
.yg-spinner {
  width: 0.8em;
  height: 0.8em;
  border: 1.5px solid currentColor;
  border-inline-end-color: transparent;
  border-radius: 50%;
  animation: yg-spin var(--yg-busy) linear infinite;
}
@keyframes yg-spin {
  to {
    transform: rotate(1turn);
  }
}
.yg-field {
  gap: var(--boa-space-4);
}

.extra-exposure-preview { height: 96px; border-radius: 12px; background: linear-gradient(135deg, #263e58, #eab871); transition: filter 180ms ease; }
.extra-disclosure { border: 1px solid var(--yg-off); border-radius: 10px; padding: 12px; }
.extra-disclosure summary { cursor: pointer; font-weight: 600; }
.extra-toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.extra-toolbar > button, .extra-counter button { border: 1px solid var(--yg-off); background: var(--yg-field); color: inherit; border-radius: 8px; padding: 8px 12px; cursor: pointer; }
.extra-toolbar > button[aria-pressed="true"] { background: var(--yg-action-soft); }
.extra-rating { border: 0; padding: 0; margin: 0; }
.extra-rating legend { font-weight: 600; }
.extra-rating > div { display: flex; gap: 4px; margin-top: 8px; }
.extra-rating label { position: relative; cursor: pointer; font-size: 30px; color: var(--yg-action); }
.extra-rating input { position: absolute; opacity: 0; }
.extra-rating input:focus-visible + span { outline: 2px solid currentColor; outline-offset: 2px; }
.extra-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
.extra-counter { display: flex; align-items: center; gap: 20px; }
.extra-counter button:disabled { opacity: .45; cursor: default; }
.extra-page, .extra-zoom-frame, .extra-card { border: 1px solid var(--yg-off); background: var(--yg-field); border-radius: 12px; padding: 18px; }
.extra-page span, .extra-card small { font-size: .75em; opacity: .7; }
.extra-zoom-frame { height: 100px; display: grid; place-items: center; overflow: hidden; }
.extra-zoom-frame > div { font-size: 36px; transition: transform 180ms ease; }
.extra-card { display: grid; gap: 20px; min-height: 100px; }
.extra-card strong { font-variant-numeric: tabular-nums; letter-spacing: .06em; }
.extra-card span { font-size: .8em; }
@media (prefers-reduced-motion: reduce) { .extra-exposure-preview, .extra-zoom-frame > div { transition: none; } }

.utility-demo { display: grid; justify-items: start; gap: 10px; width: min(100%, 300px); }
.utility-demo > span, .utility-demo small { color: var(--yg-muted, #666); }
.utility-demo small { font-size: .7rem; letter-spacing: .08em; }
.utility-panel { box-sizing: border-box; padding: 18px; border-radius: var(--yg-radius-panel); background: var(--yg-action-soft); }
.utility-row { display: flex; align-items: center; gap: 8px; }
.utility-player { grid-template-columns: auto 1fr; align-items: center; }
.utility-player > div:not(.utility-row) { display: grid; gap: 3px; }
.utility-player .utility-row { grid-column: 1 / -1; }
.utility-record, .utility-lock, .utility-bell { display: grid; place-items: center; width: 54px; height: 54px; border: 0; border-radius: 50%; background: var(--yg-action-soft); color: var(--yg-action); font-size: 25px; }
.utility-record[data-playing] { animation: utility-rotate 4s linear infinite; }
.utility-badge { display: inline-grid; place-items: center; min-width: 1.4em; min-height: 1.4em; margin-inline-start: 8px; border-radius: 50%; background: #fff3; }
.utility-dots { display: flex; gap: 8px; }
.utility-dots button { width: 12px; height: 12px; padding: 0; border: 0; border-radius: 999px; background: var(--yg-action); opacity: .35; cursor: pointer; transition: width 180ms var(--yg-settle), opacity 180ms var(--yg-settle); }
.utility-dots button[aria-current] { width: 28px; opacity: 1; }
.utility-bell { position: relative; cursor: pointer; transition: transform 180ms var(--yg-settle); }
.utility-bell:hover { transform: rotate(-10deg); }
.utility-bell i { position: absolute; inset: 8px 8px auto auto; width: 9px; height: 9px; border-radius: 50%; background: var(--yg-action); }
.utility-indicator { width: 10px; height: 10px; border-radius: 50%; background: var(--yg-muted, #777); }
.utility-indicator[data-on] { background: #2b8b63; box-shadow: 0 0 0 4px #2b8b6322; }
.utility-label { display: grid; gap: 6px; width: 100%; font-weight: 600; }
.utility-label input { box-sizing: border-box; width: 100%; padding: 10px; border: 1px solid var(--yg-border, #aaa); border-radius: var(--yg-radius-control); background: var(--yg-surface); color: inherit; font: inherit; }
.utility-greeting { margin: 4px 0 0; font-size: 1.35rem; overflow-wrap: anywhere; }
.utility-demo :is(button, input):focus-visible { outline: var(--boa-stroke-focus) solid var(--yg-action); outline-offset: 3px; }
@keyframes utility-rotate { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .utility-record[data-playing] { animation: none; } .utility-dots button, .utility-bell { transition: none; } .utility-bell:hover { transform: none; } }

.expression { display: grid; justify-items: center; gap: 12px; text-align: center; min-width: 0; }
.expression p { margin: 0; }
.expression button { cursor: pointer; font: inherit; }
.expression-dock { display: flex; align-items: end; gap: 6px; padding: 10px; border-radius: 24px; background: var(--yg-field); }
.expression-dock button { display: grid; gap: 4px; justify-items: center; border: 0; background: transparent; color: inherit; transition: transform 280ms cubic-bezier(.2, 1.6, .4, 1); }
.expression-dock button:is(:hover, :focus-visible), .expression-dock button[aria-pressed="true"] { transform: translateY(-8px) scale(1.12); }
.expression-dock button span { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 14px; background: var(--yg-action-soft); font-size: 24px; }
.expression-dock small { font-size: 11px; }
.expression-cord { min-height: 170px; }
.expression-lamp { width: 70px; height: 35px; border-radius: 50px 50px 12px 12px; background: var(--yg-muted); transition: background 250ms, box-shadow 250ms; }
.expression-cord[data-lit="true"] .expression-lamp { background: #eab85c; box-shadow: 0 12px 32px #eab85c80; }
.expression-cord button { display: grid; justify-items: center; gap: 6px; border: 0; background: transparent; color: inherit; }
.expression-cord button span { height: 42px; width: 2px; background: currentColor; transform-origin: top; transition: transform 300ms; }
.expression-cord button:active span { transform: scaleY(1.3); }
.expression-magnet { padding: 15px 24px; border: 0; border-radius: 999px; background: var(--yg-action); color: var(--yg-on-action); transition: transform 250ms cubic-bezier(.2, 1.6, .4, 1); }
.expression-magnet:hover { transform: scale(1.08); }.expression-magnet:active { transform: scale(.92); }
.expression-burst-wrap { position: relative; }.expression-burst { width: 64px; height: 64px; border: 0; border-radius: 50%; background: var(--yg-action-soft); color: var(--yg-action); font-size: 28px; }
.expression-sparks { position: absolute; inset: 0; pointer-events: none; }.expression-sparks i { position: absolute; inset: 20px; color: var(--yg-action); animation: expression-spark 650ms ease-out both; font-style: normal; }.expression-sparks i:nth-child(2) { --x: 38px; --y: -35px; }.expression-sparks i:nth-child(3) { --x: -40px; --y: 20px; }.expression-sparks i:nth-child(4) { --x: 36px; --y: 30px; }
@keyframes expression-spark { to { translate: var(--x, -35px) var(--y, -35px); opacity: 0; } }
.expression-type { font-size: 1.7rem; }.expression-word { display: inline-block; color: var(--yg-action); animation: expression-roll 350ms ease-out; } @keyframes expression-roll { from { opacity: 0; transform: translateY(.7em); } }
.expression-weight { font-size: 2rem; }.expression-weight span { display: inline-block; animation: expression-weight 600ms ease-in-out; } @keyframes expression-weight { 50% { transform: translateY(-.25em) scale(1.2); font-weight: 900; } }
.expression-typewriter { width: 27ch; max-width: 100%; overflow: hidden; white-space: nowrap; border-right: 2px solid; animation: expression-write 2s steps(27, end) both; } @keyframes expression-write { from { width: 0; } }
.expression-scramble { font: 700 1.8rem monospace; letter-spacing: .1em; }
.expression-lens { display: grid; place-items: center; width: 100px; height: 100px; overflow: hidden; border-radius: 50%; background: var(--yg-action-soft); color: var(--yg-action); }.expression-lens span { font-size: 4rem; transition: transform 150ms; }.expression label { display: flex; align-items: center; gap: 8px; }
.expression-menu-trigger { min-width: 110px; padding: 10px 16px; border-radius: 999px; border: 0; background: var(--yg-action); color: var(--yg-on-action); }.expression-menu { display: flex; gap: 6px; padding: 8px; border-radius: 18px; background: var(--yg-field); animation: expression-menu-open 250ms ease-out; }.expression-menu[hidden] { display: none; }.expression-menu button { border: 0; border-radius: 12px; padding: 8px; background: var(--yg-surface); color: inherit; } @keyframes expression-menu-open { from { opacity: 0; transform: scale(.7); border-radius: 999px; } }
.expression-attention { position: relative; border: 0; border-radius: 999px; padding: 12px 18px; background: var(--yg-action); color: var(--yg-on-action); }.expression-attention[data-on="true"]::after { content: ""; position: absolute; inset: -5px; border: 2px solid var(--yg-action); border-radius: inherit; animation: expression-ring 1.5s ease-out infinite; } @keyframes expression-ring { to { inset: -15px; opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .expression *, .expression *::after { animation: none !important; transition: none !important; } .expression-typewriter { width: auto; border-right: 0; } .expression-dock button:is(:hover, :focus-visible), .expression-dock button[aria-pressed="true"] { transform: none; } }
