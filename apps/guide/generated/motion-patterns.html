  --yg-font-heading: var(--boa-role-weight-heading) 1.375rem/1.75rem var(--boa-font-family);
  --yg-font-display: var(--boa-role-weight-heading) 2.5rem/2.75rem var(--boa-font-family);
  --yg-font-touch: var(--boa-weight-regular) 1rem/1.5rem var(--boa-font-family);
}
.yg-root[data-material="paper"] {
  --yg-canvas: light-dark(var(--boa-color-paper-25), var(--boa-color-paper-975));
  --yg-surface: light-dark(var(--boa-color-paper-50), var(--boa-color-paper-950));
  --yg-field: light-dark(var(--boa-color-paper-100), var(--boa-color-paper-850));
  --yg-hover: light-dark(var(--boa-color-paper-200), var(--boa-color-paper-800));
  --yg-text: light-dark(var(--boa-color-paper-950), var(--boa-color-paper-50));
  --yg-muted: light-dark(var(--boa-color-paper-700), var(--boa-color-paper-300));
}
.yg-root[data-material="mist"] {
  --yg-canvas: light-dark(var(--boa-color-mist-25), var(--boa-color-mist-975));
  --yg-surface: light-dark(var(--boa-color-mist-50), var(--boa-color-mist-950));
  --yg-field: light-dark(var(--boa-color-mist-100), var(--boa-color-mist-850));
  --yg-hover: light-dark(var(--boa-color-mist-200), var(--boa-color-mist-800));
  --yg-text: light-dark(var(--boa-color-mist-950), var(--boa-color-mist-50));
  --yg-muted: light-dark(var(--boa-color-mist-700), var(--boa-color-mist-300));
}

/* Extended component anatomy. All color roles follow the nearest Yogurt. */
.yg-bottom-action[data-fixed] {
  position: fixed;
  inset-inline: 0;
  inset-block-end: 0;
  z-index: 3;
  padding: var(--boa-space-12) var(--boa-space-16)
    max(var(--boa-space-12), env(safe-area-inset-bottom));
  background: var(--yg-canvas);
}
.yg-aspect {
  width: 100%;
  overflow: hidden;
  border-radius: var(--yg-radius-control);
}
.yg-aspect > :is(img, video) {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.yg-card,
.yg-elevation,
.yg-gradient,
.yg-slide,
.yg-sidebar {
  padding: var(--yg-inset-panel);
  border-radius: var(--yg-radius-panel);
  background: var(--yg-surface);
}
.yg-card {
  display: grid;
  border-radius: var(--yg-radius-card);
  gap: var(--yg-gap-stack);
  align-content: start;

}
.yg-card p,
.yg-section-line p,
.yg-stepper p,
.yg-post p {
  margin: 0;
}
.yg-asset,
.yg-avatar {
  display: inline-grid;
  place-items: center;
  flex: none;
  overflow: hidden;
  vertical-align: middle;
}
.yg-asset[data-framed],
.yg-avatar {
  background: var(--yg-action-soft);
  color: var(--yg-action);
  border-radius: var(--yg-radius-control);
}
.yg-asset > :is(img, video, svg),
.yg-avatar img {
  max-width: 100%;
  max-height: 100%;
  object-fit: cover;
}
.yg-avatar {
  border-radius: 50%;

}
.yg-gradient {
  background: linear-gradient(115deg, var(--yg-action-soft), var(--yg-surface));
}
.yg-gradient[data-tone="accent"] {
  background: linear-gradient(
    115deg,
    var(--yg-accent-soft),
    var(--yg-action-soft)
  );
}
.yg-gradient[data-tone="success"] {
  background: linear-gradient(
    115deg,
    var(--yg-success-soft),
    var(--yg-surface)
  );
}
.yg-gradient[data-tone="warning"] {
  background: linear-gradient(
    115deg,
    var(--yg-warning-soft),
    var(--yg-surface)
  );
}
.yg-gradient[data-tone="danger"] {
  background: linear-gradient(115deg, var(--yg-danger-soft), var(--yg-surface));
}
.yg-gradient[data-tone="neutral"] {
  background: linear-gradient(115deg, var(--yg-field), var(--yg-surface));
}
.yg-elevation {

}
.yg-elevation[data-level="raised"] {

.yg-elevation[data-level="floating"],

.yg-shortcut {

.yg-post {

.yg-post > * + * {

.yg-grid-list,
.yg-stepper,
.yg-trace ol,
.yg-bars ul,
.yg-navigation-menu ul {

  padding: 0;
}
.yg-grid-list {

.yg-section-line,
.yg-value-row,
.yg-code header,
.yg-carousel footer,
.yg-quantity,
.yg-range > div,
.yg-sidebar header,
.yg-navbar,
.yg-attachment {

.yg-section-line,

}
.yg-section-line .yg-heading {

}
.yg-bottom-info {

.yg-bars ul {

.yg-bubble {

.yg-attachment,
.yg-code,
.yg-quantity > div,

.yg-attachment {

.yg-code header {

.yg-trace details > div {

.yg-input-group {

.yg-navigation-menu li > button,
.yg-date-trigger,
.yg-sidebar a,
.yg-flyout [role="menuitem"],
.yg-flyout a,

}

}
.yg-step-number {

.yg-button .yg-button-label {

  display: inline-flex;

  justify-content: center;
  gap: var(--boa-space-8);
  min-inline-size: 0;
}

  position: absolute;
  inset: 0;

.yg-input,
.yg-select,
.yg-standalone {
  transition: background-color var(--yg-change, var(--yg-travel)) var(--yg-settle);
}

.yg-input:has(:is(input, textarea):focus-visible),
.yg-select:has(select:focus-visible),
.yg-standalone:focus-visible {
  background-color: var(--yg-hover);
}

.yg-switch [role="switch"] {
  transition: background-color var(--yg-travel) var(--yg-settle);
}

.yg-switch [role="switch"] > span {
  transition:
    transform var(--yg-travel) var(--yg-settle),
    background-color var(--yg-travel) var(--yg-settle);
}

.yg-checkbox [role="checkbox"],
.yg-radio [role="radio"],
.yg-toggle-item,
.yg-rating label,
.yg-otp-slots > span {
  transition:
    background-color var(--yg-change, var(--yg-travel)) var(--yg-settle),
    color var(--yg-change, var(--yg-travel)) var(--yg-settle);
}

.yg-otp:focus-within [data-cursor] {
  background-color: var(--yg-action-soft);
}

.yg-rating label > span {
  pointer-events: none;
  transition: transform var(--yg-press) var(--yg-settle);
}

.yg-rating label:has(input:active) > span {
  transform: translateY(1px);
}

.yg-range input:not(:disabled):active {
  accent-color: var(--yg-action-press);
}

.yg-progress {
  position: relative;
}

.yg-progress progress {
  position: absolute;
  inline-size: 1px;
  block-size: 1px;
  clip-path: inset(50%);
}

.yg-progress > .yg-progress-track {
  display: block;
  block-size: 6px;
  overflow: hidden;
  border-radius: var(--boa-radius-round);
  background: var(--yg-field);
}

.yg-progress-track > span {
  display: block;
  block-size: 100%;
  border-radius: inherit;
  background: var(--yg-action);
  transform: scaleX(var(--yg-progress-completion, 0));
  transform-origin: left center;
  transition: transform var(--yg-change, var(--yg-travel)) var(--yg-settle);
}

.yg-progress-track:dir(rtl) > span {
  transform-origin: right center;
}

.yg-progress progress:not([value]) + .yg-progress-track > span {
  inline-size: 33.333%;
  transform: none;
  animation: yg-progress-sweep calc(2 * var(--yg-busy, 750ms)) var(--yg-settle) infinite alternate;
}

  animation-name: yg-progress-sweep-rtl;

@keyframes yg-progress-sweep {
  to { transform: translateX(200%); }

@keyframes yg-progress-sweep-rtl {
  to { transform: translateX(-200%); }

.yg-toast {
  animation: yg-toast-arrive var(--yg-change, var(--yg-travel)) var(--yg-settle);

  }

  .yg-radio [role="radio"],
  .yg-toggle-item,

.yg-root {
  --yg-surface-edge: color-mix(in srgb, var(--yg-text) 11%, transparent);
  --yg-active-edge: color-mix(in srgb, var(--yg-action) 17%, transparent);
  --yg-raised-surface: light-dark(var(--yg-canvas), var(--yg-surface));
  color-scheme: light dark;
  color: var(--yg-text);
  background: var(--yg-canvas);
  font: var(--yg-font-body);
  letter-spacing: var(--boa-tracking-body);
  text-align: start;
}
.yg-root[data-appearance="light"] {
  color-scheme: light;
}
.yg-root[data-appearance="dark"] {
  color-scheme: dark;
}
.yg-root,
.yg-root :where(*, ::before, ::after) {
  box-sizing: border-box;
}
.yg-root :where(button, input, select, textarea) {
  font: inherit;
  color: inherit;
}
.yg-root :where(button, summary, select) {
  cursor: pointer;
  touch-action: manipulation;
}
.yg-root :where(:disabled, [aria-disabled="true"]) {
  cursor: default;
}
.yg-root :where(:focus-visible) {
  outline: var(--boa-stroke-focus) solid var(--yg-action);
  outline-offset: 2px;
}
.yg-root [hidden] {
  display: none !important;
}
.yg-heading {
  margin: 0;
  letter-spacing: var(--boa-tracking-heading);
  font: var(--yg-font-heading);
  text-wrap: balance;
}
.yg-text {
  font: var(--yg-font-body);
}
.yg-help,
.yg-text[data-type="help"],
.yg-error {
  display: block;
  margin: 0;
  font: var(--yg-font-help);
  color: var(--yg-muted);
}
.yg-meta,
.yg-text[data-type="meta"] {
  font: var(--yg-font-meta);
  letter-spacing: var(--boa-tracking-meta);
  color: var(--yg-muted);
  font-variant-numeric: tabular-nums;
}
.yg-error {
  color: var(--yg-danger);
}
.yg-label {
  display: block;
  font: var(--yg-font-action);
  letter-spacing: var(--boa-tracking-label);
}
.yg-stack,
.yg-grid,
.yg-field {
  display: grid;
  gap: var(--yg-gap, var(--boa-space-8));
  min-width: 0;
  align-content: start;
}
.yg-inline,
.yg-bottom-action,
.yg-modal-header {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--yg-gap, var(--boa-space-8));
  min-width: 0;
}
.yg-grid {
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 12rem), 1fr));
}
.yg-surface {
  padding: var(--boa-space-16);
  border-radius: var(--yg-radius-panel);
  background: var(--yg-surface);
}
.yg-divider {
  border: 0;
  height: 1px;
  width: 100%;
  background: var(--yg-hover);
  margin: var(--boa-space-8) 0;
}
.yg-scroll {
  overflow: auto;
  overscroll-behavior: contain;
  max-block-size: 15rem;
  scrollbar-width: thin;
}
.yg-icon {
  inline-size: var(--yg-glyph);
  block-size: var(--yg-glyph);
  flex: none;
  vertical-align: middle;
}
.yg-button,
.yg-reading-anchor {
  border: 0;
  appearance: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  vertical-align: middle;
  gap: var(--boa-space-8);
  min-block-size: var(--yg-size-regular);
  padding: var(--boa-space-4) var(--yg-inset-regular);
  border-radius: var(--yg-radius-control);
  background: var(--yg-action);
  color: var(--yg-on-action);
  font: var(--yg-font-action);
  letter-spacing: var(--boa-tracking-label);
  text-align: center;
  overflow-wrap: anywhere;
  transition: background-color var(--yg-press) linear;
}
.yg-button[data-control-size="compact"] {
  min-block-size: var(--yg-size-compact);
  padding-inline: var(--yg-inset-compact);
  border-radius: var(--yg-radius-small);
  font: var(--yg-font-compact);
}
.yg-button[data-control-size="touch"] {
  min-block-size: var(--yg-size-touch);
  padding-inline: var(--yg-inset-roomy);
}
.yg-button[data-emphasis="filled"] {
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--yg-on-action) 14%, transparent);
}
.yg-button[data-emphasis="soft"] {
  background: var(--yg-action-soft);
  color: var(--yg-action);
}
.yg-button[data-emphasis="quiet"],
.yg-reading-anchor {
  background: transparent;
  color: var(--yg-action);
}
.yg-button[data-tone="danger"] {
  --yg-action: var(--yg-danger);
  --yg-on-action: light-dark(
    var(--boa-color-coral-50),
    var(--boa-color-coral-950)
  );
  --yg-action-soft: var(--yg-danger-soft);
  --yg-action-hover: light-dark(
    var(--boa-color-coral-800),
    var(--boa-color-coral-100)
  );
  --yg-action-press: light-dark(
    var(--boa-color-coral-900),
    var(--boa-color-coral-300)
  );
  --yg-action-soft-hover: light-dark(
    var(--boa-color-coral-100),
    var(--boa-color-coral-850)
  );
}
.yg-button-label,
.yg-sdk-Button-ButtonInner {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--boa-space-8);
}
.yg-button-label {
  transition: transform var(--yg-press) var(--yg-settle);
}
.yg-button:active:not(:disabled, [aria-disabled="true"]) .yg-button-label {
  transform: translateY(1px);
}
.yg-button[data-emphasis="filled"]:active:not(
    :disabled,
    [aria-disabled="true"]
  ) {
  background: var(--yg-action-press);
}
.yg-button:is(:disabled, [aria-disabled="true"]):not([aria-busy="true"]) {
  color: var(--yg-muted);
  background: var(--yg-field);
  box-shadow: none;
}
.yg-icon-button {
  width: var(--yg-size-icon);
  min-height: var(--yg-size-icon);
  border-radius: var(--yg-radius-small);

:where(.extra-deck, .extra-pages, .extra-reading, .extra-text, .extra-note, .extra-pass) { display: grid; gap: 16px; width: min(100%, 360px); }
:where(.extra-deck, .extra-pages, .extra-reading, .extra-text, .extra-note, .extra-pass, .extra-ticket) button, button.extra-ticket { font: inherit; cursor: pointer; }
.extra-actions { display: flex; flex-wrap: wrap; gap: var(--yg-gap-inline); }
.extra-deck-sheet, .extra-page, .extra-note, .extra-pass, .extra-check-card, .extra-ticket { border: 1px solid var(--yg-surface-edge); border-radius: var(--yg-radius-panel); background: var(--yg-canvas); padding: var(--yg-inset-panel); }
.extra-deck-sheet, .extra-page { min-height: 150px; box-shadow: var(--yg-lift-shadow); }
:where(.extra-deck-sheet, .extra-page, .extra-note) p { font-size: 1.3rem; line-height: 1.3; }
.extra-ticket { display: grid; gap: 22px; width: min(100%, 320px); text-align: start; transform: rotate(-2deg); }
.extra-ticket[data-tilt="true"] { transform: rotate(2deg) translateY(-4px); background: var(--yg-action-soft); }
.extra-ticket strong, .extra-pass strong { font-size: 1.5rem; }
.extra-pass > div { display: grid; gap: var(--yg-gap-inline); }
.extra-pass p { border-top: 1px dashed currentColor; padding-top: 12px; margin: 0; }
.extra-text p { font-size: 1.5rem; line-height: 1.4; margin: 0; }
.extra-marker { background: linear-gradient(transparent 58%, var(--yg-action-soft) 58%); background-size: 0 100%; background-repeat: no-repeat; }
.extra-marker[data-marked="true"] { background-size: 100% 100%; }
.extra-reading ol { display: grid; gap: var(--yg-gap-stack); margin: 0; padding-left: 1.5em; }
.extra-reading li { opacity: .6; }
.extra-reading li[data-current="true"] { opacity: 1; font-weight: 700; }
.extra-note { background: var(--yg-action-soft); }
.extra-word { display: inline-block; }
.extra-check-card { display: flex; align-items: center; gap: var(--yg-gap-stack); cursor: pointer; width: min(100%, 360px); }
.extra-check-card[data-done="true"] { background: var(--yg-action-soft); }
.extra-check-card span { display: grid; gap: 4px; }
@media (prefers-reduced-motion: no-preference) {
  .extra-ticket { transition: transform var(--yg-travel) var(--yg-settle), background-color var(--yg-travel) var(--yg-settle); }
  .extra-marker { transition: background-size var(--yg-travel) var(--yg-settle); }
  .extra-page, .extra-word { animation: extra-card-arrive var(--yg-change) var(--yg-settle); }
}
@keyframes extra-card-arrive { from { opacity: 0; transform: translateY(5px); } }

.motion-extra { display: grid; justify-items: start; gap: var(--yg-gap-stack); width: min(100%, 320px); }
.motion-extra > .yg-field { inline-size: 100%; }
.motion-extra small, .motion-extra > span { color: var(--yg-muted); }
.motion-extra-chips, .motion-extra-toolbar, .motion-extra-rating { display: flex; flex-wrap: wrap; gap: 6px; }
.motion-extra-chips button, .motion-extra-toolbar button { border: 0; border-radius: var(--yg-radius-control); padding: var(--yg-inset-layer) var(--yg-inset-compact); min-block-size: var(--yg-size-compact); background: var(--yg-action-soft); color: var(--yg-action); font: inherit; cursor: pointer; transition: transform 180ms var(--yg-settle); }
.motion-extra-toolbar button[aria-pressed="true"] { background: var(--yg-action); color: var(--yg-on-action); }
.motion-extra-chips button:hover, .motion-extra-toolbar button:hover { transform: translateY(-2px); }
.motion-extra-wheel { display: grid; justify-items: center; gap: 6px; min-width: 140px; }
.motion-extra-wheel output { display: grid; place-items: center; width: 100%; min-height: 52px; border-radius: var(--yg-radius-panel); background: var(--yg-action-soft); color: var(--yg-action); font-weight: 650; }
.motion-extra-track { overflow: hidden; width: 100%; height: 8px; border-radius: var(--yg-radius-control); background: var(--yg-action-soft); }
.motion-extra-track span { display: block; height: 100%; background: var(--yg-action); transition: width 200ms var(--yg-settle); }
.motion-extra-refresh { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; background: var(--yg-action-soft); color: var(--yg-action); font-size: 26px; animation: motion-extra-turn 450ms var(--yg-settle); }
.motion-extra-rating button { border: 0; padding: 2px; background: none; color: var(--yg-action); font-size: 28px; cursor: pointer; }
.motion-extra button:focus-visible, .motion-extra input:focus-visible { outline: var(--boa-stroke-focus) solid var(--yg-action); outline-offset: 3px; }
@keyframes motion-extra-turn { from { transform: rotate(-90deg) scale(.8); opacity: .4; } to { transform: rotate(0) scale(1); opacity: 1; } }

.extra-gesture { display: grid; gap: var(--yg-gap-stack); width: min(100%, 320px); }

.extra-rating input { position: absolute; opacity: 0; }

.extra-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
.extra-counter { display: flex; align-items: center; gap: 20px; }

.extra-page span, .extra-card small { font-size: .75em; opacity: .7; }

.utility-demo { display: grid; justify-items: start; gap: 10px; width: min(100%, 300px); }
