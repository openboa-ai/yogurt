.yg-hold-confirm:focus-visible, .yg-slide-confirm:focus-visible {
  outline: var(--boa-stroke-focus) solid var(--yg-inverse);
  outline-offset: 3px;
}
.yg-confirm-fill {
  position: absolute;
  inset: 0;
  background: color-mix(in srgb, currentColor 15%, transparent);
  transform: scaleX(var(--yg-confirm-progress, 0));
  transform-origin: left center;
  pointer-events: none;
}
.yg-confirm-label {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: var(--yg-gap-inline);
  text-align: center;
  pointer-events: none;
}
.yg-slide-confirm .yg-confirm-fill {
  display: grid;
  place-items: center;
  padding-inline: 36px var(--yg-inset-regular);
  background: var(--yg-text);
  color: var(--yg-canvas);
  clip-path: inset(0 calc(100% - var(--yg-thumb-offset) - 24px) 0 0);
  opacity: min(1, var(--yg-confirm-progress, 0) * 8);
  transform: none;
}
.yg-slide-confirm:dir(rtl) .yg-confirm-fill {
  clip-path: inset(0 0 0 calc(100% - var(--yg-thumb-offset) - 24px));
}
.yg-slide-confirm-handle {
  position: absolute;
  inset-inline-start: var(--yg-thumb-offset);
  inline-size: var(--yg-size-spacious);
  block-size: var(--yg-size-spacious);
  display: grid;
  place-items: center;
  border-radius: var(--boa-radius-round);
  background: var(--yg-raised-surface);
  color: var(--yg-text);
  box-shadow: 0 1px 2px var(--yg-surface-edge), inset 0 0 0 1px var(--yg-surface-edge);
  pointer-events: none;
}
.yg-slide-confirm-handle .yg-icon { inline-size: 20px; block-size: 20px; }
.yg-slide-confirm:dir(rtl):not([data-done]) .yg-slide-confirm-handle .yg-icon { transform: scaleX(-1); }
.yg-hold-confirm[data-done] { background: var(--yg-text); color: var(--yg-canvas); }
.yg-hold-confirm[data-done] .yg-confirm-fill { opacity: 0; }
.yg-slide-confirm[data-done] .yg-confirm-fill {
  padding-inline: var(--yg-inset-regular) 36px;
  background: var(--yg-success);
  color: var(--yg-canvas);
  clip-path: none;
}
.yg-slide-confirm[data-done] .yg-slide-confirm-handle { color: var(--yg-success); }
@media (prefers-reduced-motion: no-preference) {
  .yg-hold-confirm { transition: background-color 150ms ease-out, color 150ms ease-out; }
  .yg-hold-confirm .yg-confirm-fill { transition: opacity 150ms ease-out; }
  .yg-hold-confirm:is([data-holding], [data-done]) .yg-confirm-label { animation: yg-hold-label 200ms cubic-bezier(.23, 1, .32, 1) both; }
  .yg-hold-check path { stroke-dasharray: 1; animation: yg-hold-draw 300ms 100ms cubic-bezier(.23, 1, .32, 1) both; }
  .yg-slide-confirm .yg-confirm-fill { transition: clip-path var(--yg-expand) var(--yg-settle), opacity var(--yg-change) ease-out; }
  .yg-slide-confirm-handle { transition: inset-inline-start var(--yg-expand) var(--yg-settle); }
  .yg-slide-confirm[data-dragging] .yg-confirm-fill,
  .yg-slide-confirm[data-dragging] .yg-slide-confirm-handle { transition: none; }
  .yg-slide-confirm[data-done] .yg-slide-confirm-handle svg { animation: yg-confirm-check 260ms var(--yg-arrive); }
}
@keyframes yg-hold-label { from { opacity: 0; translate: 0 10px; filter: blur(2px); } }
@keyframes yg-hold-draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes yg-confirm-check { from { opacity: 0; transform: translateY(6px); } }
@media (forced-colors: active) {
  .yg-hold-confirm, .yg-slide-confirm { box-shadow: inset 0 0 0 1px ButtonText; }
  .yg-slide-confirm-handle { outline: 1px solid ButtonText; }
}

.yg-cart-control {
  --yg-cart-slot: var(--yg-size-regular);
  --yg-cart-open: calc(3 * var(--yg-cart-slot));
  --yg-cart-closed: calc(2 * var(--yg-cart-slot) + var(--boa-space-8));
  --yg-cart-ease: var(--yg-arrive);
  position: relative;
  display: grid;
  justify-items: end;
  inline-size: var(--yg-cart-open);
  max-inline-size: 100%;
  min-block-size: var(--yg-cart-slot);
}
.yg-cart-stepper {
  isolation: isolate;
  position: relative;
  display: grid;
  place-items: center;
  inline-size: min(100%, var(--yg-cart-closed));
  block-size: var(--yg-cart-slot);
  border-radius: var(--boa-radius-round);
  background: var(--yg-raised-surface);
  color: var(--yg-text);
}
.yg-cart-control[data-open="true"] .yg-cart-stepper {
  inline-size: 100%;
  background: var(--yg-text);
  color: var(--yg-canvas);
}
.yg-cart-stepper > button {
  position: absolute;
  inset-block: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-wrap: nowrap;
  cursor: pointer;
  gap: var(--boa-space-4);
  padding: 0;
  border: 0;
  border-radius: var(--boa-radius-round);
  background: transparent;
  color: inherit;
  font: var(--yg-font-action);
  line-height: 1;
  white-space: nowrap;
  touch-action: manipulation;
  user-select: none;
}
.yg-cart-stepper > [hidden] { display: none; }
.yg-cart-stepper > button:focus-visible {
  outline: var(--boa-stroke-focus) solid currentColor;
  outline-offset: -3px;
}
.yg-cart-decrease {
  inset-inline-start: 0;
  inline-size: var(--yg-cart-slot);
}
.yg-cart-increase {
  inset-inline-end: 0;
  inline-size: 100%;
  justify-content: space-between;
  padding-inline: var(--yg-inset-row) calc((var(--yg-cart-slot) - var(--yg-glyph)) / 2);
}
.yg-cart-control[data-open="true"] .yg-cart-increase {
  inline-size: var(--yg-cart-slot);
  justify-content: center;
  padding: 0;
}
.yg-cart-increase[aria-disabled="true"] {
  opacity: .55;
}
.yg-cart-stepper .yg-icon { inline-size: var(--yg-glyph); block-size: var(--yg-glyph); flex: none; }
.yg-cart-quantity {
  font: var(--yg-font-action);
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.yg-cart-quantity { overflow: hidden; }
.yg-cart-roll { position: relative; display: inline-grid; }
.yg-cart-previous { display: none; position: absolute; inset: 0; }
.yg-cart-current { display: block; }
@media (hover: hover) {
  .yg-cart-stepper > button:hover:not([aria-disabled="true"]) {
    background: color-mix(in srgb, currentColor 12%, transparent);
  }
}
@media (prefers-reduced-motion: no-preference) {
  .yg-cart-stepper {
    transition:
      inline-size var(--yg-travel) var(--yg-cart-ease),
      background-color var(--yg-change) var(--yg-cart-ease),
      color var(--yg-change) var(--yg-cart-ease);
  }
  .yg-cart-current { animation: yg-cart-count var(--yg-change) var(--yg-cart-ease) both; }
  .yg-cart-previous {
    display: block;
    animation: yg-cart-count-out var(--yg-change) var(--yg-cart-ease) both;
  }
  .yg-cart-increase > span { animation: yg-cart-label var(--yg-press) var(--yg-cart-ease) both; }
}
@media (prefers-reduced-motion: reduce) {
  .yg-cart-stepper { transition: none; }
  .yg-cart-stepper :is(.yg-cart-current, .yg-cart-previous, .yg-cart-increase > span) {
    animation: none;
  }
}
@keyframes yg-cart-count {
  from { opacity: 0; translate: 0 var(--yg-cart-count-offset, 12px); }
}
@keyframes yg-cart-count-out {
  from { opacity: 1; translate: 0 0; }
  to { opacity: 0; translate: 0 calc(-1 * var(--yg-cart-count-offset, 12px)); }
}
@keyframes yg-cart-label {
  from { opacity: 0; scale: .75; }
}
@media (forced-colors: active) {
  .yg-cart-stepper { box-shadow: inset 0 0 0 1px ButtonText; border: 1px solid ButtonText; }
}

.yg-cart-stepper { overflow: hidden; }
.yg-cart-quantity { min-inline-size: 2ch; text-align: center; }
.yg-cart-control[data-open="true"] .yg-cart-quantity { padding-inline: var(--boa-space-4); }
.yg-cart-quantity [data-direction="down"] { --yg-cart-count-offset: -12px; }
.yg-cart-limit {
  position: absolute;
  z-index: 1;
  inset-block-end: calc(100% + var(--yg-gap-tight));
  inset-inline-end: 0;
  inline-size: max-content;
  max-inline-size: min(90vw, 14rem);
  pointer-events: none;
  font: var(--yg-font-meta);
}
.yg-cart-limit:not(:empty) {
  color: var(--yg-canvas);
  background: var(--yg-text);
  padding: var(--boa-space-4) var(--yg-inset-compact);
  border-radius: var(--yg-radius-small);
}

.yg-root {
  --yg-surface-edge: color-mix(in srgb, var(--yg-text) 11%, transparent);
  --yg-active-edge: color-mix(in srgb, var(--yg-text) 17%, transparent);
  --yg-focus-surface: var(--yg-hover);
  --yg-raised-surface: light-dark(var(--yg-canvas), var(--yg-surface));
  color-scheme: light dark;
  color: var(--yg-text);
  background: var(--yg-canvas);
  font: var(--yg-font-body);
  letter-spacing: var(--yg-type-tracking);
  text-align: start;
}
.yg-root[data-appearance="light"] {
  color-scheme: light;
}
.yg-root[data-appearance="dark"] {
  color-scheme: dark;
}
.yg-root,
.yg-root :where(*, ::before, ::after) {
  box-sizing: border-box;
}
:where(.yg-root) :where(button, input, select, textarea) {
  font: inherit;
  color: inherit;
}
.yg-root :where(button, summary, select) {
  cursor: pointer;
  touch-action: manipulation;
}
.yg-root :where(:disabled, [aria-disabled="true"]) {
  cursor: default;
}
.yg-root :where(:focus-visible) {
  outline: var(--boa-stroke-focus) solid var(--yg-text);
  outline-offset: 2px;
}
.yg-root [hidden] {
  display: none !important;
}
.yg-heading {
  margin: 0;
  letter-spacing: var(--yg-type-tracking);
  font: var(--yg-font-heading);
  text-wrap: balance;
}
.yg-text {
  font: var(--yg-font-body);
}
.yg-help,
.yg-text[data-type="help"],
.yg-error {
  display: block;
  margin: 0;
  font: var(--yg-font-help);
  color: var(--yg-muted);
}
.yg-meta,
.yg-text[data-type="meta"] {
  font: var(--yg-font-meta);
  letter-spacing: var(--yg-type-tracking);
  color: var(--yg-muted);
  font-variant-numeric: tabular-nums;
}
.yg-error {
  color: var(--yg-danger);
}
.yg-label {
  display: block;
  font: var(--yg-font-label);
  letter-spacing: var(--yg-type-tracking);
}
.yg-stack,
.yg-grid,
.yg-field {
  display: grid;
  gap: var(--yg-gap, var(--yg-gap-inline));
  min-width: 0;
  align-content: start;
}
.yg-inline,
.yg-bottom-action,
.yg-modal-header {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--yg-gap, var(--yg-gap-inline));
  min-width: 0;
}
.yg-grid {
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 12rem), 1fr));
}
.yg-surface {
  padding: var(--yg-inset-panel);
  border-radius: var(--yg-radius-panel);
  background: var(--yg-surface);
}
.yg-divider {
  border: 0;
  height: var(--boa-stroke-rule);
  width: 100%;
  background: var(--yg-hover);
  margin: var(--boa-space-8) 0;
}
.yg-scroll {
  overflow: auto;
  overscroll-behavior: contain;
  max-block-size: 15rem;
  scrollbar-width: thin;
}
.yg-icon {
  inline-size: var(--yg-glyph);
  block-size: var(--yg-glyph);
  flex: none;
  vertical-align: middle;
}
.yg-button,
.yg-reading-anchor {
  --yg-button-fill: var(--yg-inverse);
  --yg-button-ink: var(--yg-on-inverse);
  --yg-button-hover: var(--yg-inverse-hover);
  --yg-button-press: var(--yg-inverse-press);
  --yg-button-soft: var(--yg-field);
  --yg-button-soft-hover: var(--yg-hover);
  --yg-button-text: var(--yg-text);
  --yg-glyph: var(--yg-action-glyph-regular);
  border: 0;
  appearance: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  vertical-align: middle;
  gap: var(--yg-gap-control);
  min-block-size: var(--yg-action-height, var(--yg-button-size-regular));
  padding: var(--boa-space-4) var(--yg-action-inset, var(--yg-button-inline-inset));
  border-radius: var(--yg-button-radius);
  background: var(--yg-button-fill);
  color: var(--yg-button-ink);
  font: var(--yg-font-action);
  letter-spacing: var(--yg-type-tracking);
  text-align: center;
  overflow-wrap: anywhere;
  transition: background-color var(--yg-press) var(--yg-settle),
    color var(--yg-change) var(--yg-settle),
    box-shadow var(--yg-press) var(--yg-settle);
}
.yg-button[data-control-size="compact"] {
  --yg-action-height: var(--yg-button-size-compact);
  --yg-action-inset: var(--yg-button-compact-inset);
  --yg-glyph: var(--yg-action-glyph-compact);
  border-radius: var(--yg-button-compact-radius);
  font: var(--yg-font-compact);
}
.yg-button[data-control-size="comfortable"] {
  --yg-action-height: var(--yg-button-size-comfort);
  --yg-action-inset: var(--yg-button-touch-inset);
  --yg-glyph: var(--yg-action-glyph-large);
}
.yg-button[data-control-size="spacious"] {
  --yg-action-height: var(--yg-button-size-spacious);
  --yg-action-inset: var(--yg-button-touch-inset);
  --yg-glyph: var(--yg-action-glyph-large);
}
.yg-button[data-control-size="touch"] {
  --yg-action-height: var(--yg-button-size-touch);
  --yg-action-inset: var(--yg-button-touch-inset);
  --yg-glyph: var(--yg-action-glyph-large);
}
.yg-button[data-shape="pill"] { border-radius: var(--yg-button-pill-radius); }
.yg-button[data-emphasis="soft"] {
  background: var(--yg-button-soft);
  color: var(--yg-button-text);
}
.yg-button[data-emphasis="quiet"],
.yg-reading-anchor {
  background: transparent;
  color: var(--yg-button-text);
}
.yg-button[data-tone="brand"] {
  --yg-button-fill: var(--yg-action);
  --yg-button-ink: var(--yg-on-action);
  --yg-button-hover: var(--yg-action-hover);
  --yg-button-press: var(--yg-action-press);

    }

    }

      opacity: 1;
      animation: none;
    }
    .yg-dialog::backdrop {
      opacity: 0;
      transition: opacity var(--yg-travel) var(--yg-settle), overlay var(--yg-layer) allow-discrete,
        display var(--yg-layer) allow-discrete;
    }
    .yg-dialog:not([open]), .yg-dialog:not([open])::backdrop { pointer-events: none; }

.yg-filter {

.yg-facts dd {

body {
  margin: 0;
}
.catalog {
  min-height: 100vh;
}
.catalog-header {
  display: flex;
  align-items: center;
  gap: var(--boa-space-24);
  min-height: 68px;
  max-inline-size: 90rem;
  margin-inline: auto;
  padding: 0 clamp(var(--yg-inset-roomy), 3.5vw, 56px);
  background: var(--yg-canvas);
}
.catalog-identity {
  display: flex;
  align-items: center;
  gap: var(--yg-gap-row);
  font: var(--yg-font-heading);
  letter-spacing: var(--yg-type-tracking);
}
.catalog-section {
  color: var(--yg-muted);
  font: var(--yg-font-help);
}
.header-actions {
  display: flex;
  gap: var(--yg-gap-tight);
  margin-inline-start: auto;
}
.menu-toggle.yg-icon-button {
  display: none;
}
.catalog-body {
  display: grid;
  grid-template-columns: minmax(11rem, 14rem) minmax(0, 1fr);
  gap: clamp(var(--yg-gap-section), 4vw, var(--boa-space-64));
  max-inline-size: 90rem;
  padding: var(--yg-inset-roomy) clamp(var(--yg-inset-roomy), 3.5vw, 56px) var(--boa-space-48);
  margin: auto;
  align-items: start;
}
.catalog-body > aside {
  position: sticky;
  top: 12px;
  max-height: calc(100dvh - 24px);
  overflow: auto;
  scrollbar-width: thin;
}
.catalog-search {
  margin: 0 0 16px;
}
.catalog-search .yg-label {
  position: absolute;
  inline-size: 1px;
  block-size: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}
.related-actions { margin-block: var(--yg-gap-section); }
.catalog-guidance { margin-block: var(--yg-gap-section); max-inline-size: 42rem; }
.catalog-guidance h3 { margin-block-start: var(--yg-gap-inline); font: var(--yg-font-label); }
.catalog-guidance-links { display: flex; flex-wrap: wrap; gap: var(--yg-gap-inline) var(--yg-gap-panel); }
.related-actions p { margin-block: var(--boa-space-4) var(--boa-space-12); }
.related-actions > div { display: flex; flex-wrap: wrap; gap: var(--yg-gap-inline) var(--yg-gap-panel); }
.catalog-body > main {
  width: 100%;
  min-width: 0;
  padding: 0 0 var(--yg-inset-sheet);
  outline: 0;
}
.catalog-intro { margin-block-end: var(--yg-gap-section); }
.preview-tools,
.preview-caption {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--yg-gap-inline);
  flex-wrap: wrap;
}
.preview-tools {
  margin-bottom: var(--yg-gap-inline);
  font: var(--yg-font-action);
}
.preview-tools .yg-heading { font: var(--yg-font-heading); }
.specimen {
  background: var(--yg-surface);
  border-radius: var(--yg-radius-sheet);
  min-height: var(--yg-specimen-min-height);
  padding: var(--yg-specimen-inset);
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  align-items: center;
}
.specimen-inner {
  min-width: 0;
  inline-size: min(100%, var(--yg-specimen-content-width));
  margin-inline: auto;
}
.specimen[data-layout="compact"] { min-height: var(--yg-specimen-compact-height); }
.specimen[data-layout="compact"] .specimen-inner {
  inline-size: fit-content;
  max-inline-size: 100%;
}
.specimen[data-layout="wide"] {
  padding: var(--yg-specimen-wide-inset);
}
.specimen[data-layout="wide"] .specimen-inner {
  inline-size: 100%;
}
.sample-response {
  color: var(--yg-muted);
  font: var(--yg-font-help);
}
.sample-response:empty {
  display: none;
}
.preview-caption {
  margin-block: var(--boa-space-8) var(--boa-space-24);
}
.preview-surface-controls > button { margin-inline-start: auto; }
.variant-body[data-variant-component="button"] .specimen-inner { inline-size: min(100%, var(--yg-specimen-content-width)); }

.variation {
  margin: 24px 0;
}
.variant-body {
  margin: var(--boa-space-12) 0;
  min-block-size: 0;
}
.specimen:is([data-component="numeric-spinner"], [data-variant-component="slider"]) {
  background: var(--yg-canvas);
}

  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: var(--yg-gap-inline);
}
.surface-comparison > .yg-root {
  border-radius: var(--yg-radius-control);
  background: var(--yg-surface);
  padding: var(--yg-inset-regular);
}
.sample-material {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--yg-gap-inline);
  flex-wrap: wrap;
  margin-top: 8px;
}
.sample-scroll {
  max-height: 90px;
}
.install-code { margin-block-start: var(--boa-space-24); max-inline-size: 50rem; }
.install-code > .yg-stack { margin-block-start: var(--yg-gap-inline); }

.skip {
  position: absolute;
  left: -300vw;
}
.skip:focus {
  left: 8px;
  top: 8px;
  z-index: 3;
  background: var(--yg-canvas);
  padding: var(--boa-space-8);
}
@media (max-width: 740px) {
  .catalog-header {
    min-height: 54px;
    gap: var(--boa-space-14);
  }
  .catalog-body {
    display: block;
    padding-top: var(--yg-inset-regular);
  }
  .catalog-body > aside {
    display: none;
    position: static;
    max-height: 48vh;
    padding: 0 var(--boa-space-4) var(--boa-space-8);
  }
  .catalog-body > aside[data-open="true"] {
    display: block;
  }
  .menu-toggle.yg-icon-button {
    display: inline-flex;
  }
  .catalog-body > main {
    padding-top: var(--boa-space-4);
  }
  .specimen {
    min-height: 155px;
    padding: var(--yg-inset-sheet) var(--boa-space-20);
  }
  .catalog-identity {
    font-size: 20px;
  }
  .surface-comparison {
    grid-template-columns: 1fr;
  }
  .sample-material {
    margin-top: 0;
  }
}
@media (max-width: 370px) {
  .catalog-section {
    font-size: 11px;
  }
  .catalog-header {
    gap: var(--yg-gap-inline);
  }
  .specimen {
    padding-inline: var(--yg-inset-row);
  }
  .preview-tools .yg-segment button {
    padding-inline: 7px;
  }
}
.catalog-top {
  display: flex;
  gap: var(--yg-gap-tight);
  align-items: center;
}
.catalog-top :is(button, a) {
  border: 0;
  background: transparent;
  border-radius: var(--yg-radius-small);
  padding: 5px var(--boa-space-8);
  font: var(--yg-font-help);
  color: var(--yg-muted);
  text-decoration: none;
  white-space: nowrap;
}
.catalog-top button[aria-current] {
  color: var(--yg-text);
  background: var(--yg-field);
}
.specimen:is([data-component="select"], [data-component="motion-spring-dropdown"]) {
  align-items: start;
  min-block-size: calc(4 * var(--yg-size-regular) + var(--boa-space-64) + var(--boa-space-16));
  padding-block: var(--boa-space-24);
}
.specimen[data-component="motion-spring-dropdown"] {
  min-block-size: calc(4 * var(--yg-size-comfort) + 2 * var(--boa-space-64) + var(--boa-space-16));
}
.specimen[data-component="select"] .specimen-inner {
  max-inline-size: 20rem;
}

.brand-reference section > h2 {
  margin-bottom: 12px;
}
.brand-reference section > p {
  margin: 8px 0 4px;
}
.brand-mode {
  margin-bottom: var(--boa-space-12);
}
.brand-mode .yg-field {
  display: grid;
  grid-template-columns: auto minmax(0, 8rem);
  align-items: center;
  justify-content: start;
  gap: var(--boa-space-12);
}
.brand-role-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(155px, 1fr));
  gap: var(--yg-gap-row) var(--boa-space-14);
}
.brand-role-grid > div {
  display: flex;
  align-items: center;
  gap: var(--yg-gap-inline);
}
.brand-role-grid > div > span {
  width: 24px;
  height: 28px;
  border-radius: var(--yg-radius-small);
  box-shadow: inset 0 0 0 1px
    color-mix(in srgb, var(--yg-text) 10%, transparent);
}
.brand-role-grid small,
.brand-reference dd {
  display: block;
  color: var(--yg-muted);
  font: var(--yg-font-meta);
}
.brand-reference dl > div {
  margin: 0 0 8px;
}
.brand-reference dd {
  margin: 0;
}
.brand-reference dt {
  font: var(--yg-font-action);
}
@media (max-width: 420px) {
  .catalog-top {
    gap: 0;
  }
  .catalog-top :is(button, a) {
    padding: var(--boa-space-4);
    font-size: 12px;
  }
  .catalog-identity {
    gap: 5px;
  }
  .catalog-header {
    gap: var(--yg-gap-inline);
  }
  .header-actions {
    gap: 0;
  }
}
@media (max-width: 370px) {
  .catalog-header {
    gap: var(--boa-space-4);
  }
  .catalog-identity {
    gap: var(--boa-space-4);
  }
  .catalog-top {
    gap: 0;
  }
  .catalog-top :is(button, a) {
    padding-inline: var(--boa-space-4);
  }
}

.specimen[data-component="calendar"] .specimen-inner {width:fit-content;max-width:100%;}
.sidebar-sample-main {
  min-block-size: 17rem;
  padding: var(--boa-space-16);
  background: var(--yg-canvas);
  border-radius: var(--yg-radius-panel);
}

.agent-motion-stage {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--boa-space-24);
}
.agent-motion-sample {
  display: grid;
  gap: var(--boa-space-8);
  justify-items: center;
}
.agent-motion-tools {
  display: flex;
  align-items: end;
  flex-wrap: wrap;
  gap: var(--boa-space-8);
  min-inline-size: 0;
  max-inline-size: 100%;
}
.agent-motion-tools > .yg-field {
  flex: 1 1 9rem;
  min-inline-size: min(9rem, 100%);
}
.agent-motion-tools > .yg-button { flex: none; max-inline-size: 100%; }


@media (max-width: 480px) {
  .catalog-header {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    padding-block: var(--boa-space-8);
    row-gap: var(--boa-space-4);
  }
  .catalog-top {
    grid-column: 1 / -1;
    grid-row: 2;
  }
  .header-actions {
    grid-column: 2;
    grid-row: 1;
  }
}

body { margin: 0; }
.workflow-root { min-block-size: 100dvh; }
.workflow-header, .workflow-body { max-inline-size: 76rem; margin-inline: auto; padding-inline: clamp(var(--boa-space-16), 4vi, var(--boa-space-48)); }
.workflow-header {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--boa-space-16);
  min-block-size: 64px;
  padding-block: var(--boa-space-8);
}
.workflow-identity { display: inline-flex; align-items: center; gap: var(--yg-gap-inline); font: var(--yg-font-heading); }
.workflow-header a { color: var(--yg-text); text-decoration: none; }
.workflow-header nav { display: flex; gap: var(--boa-space-16); font: var(--yg-font-label); }
.workflow-header .yg-icon-button { margin-inline-start: auto; }
.workflow-body { padding-block: var(--boa-space-24) var(--boa-space-48); }
.workflow-body h1 { margin: 0; font: var(--yg-font-display); letter-spacing: var(--boa-tracking-display); }
.workflow-parts { display: flex; flex-wrap: wrap; gap: var(--yg-gap-inline); }
.workflow-parts a {
  display: inline-flex;
  align-items: center;
  min-block-size: var(--yg-size-compact);
  padding-inline: var(--yg-inset-compact);
  border-radius: var(--yg-radius-small);
  color: var(--yg-muted);
  text-decoration: none;
  font: var(--yg-font-label);
}
.workflow-parts a:hover { background: var(--yg-hover); color: var(--yg-text); }
.workflow-page-title { display: flex; align-items: center; gap: var(--yg-gap-inline); }
.workflow-body .yg-sidebar-layout { min-block-size: 34rem; }
.workflow-body .yg-sidebar-main:has(.workflow-records) { padding-inline-start: clamp(var(--boa-space-24), 3vi, var(--boa-space-32)); }
.workflow-sort { margin-block-end: var(--boa-space-24); }
.workflow-preview { margin-block: var(--boa-space-16); }
.workflow-preview:has(.workflow-records) { margin-block: var(--boa-space-24); }
.workflow-records, .workflow-decision {
  display: grid;
  grid-template-columns: minmax(0, 20rem) minmax(0, 1fr);
  gap: var(--yg-gap-section);
  align-items: start;
}
.workflow-record-list, .workflow-evidence { min-inline-size: 0; border-radius: var(--yg-radius-card); background: var(--yg-surface); }
.workflow-record-list { padding: var(--boa-space-24); }
.workflow-evidence { padding: var(--yg-inset-panel); }
.workflow-record-detail { min-inline-size: 0; padding: var(--boa-space-24) var(--yg-inset-panel); }
.workflow-record-detail .yg-facts { max-inline-size: 34rem; }
.workflow-record-detail .yg-facts dl { display: grid; gap: var(--boa-space-8); margin-block: var(--boa-space-24); }
.workflow-record-detail .yg-facts dl > div { padding-block: var(--boa-space-8); }
.workflow-record-detail .yg-facts dd { max-inline-size: 65%; overflow-wrap: anywhere; }
.workflow-record-detail .yg-facts .yg-meta { margin-block: var(--boa-space-16) 0; }
.workflow-back { display: none; }
.workflow-conversation { display: grid; gap: var(--boa-space-24); max-inline-size: 41rem; margin-inline: auto; padding: var(--yg-inset-sheet); background: var(--yg-surface); border-radius: var(--yg-radius-card); }
.workflow-conversation .yg-prompt-box { justify-self: center; }
.workflow-thread { min-block-size: clamp(230px, 40dvh, 360px); display: grid; align-content: start; gap: var(--yg-gap-stack); }
.workflow-empty { align-self: center; padding-block: clamp(var(--boa-space-24), 8vh, var(--boa-space-64)); text-align: center; }
.workflow-empty h2, .workflow-decision h2 { margin: 0; font: var(--yg-font-section); letter-spacing: var(--boa-tracking-heading); }
.workflow-empty p, .workflow-decision p { color: var(--yg-muted); margin: var(--boa-space-8) 0 var(--boa-space-16); }
.workflow-request { justify-self: end; max-inline-size: min(38rem, 92%); padding: var(--yg-inset-compact) var(--yg-inset-row); margin: 0; background: var(--yg-field); border-radius: var(--yg-radius-card); overflow-wrap: anywhere; white-space: pre-wrap; }
.workflow-recovery { display: flex; flex-wrap: wrap; gap: var(--yg-gap-inline); align-items: center; }
.workflow-decision { grid-template-columns: minmax(0, 3fr) minmax(13rem, 2fr); }
.workflow-decision-main { min-inline-size: 0; padding: var(--yg-inset-panel); }
.workflow-kicker { display: block; color: var(--yg-muted); font: var(--yg-font-meta); margin-block-end: var(--boa-space-8); }
.workflow-evidence h3 { margin-block: 0 var(--boa-space-8); font: var(--yg-font-action); }
.workflow-evidence ol { margin: 0; padding-inline-start: var(--boa-space-16); }
.workflow-evidence li + li { margin-block-start: var(--boa-space-8); }
@media (max-width: 42rem) {
  .workflow-records, .workflow-decision { grid-template-columns: minmax(0, 1fr); gap: var(--boa-space-12); }
  .workflow-records[data-show-detail=false] .workflow-record-detail,
  .workflow-records[data-show-detail=true] .workflow-record-list { display: none; }
  .workflow-back { display: inline-flex; margin-block-end: var(--boa-space-16); }
  .workflow-body h1 { font: var(--yg-font-heading); }
}
.workflow-body .yg-sidebar-layout[data-compact="true"] > .yg-sidebar-main:has(.workflow-records) { padding-inline-start: 0; }
@media (pointer: coarse) {
  .workflow-parts a { min-block-size: var(--yg-size-touch); }
}
