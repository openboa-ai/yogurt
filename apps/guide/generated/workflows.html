/* Extended component anatomy. All color roles follow the nearest Yogurt. */
.yg-bottom-action[data-fixed] {
  position: fixed;
  inset-inline: 0;
  inset-block-end: 0;
  z-index: 3;
  padding: var(--boa-space-12) var(--boa-space-16)
    max(var(--boa-space-12), env(safe-area-inset-bottom));
  background: var(--yg-canvas);
}
.yg-aspect {
  width: 100%;
  overflow: hidden;
  border-radius: var(--yg-radius-control);
}
.yg-aspect > :is(img, video) {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.yg-card,
.yg-elevation,
.yg-gradient,
.yg-slide,
.yg-sidebar {
  padding: var(--yg-inset-panel);
  border-radius: var(--yg-radius-panel);
  background: var(--yg-surface);
}
.yg-card {
  display: grid;
  box-sizing: border-box;
  padding: var(--yg-card-inset-regular);
  border-radius: var(--yg-card-corner);
  gap: var(--yg-gap-stack);
  align-content: start;

.yg-work-event,
.yg-routine-row {
  display: flex;
  flex-wrap: wrap;
  align-items: start;
  column-gap: var(--yg-gap-stack);
  row-gap: var(--yg-gap-inline);
  min-width: 0;
  padding: var(--boa-space-12);
  border-radius: var(--yg-radius-panel);
  background: var(--yg-canvas);
}

.yg-work-event-icon {
  flex: none;
  display: grid;
  place-items: center;
  inline-size: var(--yg-size-compact);
  block-size: var(--yg-size-compact);
  border-radius: var(--yg-radius-control);
  background: var(--yg-field);
  color: var(--yg-inverse);
  transition: background-color var(--yg-change) var(--yg-settle);
}
.yg-work-event[data-state="running"] .yg-work-event-icon {
  background: var(--yg-field);
}

.yg-work-event-content {
  flex: 1 1 9rem;
  min-width: 0;
  display: grid;
  align-content: start;
  gap: var(--boa-space-2);
  overflow-wrap: anywhere;
}

.yg-work-event-content > strong {
  color: var(--yg-text);
  font: var(--yg-font-action);
}

.yg-operations-line,
.yg-operations-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--boa-space-4) var(--boa-space-8);
  min-width: 0;
}

.yg-operations-actions {
  margin-inline-start: auto;
}

.yg-operations-list {
  display: grid;
  gap: var(--boa-space-4);
  padding: 0;
  margin: 0;
  list-style: none;
}

.yg-operations-list > li {
  min-width: 0;
}

.yg-attention-card {
  display: grid;
  gap: var(--yg-gap-row);
  padding: var(--yg-inset-panel);
  border-radius: var(--yg-radius-card);
  background: var(--yg-canvas);
}

.yg-attention-card > .yg-work-event {
  padding: 0;
  background: transparent;
}

.yg-operations-library .yg-tabs [role="tabpanel"] {
  padding-block-start: var(--boa-space-12);
}

.yg-operations-list > li + li { margin-block-start: var(--yg-gap-tight); }
.yg-operations-list :is(.yg-work-event, .yg-routine-row) { border-radius: 0; background: transparent; }
.yg-operations-actions { align-self: center; }

.yg-sidebar-layout {
  display: grid;
  min-inline-size: 0;
  min-block-size: 0;
  grid-template-areas: "main";
  grid-template-columns: minmax(0, 1fr);
}
.yg-sidebar-layout[data-panel="full"] {
  --yg-sidebar-track: minmax(0, var(--yg-sidebar-width));
}
.yg-sidebar-layout[data-panel="rail"] {
  --yg-sidebar-track: calc(var(--yg-size-touch) + 2 * var(--boa-space-8));
}
.yg-sidebar-layout[data-panel="full"],
.yg-sidebar-layout[data-panel="rail"] {
  grid-template-areas: "panel main";
  grid-template-columns: var(--yg-sidebar-track) minmax(0, 1fr);
}
.yg-sidebar-layout[data-edge="end"]:is([data-panel="full"], [data-panel="rail"]) {
  grid-template-areas: "main panel";
  grid-template-columns: minmax(0, 1fr) var(--yg-sidebar-track);
}
.yg-sidebar-layout[data-panel="hidden"] > .yg-sidebar-panel {
  display: none;
}
.yg-sidebar-layout[data-variant="inset"]:is([data-panel="full"], [data-panel="rail"]) {
  gap: var(--boa-space-16);
}
.yg-sidebar-main {
  grid-area: main;
  min-inline-size: 0;
  min-block-size: 0;
}
.yg-sidebar-panel,
.yg-sidebar-drawer[open] {
  display: flex;
  flex-direction: column;
  gap: var(--yg-gap-stack);
  min-inline-size: 0;
  min-block-size: 0;
  padding: var(--yg-inset-compact);
  background: var(--yg-canvas);
  color: var(--yg-text);
}
.yg-sidebar-panel {
  grid-area: panel;
}
.yg-sidebar-layout[data-variant="inset"] > .yg-sidebar-panel {

}
.yg-sidebar-layout[data-variant="flat"] > .yg-sidebar-panel {
  background: var(--yg-surface);

.yg-sidebar-header,
.yg-sidebar-footer {

}
.yg-sidebar-footer {
  margin-block-start: auto;
}
.yg-sidebar-content {
  display: grid;
  align-content: start;
  gap: var(--boa-space-16);
  flex: 1 1 auto;
  min-block-size: 0;
  min-inline-size: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
}
.yg-sidebar-group {
  display: grid;

  min-inline-size: 0;

.yg-sidebar-group-header {

}
.yg-sidebar-item-row {

  align-items: center;
  gap: var(--boa-space-2);
  min-inline-size: 0;
}
.yg-sidebar-item {
  flex: 1 1 auto;
  display: flex;
  align-items: center;
  gap: var(--yg-gap-inline);
  min-inline-size: 0;
  inline-size: 100%;
  min-block-size: var(--yg-size-row);
  padding: var(--boa-space-4) var(--yg-inset-compact);
  border: 0;
  border-radius: var(--yg-radius-control);

  font: var(--yg-font-action);

  text-decoration: none;
  cursor: pointer;
}
.yg-sidebar-item:disabled {

}

}
.yg-sidebar-label {
  flex: 1 1 auto;
  min-inline-size: 0;
  overflow-wrap: anywhere;
}
.yg-sidebar-icon {
  display: inline-grid;
  flex: none;
  min-inline-size: var(--boa-space-16);
  place-items: center;
}
.yg-sidebar-chevron {
  margin-inline-start: auto;
}
.yg-sidebar-item[aria-expanded="true"] .yg-sidebar-chevron {
  rotate: 180deg;
}
.yg-sidebar-submenu-content {
  margin-inline-start: var(--boa-space-16);
  padding-inline-start: var(--boa-space-8);

}
.yg-sidebar-layout[data-panel="rail"] .yg-sidebar-item {
  justify-content: center;
  padding-inline: 0;
}
.yg-sidebar-drawer {
  inset-block: 0;

  inline-size: min(var(--yg-sidebar-width), calc(100% - var(--yg-size-touch)));

  block-size: 100%;
  max-block-size: none;

}

}
.yg-sidebar-close {
  position: absolute;

}
.yg-sidebar-drawer > .yg-sidebar-header:first-of-type {

  .yg-sidebar-item, .yg-sidebar-close > button { min-block-size: var(--yg-size-touch); }

.yg-button .yg-button-label {
  position: relative;
  display: inline-grid;
  justify-items: center;
  min-inline-size: 0;
}

.yg-button-content,
.yg-button-pending {
  display: inline-flex;
  grid-area: 1 / 1;
  align-items: center;
  justify-content: center;
  gap: var(--yg-gap-tight);
  min-inline-size: 0;
}

.yg-button-pending .yg-spinner {
  flex: none;
}

.yg-button-pending:not([data-has-label]) {
  position: absolute;
  inset: 0;
}

.yg-button:not([aria-busy="true"]) .yg-button-pending {
  visibility: hidden;
}

.yg-button:not([aria-busy="true"]) .yg-button-pending .yg-spinner {
  animation: none;
}

.yg-button[aria-busy="true"] .yg-button-content {
  opacity: 0;

.yg-input,
.yg-select,
.yg-standalone {
  transition: background-color var(--yg-change, var(--yg-travel)) var(--yg-settle);
}

.yg-switch [role="switch"] {
  transition: background-color var(--yg-travel) var(--yg-settle);
}

.yg-switch [role="switch"] > span {
  transition:
    transform var(--yg-travel) var(--yg-settle),
    background-color var(--yg-travel) var(--yg-settle);
}

.yg-checkbox [role="checkbox"],
.yg-radio [role="radio"],
.yg-toggle-item,
.yg-rating label,
.yg-otp-slots > span {
  transition:
    background-color var(--yg-change, var(--yg-travel)) var(--yg-settle),
    color var(--yg-change, var(--yg-travel)) var(--yg-settle);
}

.yg-range input:not(:disabled):active {

.yg-progress {

.yg-progress > .yg-progress-track {

  color: var(--yg-text);
  box-shadow: 0 1px 2px var(--yg-surface-edge), inset 0 0 0 1px var(--yg-surface-edge);
  pointer-events: none;
}
.yg-slide-confirm-handle .yg-icon { inline-size: 20px; block-size: 20px; }
.yg-hold-confirm[data-done] { background: var(--yg-text); color: var(--yg-canvas); }
.yg-hold-confirm[data-done] .yg-confirm-fill { opacity: 0; }
.yg-slide-confirm[data-done] .yg-confirm-fill {
  padding-inline: var(--yg-inset-regular) 36px;
  background: var(--yg-success);
  color: var(--yg-canvas);
  clip-path: none;
}
.yg-slide-confirm[data-done] .yg-slide-confirm-handle { color: var(--yg-success); }
@media (prefers-reduced-motion: no-preference) {
  .yg-hold-confirm { transition: background-color 150ms ease-out, color 150ms ease-out; }
  .yg-hold-confirm .yg-confirm-fill { transition: opacity 150ms ease-out; }
  .yg-hold-confirm:is([data-holding], [data-done]) .yg-confirm-label { animation: yg-hold-label 200ms cubic-bezier(.23, 1, .32, 1) both; }
  .yg-hold-check path { stroke-dasharray: 1; animation: yg-hold-draw 300ms 100ms cubic-bezier(.23, 1, .32, 1) both; }
  .yg-slide-confirm .yg-confirm-fill { transition: clip-path var(--yg-expand) var(--yg-settle), opacity var(--yg-change) ease-out; }
  .yg-slide-confirm-handle { transition: inset-inline-start var(--yg-expand) var(--yg-settle); }
  .yg-slide-confirm[data-dragging] .yg-confirm-fill,
  .yg-slide-confirm[data-dragging] .yg-slide-confirm-handle { transition: none; }
  .yg-slide-confirm[data-done] .yg-slide-confirm-handle svg { animation: yg-confirm-check 260ms var(--yg-arrive); }
}
@keyframes yg-hold-label { from { opacity: 0; translate: 0 10px; filter: blur(2px); } }
@keyframes yg-hold-draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes yg-confirm-check { from { opacity: 0; transform: translateY(6px); } }
@media (forced-colors: active) {
  .yg-hold-confirm, .yg-slide-confirm { box-shadow: inset 0 0 0 1px ButtonText; }
  .yg-slide-confirm-handle { outline: 1px solid ButtonText; }
}

.yg-cart-control {
  --yg-cart-slot: var(--yg-size-regular);
  --yg-cart-open: calc(3 * var(--yg-cart-slot));
  --yg-cart-closed: calc(2 * var(--yg-cart-slot) + var(--boa-space-8));
  --yg-cart-ease: var(--yg-arrive);
  position: relative;
  display: grid;
  justify-items: end;
  inline-size: var(--yg-cart-open);
  max-inline-size: 100%;
  min-block-size: var(--yg-cart-slot);
}
.yg-cart-stepper {
  isolation: isolate;
  position: relative;
  display: grid;
  place-items: center;
  inline-size: min(100%, var(--yg-cart-closed));
  block-size: var(--yg-cart-slot);
  border-radius: var(--boa-radius-round);
  background: var(--yg-raised-surface);
  color: var(--yg-text);
}
.yg-cart-control[data-open="true"] .yg-cart-stepper {
  inline-size: 100%;
  background: var(--yg-text);
  color: var(--yg-canvas);
}
.yg-cart-stepper > button {
  position: absolute;
  inset-block: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-wrap: nowrap;
  cursor: pointer;
  gap: var(--boa-space-4);
  padding: 0;
  border: 0;
  border-radius: var(--boa-radius-round);
  background: transparent;
  color: inherit;
  font: var(--yg-font-action);
  line-height: 1;
  white-space: nowrap;
  touch-action: manipulation;
  user-select: none;
}
.yg-cart-stepper > button:focus-visible {
  outline: var(--boa-stroke-focus) solid currentColor;
  outline-offset: -3px;
}
.yg-cart-decrease {
  inset-inline-start: 0;
  inline-size: var(--yg-cart-slot);
}
.yg-cart-increase {
  inset-inline-end: 0;
  inline-size: 100%;
  justify-content: space-between;
  padding-inline: var(--yg-inset-row) calc((var(--yg-cart-slot) - var(--yg-glyph)) / 2);
}
.yg-cart-control[data-open="true"] .yg-cart-increase {
  inline-size: var(--yg-cart-slot);
  justify-content: center;
  padding: 0;
}
.yg-cart-increase[aria-disabled="true"] {
  opacity: .55;
}
.yg-cart-stepper .yg-icon { inline-size: var(--yg-glyph); block-size: var(--yg-glyph); flex: none; }
.yg-cart-quantity {
  font: var(--yg-font-action);
  font-weight: var(--boa-weight-semibold);
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.yg-cart-quantity { overflow: hidden; }
.yg-cart-roll { position: relative; display: inline-grid; }
.yg-cart-previous { display: none; position: absolute; inset: 0; }
.yg-cart-current { display: block; }
@media (hover: hover) {
  .yg-cart-stepper > button:hover:not([aria-disabled="true"]) {
    background: color-mix(in srgb, currentColor 12%, transparent);
  }
}
@media (prefers-reduced-motion: no-preference) {
  .yg-cart-stepper {
    transition: inline-size var(--yg-expand) var(--yg-cart-ease), color var(--yg-change) var(--yg-cart-ease),
      background-color var(--yg-change) var(--yg-cart-ease);
  }
  .yg-cart-roll:has(.yg-cart-previous) .yg-cart-current {
    animation: yg-cart-count 240ms var(--yg-cart-ease) both;
  }
  .yg-cart-previous {
    display: block;
    animation: yg-cart-count-out 240ms var(--yg-cart-ease) both;
  }
  .yg-cart-decrease .yg-icon, .yg-cart-increase > span {
    animation: yg-cart-label 200ms var(--yg-cart-ease);
  }
  .yg-cart-limit:not(:empty) { animation: yg-cart-count var(--yg-change) var(--yg-cart-ease); }
}
@keyframes yg-cart-count {
  from { opacity: 0; translate: 0 var(--yg-cart-count-offset, 12px); }
}
@keyframes yg-cart-count-out {
  to { opacity: 0; translate: 0 calc(-1 * var(--yg-cart-count-offset, 12px)); }
}
@keyframes yg-cart-label {
  from { opacity: 0; scale: .75; }
}
@media (forced-colors: active) {
  .yg-cart-stepper { box-shadow: inset 0 0 0 1px ButtonText; border: 1px solid ButtonText; }
}

.yg-cart-stepper { overflow: hidden; }
.yg-cart-quantity { min-inline-size: 2ch; text-align: center; }
.yg-cart-control[data-open="true"] .yg-cart-quantity { padding-inline: var(--boa-space-4); }
.yg-cart-quantity [data-direction="down"] { --yg-cart-count-offset: -12px; }
.yg-cart-limit {
  position: absolute;
  z-index: 1;
  inset-block-end: calc(100% + var(--yg-gap-tight));
  inset-inline-end: 0;
  inline-size: max-content;
  max-inline-size: min(90vw, 14rem);
  pointer-events: none;
  font: var(--yg-font-meta);
}
.yg-cart-limit:not(:empty) {
  color: var(--yg-canvas);
  background: var(--yg-text);
  padding: var(--boa-space-4) var(--yg-inset-compact);
  border-radius: var(--yg-radius-small);
}

.yg-root {
  --yg-surface-edge: color-mix(in srgb, var(--yg-text) 11%, transparent);
  --yg-active-edge: color-mix(in srgb, var(--yg-text) 17%, transparent);
  --yg-focus-surface: var(--yg-hover);
  --yg-raised-surface: light-dark(var(--yg-canvas), var(--yg-surface));
  color-scheme: light dark;
  color: var(--yg-text);
  background: var(--yg-canvas);
  font: var(--yg-font-body);
  letter-spacing: var(--boa-tracking-body);
  text-align: start;
}
.yg-root[data-appearance="light"] {
  color-scheme: light;
}
.yg-root[data-appearance="dark"] {
  color-scheme: dark;
}
.yg-root,
.yg-root :where(*, ::before, ::after) {
  box-sizing: border-box;
}
:where(.yg-root) :where(button, input, select, textarea) {
  font: inherit;
  color: inherit;
}
.yg-root :where(button, summary, select) {
  cursor: pointer;
  touch-action: manipulation;
}
.yg-root :where(:disabled, [aria-disabled="true"]) {
  cursor: default;
}
.yg-root :where(:focus-visible) {
  outline: var(--boa-stroke-focus) solid var(--yg-text);
  outline-offset: 2px;
}
.yg-root [hidden] {
  display: none !important;
}
.yg-heading {
  margin: 0;
  letter-spacing: var(--boa-tracking-heading);
  font: var(--yg-font-heading);
  text-wrap: balance;
}
.yg-text {
  font: var(--yg-font-body);
}
.yg-help,
.yg-text[data-type="help"],
.yg-error {
  display: block;
  margin: 0;
  font: var(--yg-font-help);
  color: var(--yg-muted);
}
.yg-meta,
.yg-text[data-type="meta"] {
  font: var(--yg-font-meta);
  letter-spacing: var(--boa-tracking-meta);
  color: var(--yg-muted);
  font-variant-numeric: tabular-nums;
}
.yg-error {
  color: var(--yg-danger);
}
.yg-label {
  display: block;
  font: var(--yg-font-label);
  letter-spacing: var(--boa-tracking-label);
}
.yg-stack,
.yg-grid,
.yg-field {
  display: grid;
  gap: var(--yg-gap, var(--yg-gap-inline));
  min-width: 0;
  align-content: start;
}
.yg-inline,
.yg-bottom-action,
.yg-modal-header {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--yg-gap, var(--yg-gap-inline));
  min-width: 0;
}
.yg-grid {
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 12rem), 1fr));
}
.yg-surface {
  padding: var(--yg-inset-panel);
  border-radius: var(--yg-radius-panel);
  background: var(--yg-surface);
}
.yg-divider {
  border: 0;
  height: 1px;
  width: 100%;
  background: var(--yg-hover);
  margin: var(--boa-space-8) 0;
}
.yg-scroll {
  overflow: auto;
  overscroll-behavior: contain;
  max-block-size: 15rem;
  scrollbar-width: thin;
}
.yg-icon {
  inline-size: var(--yg-glyph);
  block-size: var(--yg-glyph);
  flex: none;
  vertical-align: middle;
}
.yg-button,
.yg-reading-anchor {
  --yg-button-fill: var(--yg-inverse);
  --yg-button-ink: var(--yg-on-inverse);
  --yg-button-hover: var(--yg-inverse-hover);
  --yg-button-press: var(--yg-inverse-press);
  --yg-button-soft: var(--yg-field);
  --yg-button-soft-hover: var(--yg-hover);
  --yg-button-text: var(--yg-text);
  border: 0;
  appearance: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  vertical-align: middle;
  gap: var(--yg-gap-control);
  min-block-size: var(--yg-button-size-regular);
  padding: var(--boa-space-4) var(--yg-button-inline-inset);
  border-radius: var(--yg-button-radius);
  background: var(--yg-button-fill);
  color: var(--yg-button-ink);
  font: var(--yg-font-action);
  letter-spacing: var(--boa-tracking-label);
  text-align: center;
  overflow-wrap: anywhere;
  transition: background-color var(--yg-press) var(--yg-settle),
    color var(--yg-change) var(--yg-settle),
    box-shadow var(--yg-press) var(--yg-settle);
}
.yg-button[data-control-size="compact"] {
  min-block-size: var(--yg-button-size-compact);
  padding-inline: var(--yg-button-compact-inset);
  border-radius: var(--yg-button-compact-radius);
  font: var(--yg-font-compact);
}
.yg-button[data-control-size="comfortable"] {
  min-block-size: var(--yg-button-size-comfort);
  padding-inline: var(--yg-button-touch-inset);
}
.yg-button[data-control-size="spacious"] {
  min-block-size: var(--yg-button-size-spacious);
  padding-inline: var(--yg-button-touch-inset);
}
.yg-button[data-control-size="touch"] {
  min-block-size: var(--yg-button-size-touch);
  padding-inline: var(--yg-button-touch-inset);
}
.yg-button[data-shape="pill"] { border-radius: var(--yg-button-pill-radius); }
.yg-button[data-emphasis="soft"] {
  background: var(--yg-button-soft);
  color: var(--yg-button-text);
}
.yg-button[data-emphasis="quiet"],
.yg-reading-anchor {
  background: transparent;
  color: var(--yg-button-text);
}
.yg-button[data-tone="brand"] {
  --yg-button-fill: var(--yg-action);
  --yg-button-ink: var(--yg-on-action);
  --yg-button-hover: var(--yg-action-hover);
  --yg-button-press: var(--yg-action-press);
  --yg-button-soft: var(--yg-action-soft);
  --yg-button-soft-hover: var(--yg-action-soft-hover);
  --yg-button-text: var(--yg-action);
}
.yg-button[data-tone="danger"] {
  --yg-button-soft: var(--yg-danger-soft);
  --yg-button-soft-hover: color-mix(in srgb, var(--yg-danger-soft), var(--yg-danger) 10%);
  --yg-button-text: var(--yg-danger);
}
.yg-button-label,
.yg-button-inner,

@media (hover: hover) {

      :active

  :is(.yg-input, .yg-select):focus-within,

body {
  margin: 0;
}
.catalog {

.catalog-header {

.related-actions p { margin-block: var(--boa-space-4) var(--boa-space-12); }
.related-actions > div { display: flex; flex-wrap: wrap; gap: var(--yg-gap-inline) var(--yg-gap-panel); }
.nav-family a {

.catalog-body > main {

  background: var(--yg-field);

.skip {

  left: -300vw;
}
.skip:focus {

  top: 8px;

.workflow-record-detail { min-inline-size: 0; padding: var(--yg-inset-panel); }
.workflow-back { display: none; }
.workflow-conversation { display: grid; gap: var(--boa-space-24); max-inline-size: 41rem; margin-inline: auto; padding: var(--yg-inset-sheet); background: var(--yg-surface); border-radius: var(--yg-radius-card); }
.workflow-conversation .yg-prompt-box { justify-self: center; }
.workflow-thread { min-block-size: clamp(230px, 40dvh, 360px); display: grid; align-content: start; gap: var(--yg-gap-stack); }
.workflow-empty { align-self: center; padding-block: clamp(var(--boa-space-24), 8vh, var(--boa-space-64)); text-align: center; }
.workflow-empty h2, .workflow-decision h2 { margin: 0; font: var(--yg-font-section); letter-spacing: var(--boa-tracking-heading); }
.workflow-empty p, .workflow-decision p { color: var(--yg-muted); margin: var(--boa-space-8) 0 var(--boa-space-16); }
.workflow-request { justify-self: end; max-inline-size: min(38rem, 92%); padding: var(--yg-inset-compact) var(--yg-inset-row); margin: 0; background: var(--yg-field); border-radius: var(--yg-radius-card); overflow-wrap: anywhere; white-space: pre-wrap; }
.workflow-recovery { display: flex; flex-wrap: wrap; gap: var(--yg-gap-inline); align-items: center; }
.workflow-decision { grid-template-columns: minmax(0, 3fr) minmax(13rem, 2fr); }
.workflow-decision-main { min-inline-size: 0; padding: var(--yg-inset-panel); }
.workflow-kicker { display: block; color: var(--yg-muted); font: var(--yg-font-meta); margin-block-end: var(--boa-space-8); }
.workflow-evidence h3 { margin-block: 0 var(--boa-space-8); font: var(--yg-font-action); }
.workflow-evidence ol { margin: 0; padding-inline-start: var(--boa-space-16); }
.workflow-evidence li + li { margin-block-start: var(--boa-space-8); }
@media (max-width: 42rem) {
  .workflow-records, .workflow-decision { grid-template-columns: minmax(0, 1fr); gap: var(--boa-space-12); }
  .workflow-records[data-show-detail=false] .workflow-record-detail,
  .workflow-records[data-show-detail=true] .workflow-record-list { display: none; }
  .workflow-back { display: inline-flex; margin-block-end: var(--boa-space-16); }
  .workflow-body h1 { font: var(--yg-font-heading); }
}
@media (pointer: coarse) {
  .workflow-parts a { min-block-size: var(--yg-size-touch); }
}
