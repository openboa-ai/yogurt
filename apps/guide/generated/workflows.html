  --yg-storage-measure: 300px;
  --yg-drop-measure: 296px;
  --yg-press: 110ms;
  --yg-layer: 160ms;
  --yg-travel: 220ms;
  --yg-change: 180ms;
  --yg-panel: 260ms;
  --yg-expand: 320ms;
  --yg-busy: 800ms;
  --yg-reveal: 420ms;
  --yg-settle: cubic-bezier(.2, 0, 0, 1);
  --yg-arrive: cubic-bezier(.23, 1, .32, 1);
  --yg-selection: cubic-bezier(.2, .76, .26, 1.08);
  --yg-lift-shadow: 0 1px 3px color-mix(in srgb, var(--boa-color-neutral-1000) 8%, transparent);
  --yg-float-shadow: 0 1px 3px color-mix(in srgb, var(--boa-color-neutral-1000) 9%, transparent), 0 8px 24px color-mix(in srgb, var(--boa-color-neutral-1000) 12%, transparent);
  --yg-panel-shadow: 0 12px 36px color-mix(in srgb, var(--boa-color-neutral-1000) 18%, transparent);
  --yg-font-action: var(--boa-role-weight-ui) 0.875rem/1.25rem var(--boa-font-family);
  --yg-font-body: var(--boa-role-weight-body) 0.875rem/1.25rem var(--boa-font-family);
  --yg-font-compact: var(--boa-role-weight-ui) 0.8125rem/1.125rem var(--boa-font-family);
  --yg-font-label: var(--boa-role-weight-ui) 0.8125rem/1.125rem var(--boa-font-family);
  --yg-font-help: var(--boa-role-weight-body) 0.8125rem/1.125rem var(--boa-font-family);
  --yg-font-meta: var(--boa-weight-regular) 0.75rem/1rem var(--boa-font-family);
  --yg-font-heading: var(--boa-role-weight-heading) 1.25rem/1.625rem var(--boa-font-family);
  --yg-font-display: var(--boa-role-weight-heading) 2.5rem/2.75rem var(--boa-font-family);
  --yg-font-touch: var(--boa-weight-regular) 1rem/1.5rem var(--boa-font-family);
  --yg-font-editor: var(--boa-role-weight-body) 0.9375rem/1.375rem var(--boa-font-family);
  --yg-font-reading: var(--boa-role-weight-body) 1rem/1.5rem var(--boa-font-family);
  --yg-font-section: var(--boa-role-weight-heading) 1.5rem/1.875rem var(--boa-font-family);
  --yg-font-value: var(--boa-role-weight-value) 2.125rem/2.5rem var(--boa-font-family);
}
.yg-root[data-material="paper"] {
  --yg-canvas: light-dark(var(--boa-color-paper-25), var(--boa-color-paper-975));
  --yg-surface: light-dark(var(--boa-color-paper-50), var(--boa-color-paper-950));
  --yg-field: light-dark(var(--boa-color-paper-100), var(--boa-color-paper-850));
  --yg-hover: light-dark(var(--boa-color-paper-200), var(--boa-color-paper-800));
  --yg-text: light-dark(var(--boa-color-paper-950), var(--boa-color-paper-50));
  --yg-muted: light-dark(var(--boa-color-paper-700), var(--boa-color-paper-300));
}
.yg-root[data-material="mist"] {
  --yg-canvas: light-dark(var(--boa-color-mist-25), var(--boa-color-mist-975));
  --yg-surface: light-dark(var(--boa-color-mist-50), var(--boa-color-mist-950));
  --yg-field: light-dark(var(--boa-color-mist-100), var(--boa-color-mist-850));
  --yg-hover: light-dark(var(--boa-color-mist-200), var(--boa-color-mist-800));
  --yg-text: light-dark(var(--boa-color-mist-950), var(--boa-color-mist-50));
  --yg-muted: light-dark(var(--boa-color-mist-700), var(--boa-color-mist-300));
}

/* Extended component anatomy. All color roles follow the nearest Yogurt. */
.yg-bottom-action[data-fixed] {
  position: fixed;
  inset-inline: 0;
  inset-block-end: 0;
  z-index: 3;
  padding: var(--boa-space-12) var(--boa-space-16)
    max(var(--boa-space-12), env(safe-area-inset-bottom));
  background: var(--yg-canvas);
}
.yg-aspect {
  width: 100%;
  overflow: hidden;
  border-radius: var(--yg-radius-control);
}
.yg-aspect > :is(img, video) {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.yg-card,
.yg-elevation,
.yg-gradient,
.yg-slide,
.yg-sidebar {
  padding: var(--yg-inset-panel);
  border-radius: var(--yg-radius-panel);
  background: var(--yg-surface);
}
.yg-card {
  display: grid;
  border-radius: var(--yg-radius-card);
  gap: var(--yg-gap-stack);
  align-content: start;
  background: var(--yg-raised-surface);
  box-shadow: inset 0 0 0 1px var(--yg-surface-edge);
}
.yg-card p,
.yg-section-line p,
.yg-stepper p,
.yg-post p {
  margin: 0;
}
.yg-asset,
.yg-avatar {
  display: inline-grid;
  place-items: center;
  flex: none;
  overflow: hidden;
  vertical-align: middle;
}
.yg-asset[data-framed],
.yg-avatar {
  background: var(--yg-action-soft);
  color: var(--yg-action);
  border-radius: var(--yg-radius-control);
}
.yg-asset > :is(img, video, svg),
.yg-avatar img {
  max-width: 100%;
  max-height: 100%;
  object-fit: cover;
}
.yg-avatar {
  border-radius: 50%;
  font: var(--yg-font-action);
}
.yg-gradient {
  background: linear-gradient(115deg, var(--yg-action-soft), var(--yg-surface));
}
.yg-gradient[data-tone="accent"] {
  background: linear-gradient(
    115deg,
    var(--yg-accent-soft),
    var(--yg-action-soft)
  );
}
.yg-gradient[data-tone="success"] {
  background: linear-gradient(
    115deg,
    var(--yg-success-soft),
    var(--yg-surface)
  );
}
.yg-gradient[data-tone="warning"] {
  background: linear-gradient(
    115deg,
    var(--yg-warning-soft),
    var(--yg-surface)
  );
}
.yg-gradient[data-tone="danger"] {
  background: linear-gradient(115deg, var(--yg-danger-soft), var(--yg-surface));
}
.yg-gradient[data-tone="neutral"] {
  background: linear-gradient(115deg, var(--yg-field), var(--yg-surface));
}
.yg-elevation {
  background: var(--yg-canvas);
}
.yg-elevation[data-level="raised"] {
  box-shadow: var(--yg-lift-shadow);
}
.yg-elevation[data-level="floating"],
.yg-flyout {
  box-shadow: var(--yg-float-shadow);
}
.yg-shortcut {
  display: inline-flex;
  gap: var(--boa-space-4);
}
.yg-shortcut kbd {
  font: var(--yg-font-help);
  color: var(--yg-muted);
  background: var(--yg-field);
  border-radius: var(--yg-radius-small);
  padding: var(--boa-space-2) var(--boa-space-8);
}
.yg-post {
  max-inline-size: 65ch;
  line-height: 1.6;
  overflow-wrap: anywhere;
}
.yg-post > * + * {
  margin-block-start: var(--boa-space-12);
}
.yg-grid-list,
.yg-stepper,
.yg-trace ol,
.yg-bars ul,
.yg-navigation-menu ul {
  list-style: none;
  margin: 0;
  padding: 0;
}
.yg-grid-list {
  display: grid;
  gap: var(--boa-space-12);
  grid-template-columns: repeat(
    auto-fit,
    minmax(min(100%, var(--yg-cell)), 1fr)
  );
}
.yg-section-line,
.yg-value-row,
.yg-code header,
.yg-carousel footer,
.yg-quantity,
.yg-range > div,
.yg-sidebar header,
.yg-navbar,
.yg-attachment {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--boa-space-12);
  min-width: 0;
}
.yg-section-line,
.yg-value-row {
  flex-wrap: wrap;
}
.yg-section-line .yg-heading {
  font: var(--yg-font-action);
}
.yg-bottom-info {
  padding: var(--boa-space-12);
  background: var(--yg-field);
  color: var(--yg-muted);
  font: var(--yg-font-help);
  border-radius: var(--yg-radius-control);
}
.yg-highlight {
  background: var(--yg-warning-soft);
  color: var(--yg-warning);
  border-radius: var(--boa-space-2);
  padding-inline: var(--boa-space-2);
}
.yg-loading {
  display: inline-flex;
  align-items: center;
  color: var(--yg-action);
}
.yg-value-row {
  margin: 0;
  min-height: var(--yg-size-regular);
}
.yg-value-row dt {
  color: var(--yg-muted);
}
.yg-value-row dd {
  margin: 0;
  font-weight: var(--boa-weight-medium);
}
.yg-amount {
  display: grid;
  gap: var(--boa-space-4);
}
.yg-amount strong {
  font-size: 1.75rem;
  line-height: 1.2;
  letter-spacing: -0.035em;
}
.yg-amount small {
  font: var(--yg-font-action);
}
.yg-bars {
  margin: 0;
}
.yg-bars figcaption,
.yg-file-name strong {
  font: var(--yg-font-action);
}
.yg-bars ul {
  margin-block: var(--boa-space-8);
}
.yg-bars li {
  display: grid;
  grid-template-columns: minmax(4ch, auto) minmax(3rem, 1fr) auto;
  align-items: center;
  gap: var(--boa-space-8);
  min-height: var(--yg-size-compact);
}
.yg-bar-track {
  position: relative;
  height: var(--boa-space-8);
  background: var(--yg-field);
  border-radius: var(--yg-radius-small);
  overflow: hidden;
}
.yg-bar-track i {
  position: absolute;
  inset-block: 0;
  background: var(--yg-action);
}
.yg-bars small,
.yg-attachment small,
.yg-carousel footer > span,
.yg-trace small {
  font: var(--yg-font-help);
  color: var(--yg-muted);
}
.yg-bubble {
  width: fit-content;
  max-width: 90%;
  padding: var(--boa-space-8) var(--boa-space-12);
  border-radius: var(--yg-radius-panel);
  border-end-start-radius: var(--yg-radius-small);
  background: var(--yg-field);
  overflow-wrap: anywhere;
}
.yg-bubble[data-outgoing] {
  margin-inline-start: auto;
  border-end-start-radius: var(--yg-radius-panel);
  border-end-end-radius: var(--yg-radius-small);
  background: var(--yg-action-soft);
  color: var(--yg-action);
}
.yg-attachment,
.yg-code,
.yg-quantity > div,
.yg-context-target,
.yg-toggle-group {
  background: var(--yg-field);
  border-radius: var(--yg-radius-control);
}
.yg-attachment {
  justify-content: start;
  padding: var(--boa-space-8) var(--boa-space-12);
  flex-wrap: wrap;
  box-shadow: inset 0 0 0 1px var(--yg-surface-edge);
}
.yg-file-name {
  display: grid;
  min-width: 0;
  text-align: start;
  flex: 1;
  overflow-wrap: anywhere;
}
.yg-attachment button.yg-file-name {
  border: 0;
  background: transparent;
}
.yg-marker {
  display: flex;
  align-items: center;
  gap: var(--boa-space-8);
  color: var(--yg-muted);
  font: var(--yg-font-help);
}
.yg-code {
  min-width: 0;
  max-width: 100%;
  overflow: hidden;
}
.yg-code header,
.yg-code pre {
  padding: var(--boa-space-8) var(--boa-space-12);
  margin: 0;
}
.yg-code header {
  color: var(--yg-muted);
  font: var(--yg-font-help);
}
.yg-code pre {
  overflow: auto;
  text-align: start;
}
.yg-code code {
  font: var(--yg-font-body);
  font-variant-numeric: tabular-nums;
}
.yg-trace li {
  padding-block: var(--boa-space-4);
}
.yg-trace small {
  margin-inline-start: var(--boa-space-8);
}
.yg-trace details > div {
  color: var(--yg-muted);
  padding: var(--boa-space-8) var(--boa-space-16);
}
.yg-input-group {
  gap: var(--boa-space-8);
}
.yg-input-group > :not(input) {
  flex: none;
}
.yg-input-group input {
  width: 0;
}
.yg-otp {
  position: relative;
  width: fit-content;
  max-width: 100%;
}
.yg-otp input {
  position: absolute;
  inset: 0;
  z-index: 1;
  width: 100%;
  height: 100%;
  opacity: 0;
  font: var(--yg-font-touch);
}
.yg-otp-slots {
  display: grid;
  grid-template-columns: repeat(
    var(--yg-digits),
    minmax(0, var(--yg-size-regular))
  );
  gap: var(--boa-space-4);
}
.yg-otp-slots > span {
  display: grid;
  place-items: center;
  min-height: var(--yg-size-regular);
  border-radius: var(--yg-radius-small);
  background: var(--yg-field);
  font: var(--yg-font-action);
}
.yg-otp:focus-within [data-cursor] {
  outline: var(--boa-stroke-focus) solid var(--yg-action);
  outline-offset: -2px;
}
.yg-split-inputs,
.yg-split-inputs > span,
.yg-key-actions,
.yg-key-row,
.yg-toggle-group {
  display: flex;
  align-items: center;
  gap: var(--boa-space-8);
}
.yg-split-inputs > span {
  min-width: 0;
  flex: 1;
}
.yg-split-inputs i {
  font-style: normal;
  color: var(--yg-muted);
}
.yg-range {
  display: grid;
  gap: var(--boa-space-4);
}
.yg-range output {
  color: var(--yg-action);
  font: var(--yg-font-action);
  font-variant-numeric: tabular-nums;
}
.yg-range input {
  display: block;
  width: 100%;
  margin: 0;
  min-height: var(--yg-size-regular);
  accent-color: var(--yg-action);
}
.yg-quantity > div {
  display: inline-flex;
  align-items: center;
}
.yg-quantity output {
  min-inline-size: 3ch;
  text-align: center;
  font-variant-numeric: tabular-nums;
}
.yg-rating {
  display: flex;
  flex-wrap: wrap;
}
.yg-rating label {
  position: relative;
  display: grid;
  place-items: center;
  width: var(--yg-size-regular);
  height: var(--yg-size-regular);
  font-size: 1.35rem;
  color: var(--yg-muted);
}
.yg-rating input {
  position: absolute;
  inset: 0;
  opacity: 0;
  cursor: pointer;
}
.yg-rating [data-filled] {
  color: var(--yg-action);
}
.yg-rating label:has(:focus-visible) {
  outline: var(--boa-stroke-focus) solid var(--yg-action);
  border-radius: var(--yg-radius-small);
}
.yg-agreement > div {
  margin-inline-start: var(--boa-space-12);
}
.yg-keypad {
  display: grid;
  gap: var(--boa-space-4);
  max-width: 30rem;
}
.yg-key-row {
  justify-content: center;
  gap: var(--boa-space-2);
}
.yg-key-row > * {
  flex: 1;
  min-width: 0;
  max-width: 3.5rem;
}
.yg-key-row button,
.yg-toggle-item,
.yg-menu-bar > button,
.yg-navigation-menu li > button,
.yg-date-trigger,
.yg-sidebar a,
.yg-flyout [role="menuitem"],
.yg-flyout a,
.yg-command-list [role="option"] {
  border: 0;
  border-radius: var(--yg-radius-small);
  color: var(--yg-text);
  background: transparent;
  font: var(--yg-font-body);
  padding: var(--boa-space-4) var(--boa-space-8);
  min-height: var(--yg-size-regular);
}
.yg-key-row button {
  background: var(--yg-field);
  padding-inline: 0;
}
.yg-key-actions {
  justify-content: flex-end;
}
.yg-keypad[data-mode="number"] .yg-key-row > * {
  max-width: none;
}
.yg-keypad[data-mode="number"] .yg-key-row:last-of-type > * {
  max-width: 33%;
}
.yg-toggle-group {
  width: fit-content;
  max-width: 100%;
  flex-wrap: wrap;
  gap: var(--boa-space-2);
  padding: var(--boa-space-2);
}
.yg-toggle-item[data-state="on"],
.yg-sidebar a[aria-current],
.yg-command-list [aria-selected="true"],
.yg-menu-bar [data-state="open"] {
  background: var(--yg-action-soft);
  color: var(--yg-action);
}
.yg-accordion h3 {
  margin: 0;
  font: inherit;
}
.yg-accordion h3 button,
.yg-date-trigger {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--boa-space-8);
  width: 100%;
  min-height: var(--yg-size-touch);
  border: 0;
  background: none;
  text-align: start;
}
.yg-accordion h3 button {
  padding: var(--boa-space-8) 0;
  font: var(--yg-font-action);
}
.yg-accordion h3 button[data-state="open"] .yg-icon {
  rotate: 180deg;
}
.yg-accordion-content {
  padding-block: 0 var(--boa-space-12);
  color: var(--yg-muted);
}
.yg-context-target {
  padding: var(--boa-space-16);
}
.yg-flyout,
.yg-command-list {
  padding: var(--yg-inset-layer);
  border-radius: var(--yg-radius-popover);
  background: var(--yg-raised-surface);
  color: var(--yg-text);
  max-width: min(22rem, 92vi);
  z-index: 8;
}
.yg-flyout {
  box-shadow: inset 0 0 0 1px var(--yg-surface-edge), var(--yg-float-shadow);
  max-height: var(--radix-popper-available-height, 80dvh);
  overflow: auto;
}
.yg-flyout [role="menuitem"],
.yg-flyout a,
.yg-command-list [role="option"] {
  display: flex;
  align-items: center;
  cursor: pointer;
  white-space: normal;
  text-decoration: none;
  outline-offset: -2px;
  min-block-size: var(--yg-size-row);
  border-radius: var(--yg-radius-control);
}
.yg-flyout [data-highlighted],
.yg-flyout a:focus-visible,
.yg-key-row button:active {
  background: var(--yg-hover);
}
.yg-flyout [data-disabled],
.yg-command-list [aria-disabled="true"] {
  color: var(--yg-off);
  cursor: default;
}
.yg-command-list {
  max-width: 100%;
  max-height: 16rem;
  overflow: auto;
}
.yg-dialog:has(.yg-command-search) {
  width: min(28rem, calc(100% - var(--boa-space-32)));
  gap: var(--yg-gap-inline);
  padding: var(--yg-inset-roomy);
}
.yg-command-search {
  display: flex;
  align-items: center;
  gap: var(--yg-gap-row);
  min-block-size: var(--yg-size-comfort);
  padding-inline: var(--yg-inset-regular);
  border-radius: var(--yg-radius-control);
  background: var(--yg-field);
  color: var(--yg-muted);
}
.yg-command-search:focus-within {
  box-shadow: inset 0 0 0 var(--boa-stroke-focus) var(--yg-action);
}
.yg-command-search input {
  inline-size: 100%;
  min-inline-size: 0;
  min-block-size: var(--yg-size-comfort);
  padding: 0;
  border: 0;
  outline: none;
  color: var(--yg-text);
  background: transparent;
  font: var(--yg-font-editor);
}
.yg-command-search input:focus-visible { outline: none; }
@media (pointer: coarse) {
  .yg-command-search,
  .yg-command-search input,
  .yg-command-list [role="option"] { min-block-size: var(--yg-size-touch); }
  .yg-command-search input { font: var(--yg-font-touch); }
}
.yg-command-list [role="option"] {
  gap: var(--yg-gap-inline);
  justify-content: space-between;
  padding: var(--yg-gap-tight) var(--yg-inset-compact);
}
.yg-command-list [role="option"] > svg { color: var(--yg-muted); }
.yg-command-copy { flex: 1; min-inline-size: 0; }
.yg-command-copy > span:first-child { font: var(--yg-font-action); }
.yg-hover-content {
  padding: var(--boa-space-12);
}
.yg-menu-bar,
.yg-navigation-menu ul {
  display: flex;
  align-items: center;
  gap: var(--boa-space-4);
  flex-wrap: wrap;
}
.yg-navigation-menu li {
  position: relative;
}
.yg-navigation-menu li > button {
  display: flex;
  align-items: center;
  gap: var(--boa-space-4);
}
.yg-navigation-menu .yg-flyout {
  position: absolute;
  inset-block-start: 100%;
  inset-inline-start: 0;
  min-width: min(11rem, 80vi);
}
.yg-sidebar {
  max-width: 18rem;
}
.yg-sidebar nav a {
  display: flex;
  align-items: center;
  text-decoration: none;
}
.yg-navbar {
  min-height: var(--yg-size-touch);
}
.yg-navbar > strong {
  flex: 1;
}
.yg-carousel {
  min-width: 0;
}
.yg-slide {
  background: color-mix(in srgb, var(--yg-field) 65%, var(--yg-canvas));
  box-shadow: inset 0 0 0 1px var(--yg-surface-edge);
  touch-action: pan-y;
}
.yg-carousel footer {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
  align-items: center;
  gap: var(--boa-space-4);
  margin-block-start: var(--boa-space-12);
}
.yg-carousel footer > span {
  overflow-wrap: anywhere;
}
.yg-carousel-nav {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--boa-space-4);
}
.yg-stepper {
  display: grid;
  gap: var(--boa-space-12);
}
.yg-stepper li {
  display: flex;
  align-items: center;
  gap: var(--boa-space-8);
}
.yg-step-number {
  display: grid;
  place-items: center;
  background: var(--yg-field);

.yg-root {
  --yg-surface-edge: color-mix(in srgb, var(--yg-text) 11%, transparent);
  --yg-active-edge: color-mix(in srgb, var(--yg-action) 17%, transparent);
  --yg-raised-surface: light-dark(var(--yg-canvas), var(--yg-surface));
  color-scheme: light dark;
  color: var(--yg-text);
  background: var(--yg-canvas);
  font: var(--yg-font-body);
  letter-spacing: var(--boa-tracking-body);
  text-align: start;
}
.yg-root[data-appearance="light"] {
  color-scheme: light;
}
.yg-root[data-appearance="dark"] {
  color-scheme: dark;
}
.yg-root,
.yg-root :where(*, ::before, ::after) {
  box-sizing: border-box;
}
:where(.yg-root) :where(button, input, select, textarea) {
  font: inherit;
  color: inherit;
}
.yg-root :where(button, summary, select) {
  cursor: pointer;
  touch-action: manipulation;
}
.yg-root :where(:disabled, [aria-disabled="true"]) {
  cursor: default;
}
.yg-root :where(:focus-visible) {
  outline: var(--boa-stroke-focus) solid var(--yg-action);
  outline-offset: 2px;
}
.yg-root [hidden] {
  display: none !important;
}
.yg-heading {
  margin: 0;
  letter-spacing: var(--boa-tracking-heading);
  font: var(--yg-font-heading);
  text-wrap: balance;
}
.yg-text {
  font: var(--yg-font-body);
}
.yg-help,
.yg-text[data-type="help"],
.yg-error {
  display: block;
  margin: 0;
  font: var(--yg-font-help);
  color: var(--yg-muted);
}
.yg-meta,
.yg-text[data-type="meta"] {
  font: var(--yg-font-meta);
  letter-spacing: var(--boa-tracking-meta);
  color: var(--yg-muted);
  font-variant-numeric: tabular-nums;
}
.yg-error {
  color: var(--yg-danger);
}
.yg-label {
  display: block;
  font: var(--yg-font-label);
  letter-spacing: var(--boa-tracking-label);
}
.yg-stack,
.yg-grid,
.yg-field {
  display: grid;
  gap: var(--yg-gap, var(--yg-gap-inline));
  min-width: 0;
  align-content: start;
}
.yg-inline,
.yg-bottom-action,
.yg-modal-header {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--yg-gap, var(--yg-gap-inline));
  min-width: 0;
}
.yg-grid {
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 12rem), 1fr));
}
.yg-surface {
  padding: var(--yg-inset-panel);
  border-radius: var(--yg-radius-panel);
  background: var(--yg-surface);
}
.yg-divider {
  border: 0;
  height: 1px;
  width: 100%;
  background: var(--yg-hover);
  margin: var(--boa-space-8) 0;
}
.yg-scroll {
  overflow: auto;
  overscroll-behavior: contain;
  max-block-size: 15rem;
  scrollbar-width: thin;
}
.yg-icon {
  inline-size: var(--yg-glyph);
  block-size: var(--yg-glyph);
  flex: none;
  vertical-align: middle;
}
.yg-button,
.yg-reading-anchor {
  border: 0;
  appearance: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  vertical-align: middle;
  gap: var(--yg-gap-control);
  min-block-size: var(--yg-size-regular);
  padding: var(--boa-space-4) var(--yg-inset-regular);
  border-radius: var(--yg-radius-control);
  background: var(--yg-action);
  color: var(--yg-on-action);
  font: var(--yg-font-action);
  letter-spacing: var(--boa-tracking-label);
  text-align: center;
  overflow-wrap: anywhere;
  transition: background-color var(--yg-press) var(--yg-settle),
    color var(--yg-change) var(--yg-settle),
    box-shadow var(--yg-press) var(--yg-settle);
}
.yg-button[data-control-size="compact"] {
  min-block-size: var(--yg-size-compact);
  padding-inline: var(--yg-inset-compact);
  border-radius: var(--yg-radius-small);
  font: var(--yg-font-compact);
}
.yg-button[data-control-size="touch"] {
  min-block-size: var(--yg-size-touch);
  padding-inline: var(--yg-inset-roomy);
}
.yg-button[data-emphasis="soft"] {
  background: var(--yg-action-soft);
  color: var(--yg-action);
}
.yg-button[data-emphasis="quiet"],
.yg-reading-anchor {
  background: transparent;
  color: var(--yg-action);
}
.yg-button[data-tone="danger"] {
  --yg-action: var(--yg-danger);
  --yg-on-action: light-dark(
    var(--boa-color-coral-50),
    var(--boa-color-coral-950)
  );
  --yg-action-soft: var(--yg-danger-soft);
  --yg-action-hover: light-dark(
    var(--boa-color-coral-800),
    var(--boa-color-coral-100)
  );
  --yg-action-press: light-dark(
    var(--boa-color-coral-900),
    var(--boa-color-coral-300)
  );
  --yg-action-soft-hover: light-dark(
    var(--boa-color-coral-100),
    var(--boa-color-coral-850)
  );
}
.yg-button-label,
.yg-sdk-Button-ButtonInner {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--yg-gap-tight);
}
.yg-button-label {
  min-inline-size: 0;
  transition: transform var(--yg-press) var(--yg-settle);
}
.yg-button:active:not(:disabled, [aria-disabled="true"]) .yg-button-label {
  transform: translateY(1px);
}
.yg-button[data-emphasis="filled"]:active:not(
    :disabled,
    [aria-disabled="true"]
  ) {
  background: var(--yg-action-press);
}
.yg-button:is(:disabled, [aria-disabled="true"]):not([aria-busy="true"]) {
  color: var(--yg-muted);
  background: var(--yg-field);
  box-shadow: none;
}
.yg-icon-button {
  width: var(--yg-size-icon);
  min-height: var(--yg-size-icon);
