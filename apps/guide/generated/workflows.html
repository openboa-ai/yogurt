/* Extended component anatomy. All color roles follow the nearest Yogurt. */
.yg-bottom-action[data-fixed] {
  position: fixed;
  inset-inline: 0;
  inset-block-end: 0;
  z-index: 3;
  padding: var(--boa-space-12) var(--boa-space-16)
    max(var(--boa-space-12), env(safe-area-inset-bottom));
  background: var(--yg-canvas);
}
.yg-aspect {
  width: 100%;
  overflow: hidden;
  border-radius: var(--yg-radius-control);
}
.yg-aspect > :is(img, video) {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.yg-card,
.yg-elevation,
.yg-gradient,
.yg-slide,
.yg-sidebar {
  padding: var(--yg-inset-panel);
  border-radius: var(--yg-radius-panel);
  background: var(--yg-surface);
}
.yg-card {
  display: grid;
  border-radius: var(--yg-radius-card);
  gap: var(--yg-gap-stack);
  align-content: start;
  background: var(--yg-raised-surface);
}
.yg-card p,
.yg-section-line p,
.yg-stepper p,
.yg-post p {
  margin: 0;
}
.yg-asset,
.yg-avatar {
  display: inline-grid;
  place-items: center;
  flex: none;
  overflow: hidden;
  vertical-align: middle;
}
.yg-asset[data-framed],
.yg-avatar {
  background: var(--yg-field);
  color: var(--yg-inverse);
  border-radius: var(--yg-radius-control);
}
.yg-asset > :is(img, video, svg),
.yg-avatar img {
  max-width: 100%;
  max-height: 100%;
  object-fit: cover;
}
.yg-avatar {
  border-radius: 50%;
  font: var(--yg-font-action);
}
.yg-gradient {
  background: linear-gradient(115deg, var(--yg-field), var(--yg-surface));
}
.yg-gradient[data-tone="brand"] {
  background: linear-gradient(115deg, var(--yg-action-soft), var(--yg-surface));
}
.yg-gradient[data-tone="accent"] {
  background: linear-gradient(
    115deg,
    var(--yg-accent-soft),
    var(--yg-surface)
  );
}
.yg-gradient[data-tone="success"] {
  background: linear-gradient(
    115deg,
    var(--yg-success-soft),
    var(--yg-surface)
  );
}
.yg-gradient[data-tone="warning"] {
  background: linear-gradient(
    115deg,
    var(--yg-warning-soft),
    var(--yg-surface)
  );
}
.yg-gradient[data-tone="danger"] {
  background: linear-gradient(115deg, var(--yg-danger-soft), var(--yg-surface));
}
.yg-gradient[data-tone="neutral"] {
  background: linear-gradient(115deg, var(--yg-field), var(--yg-surface));
}
.yg-elevation {
  background: var(--yg-canvas);
}
.yg-elevation[data-level="raised"] {
  box-shadow: var(--yg-lift-shadow);
}
.yg-elevation[data-level="floating"],
.yg-flyout {
  box-shadow: var(--yg-float-shadow);
}
.yg-shortcut {
  display: inline-flex;
  gap: var(--boa-space-4);
}
.yg-shortcut kbd {
  font: var(--yg-font-help);
  color: var(--yg-muted);

.yg-root {
  --yg-surface-edge: color-mix(in srgb, var(--yg-text) 11%, transparent);
  --yg-active-edge: color-mix(in srgb, var(--yg-text) 17%, transparent);
  --yg-focus-surface: var(--yg-hover);
  --yg-raised-surface: light-dark(var(--yg-canvas), var(--yg-surface));
  color-scheme: light dark;
  color: var(--yg-text);
  background: var(--yg-canvas);
  font: var(--yg-font-body);
  letter-spacing: var(--boa-tracking-body);
  text-align: start;
}
.yg-root[data-appearance="light"] {
  color-scheme: light;
}
.yg-root[data-appearance="dark"] {
  color-scheme: dark;
}
.yg-root,
.yg-root :where(*, ::before, ::after) {
  box-sizing: border-box;
}
:where(.yg-root) :where(button, input, select, textarea) {
  font: inherit;
  color: inherit;
}
.yg-root :where(button, summary, select) {
  cursor: pointer;
  touch-action: manipulation;
}
.yg-root :where(:disabled, [aria-disabled="true"]) {
  cursor: default;
}
.yg-root :where(:focus-visible) {
  outline: var(--boa-stroke-focus) solid var(--yg-text);
  outline-offset: 2px;
}
.yg-root [hidden] {
  display: none !important;
}
.yg-heading {
  margin: 0;
  letter-spacing: var(--boa-tracking-heading);
  font: var(--yg-font-heading);
  text-wrap: balance;
}
.yg-text {
  font: var(--yg-font-body);
}
.yg-help,
.yg-text[data-type="help"],
.yg-error {
  display: block;
  margin: 0;
  font: var(--yg-font-help);
  color: var(--yg-muted);
}
.yg-meta,
.yg-text[data-type="meta"] {
  font: var(--yg-font-meta);
  letter-spacing: var(--boa-tracking-meta);
  color: var(--yg-muted);
  font-variant-numeric: tabular-nums;
}
.yg-error {
  color: var(--yg-danger);
}
.yg-label {
  display: block;
  font: var(--yg-font-label);
  letter-spacing: var(--boa-tracking-label);
}
.yg-stack,
.yg-grid,
.yg-field {
  display: grid;
  gap: var(--yg-gap, var(--yg-gap-inline));
  min-width: 0;
  align-content: start;
}
.yg-inline,
.yg-bottom-action,
.yg-modal-header {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--yg-gap, var(--yg-gap-inline));
  min-width: 0;
}
.yg-grid {
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 12rem), 1fr));
}
.yg-surface {
  padding: var(--yg-inset-panel);
  border-radius: var(--yg-radius-panel);
  background: var(--yg-surface);
}
.yg-divider {
  border: 0;
  height: 1px;
  width: 100%;
  background: var(--yg-hover);
  margin: var(--boa-space-8) 0;
}
.yg-scroll {
  overflow: auto;
  overscroll-behavior: contain;
  max-block-size: 15rem;
  scrollbar-width: thin;
}
.yg-icon {
  inline-size: var(--yg-glyph);
  block-size: var(--yg-glyph);
  flex: none;
  vertical-align: middle;
}
.yg-button,
.yg-reading-anchor {
  --yg-button-fill: var(--yg-inverse);
  --yg-button-ink: var(--yg-on-inverse);
  --yg-button-hover: var(--yg-inverse-hover);
  --yg-button-press: var(--yg-inverse-press);
  --yg-button-soft: var(--yg-field);
  --yg-button-soft-hover: var(--yg-hover);
  --yg-button-text: var(--yg-text);
  border: 0;
  appearance: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  vertical-align: middle;
  gap: var(--yg-gap-control);
  min-block-size: var(--yg-size-regular);
  padding: var(--boa-space-4) var(--yg-inset-regular);
  border-radius: var(--yg-radius-control);
  background: var(--yg-button-fill);
  color: var(--yg-button-ink);
  font: var(--yg-font-action);
  letter-spacing: var(--boa-tracking-label);
  text-align: center;
  overflow-wrap: anywhere;
  transition: background-color var(--yg-press) var(--yg-settle),
    color var(--yg-change) var(--yg-settle),
    box-shadow var(--yg-press) var(--yg-settle);
}
.yg-button[data-control-size="compact"] {
  min-block-size: var(--yg-size-compact);
  padding-inline: var(--yg-inset-compact);
  border-radius: var(--yg-radius-small);
  font: var(--yg-font-compact);
}
.yg-button[data-control-size="touch"] {
  min-block-size: var(--yg-size-touch);
  padding-inline: var(--yg-inset-roomy);
}
.yg-button[data-emphasis="soft"] {
  background: var(--yg-button-soft);
  color: var(--yg-button-text);
}
.yg-button[data-emphasis="quiet"],
.yg-reading-anchor {
  background: transparent;
  color: var(--yg-button-text);
}
.yg-button[data-tone="brand"] {
  --yg-button-fill: var(--yg-action);
  --yg-button-ink: var(--yg-on-action);
  --yg-button-hover: var(--yg-action-hover);
  --yg-button-press: var(--yg-action-press);
  --yg-button-soft: var(--yg-action-soft);
  --yg-button-soft-hover: var(--yg-action-soft-hover);
  --yg-button-text: var(--yg-action);
}
.yg-button[data-tone="danger"] {
  --yg-button-soft: var(--yg-danger-soft);
  --yg-button-soft-hover: color-mix(in srgb, var(--yg-danger-soft), var(--yg-danger) 10%);
  --yg-button-text: var(--yg-danger);
}
.yg-button-label,
.yg-sdk-Button-ButtonInner {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--yg-gap-tight);
}
.yg-button-label {
  min-inline-size: 0;
  transition: transform var(--yg-press) var(--yg-settle);
}
.yg-button:active:not(:disabled, [aria-disabled="true"]) .yg-button-label {
  transform: translateY(1px);
}
.yg-button[data-emphasis="filled"]:active:not(
