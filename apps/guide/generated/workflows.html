  --yg-font-meta: var(--boa-weight-regular) 0.75rem/1rem var(--boa-font-family);
  --yg-font-heading: var(--boa-role-weight-heading) 1.25rem/1.625rem var(--boa-font-family);
  --yg-font-display: var(--boa-role-weight-heading) 2.5rem/2.75rem var(--boa-font-family);
  --yg-font-touch: var(--boa-weight-regular) 1rem/1.5rem var(--boa-font-family);
}
.yg-root[data-material="paper"] {
  --yg-canvas: light-dark(var(--boa-color-paper-25), var(--boa-color-paper-975));
  --yg-surface: light-dark(var(--boa-color-paper-50), var(--boa-color-paper-950));
  --yg-field: light-dark(var(--boa-color-paper-100), var(--boa-color-paper-850));
  --yg-hover: light-dark(var(--boa-color-paper-200), var(--boa-color-paper-800));
  --yg-text: light-dark(var(--boa-color-paper-950), var(--boa-color-paper-50));
  --yg-muted: light-dark(var(--boa-color-paper-700), var(--boa-color-paper-300));
}
.yg-root[data-material="mist"] {
  --yg-canvas: light-dark(var(--boa-color-mist-25), var(--boa-color-mist-975));
  --yg-surface: light-dark(var(--boa-color-mist-50), var(--boa-color-mist-950));
  --yg-field: light-dark(var(--boa-color-mist-100), var(--boa-color-mist-850));
  --yg-hover: light-dark(var(--boa-color-mist-200), var(--boa-color-mist-800));
  --yg-text: light-dark(var(--boa-color-mist-950), var(--boa-color-mist-50));
  --yg-muted: light-dark(var(--boa-color-mist-700), var(--boa-color-mist-300));
}

/* Extended component anatomy. All color roles follow the nearest Yogurt. */
.yg-bottom-action[data-fixed] {
  position: fixed;
  inset-inline: 0;
  inset-block-end: 0;
  z-index: 3;
  padding: var(--boa-space-12) var(--boa-space-16)
    max(var(--boa-space-12), env(safe-area-inset-bottom));

}
.yg-aspect {
  width: 100%;

}
.yg-aspect > :is(img, video) {

  height: 100%;
  object-fit: cover;
}
.yg-card,
.yg-elevation,
.yg-gradient,
.yg-slide,
.yg-sidebar {
  padding: var(--yg-inset-panel);
  border-radius: var(--yg-radius-panel);
  background: var(--yg-surface);
}
.yg-card {
  display: grid;
  border-radius: var(--yg-radius-card);

.yg-card p,
.yg-section-line p,
.yg-stepper p,
.yg-post p {

}
.yg-asset,
.yg-avatar {
  display: inline-grid;
  place-items: center;
  flex: none;
  overflow: hidden;
  vertical-align: middle;
}
.yg-asset[data-framed],
.yg-avatar {

  color: var(--yg-action);
  border-radius: var(--yg-radius-control);
}
.yg-asset > :is(img, video, svg),
.yg-avatar img {
  max-width: 100%;
  max-height: 100%;
  object-fit: cover;
}
.yg-avatar {

}
.yg-gradient {
  background: linear-gradient(115deg, var(--yg-action-soft), var(--yg-surface));
}
.yg-gradient[data-tone="accent"] {
  background: linear-gradient(
    115deg,
    var(--yg-accent-soft),
    var(--yg-action-soft)

}
.yg-gradient[data-tone="success"] {
  background: linear-gradient(
    115deg,
    var(--yg-success-soft),
    var(--yg-surface)
  );
}
.yg-gradient[data-tone="warning"] {
  background: linear-gradient(

    var(--yg-warning-soft),
    var(--yg-surface)

}
.yg-gradient[data-tone="danger"] {
  background: linear-gradient(115deg, var(--yg-danger-soft), var(--yg-surface));
}
.yg-gradient[data-tone="neutral"] {
  background: linear-gradient(115deg, var(--yg-field), var(--yg-surface));
}
.yg-elevation {

}
.yg-elevation[data-level="raised"] {

.yg-post {

.yg-post > * + * {

.yg-grid-list,
.yg-stepper,
.yg-trace ol,
.yg-bars ul,
.yg-navigation-menu ul {

  padding: 0;
}
.yg-grid-list {

.yg-section-line,
.yg-value-row,
.yg-code header,
.yg-carousel footer,
.yg-quantity,
.yg-range > div,
.yg-sidebar header,
.yg-navbar,
.yg-attachment {

}
.yg-section-line,

}
.yg-section-line .yg-heading {

}
.yg-bottom-info {

.yg-highlight {

.yg-bars {

.yg-bars ul {

.yg-bubble {

.yg-bubble[data-outgoing] {

.yg-attachment,
.yg-code,
.yg-quantity > div,
.yg-context-target,
.yg-toggle-group {

.yg-attachment {

.yg-marker {

.yg-code header {

.yg-code pre {

.yg-code code {

.yg-trace details > div {

.yg-input-group {

.yg-sidebar a,
.yg-flyout [role="menuitem"],
.yg-flyout a,
.yg-command-list [role="option"] {

.yg-flyout,

.yg-button .yg-button-label {
  position: relative;
  display: inline-grid;
  justify-items: center;
  min-inline-size: 0;

.yg-button-pending {
  display: inline-flex;
  grid-area: 1 / 1;
  align-items: center;
  justify-content: center;
  gap: var(--yg-gap-tight);
  min-inline-size: 0;
}

.yg-button-pending .yg-spinner {
  flex: none;

  position: absolute;
  inset: 0;
}

  visibility: hidden;

  animation: none;

  opacity: 0;

.yg-input,
.yg-select,
.yg-standalone {
  transition: background-color var(--yg-change, var(--yg-travel)) var(--yg-settle);
}

.yg-input:has(:is(input, textarea):focus-visible),
.yg-select:has(select:focus-visible),
.yg-standalone:focus-visible {
  background-color: var(--yg-canvas);
}

.yg-switch [role="switch"] {
  transition: background-color var(--yg-travel) var(--yg-settle);
}

.yg-switch [role="switch"] > span {
  transition:
    transform var(--yg-travel) var(--yg-settle),
    background-color var(--yg-travel) var(--yg-settle);
}

.yg-checkbox [role="checkbox"],
.yg-radio [role="radio"],
.yg-toggle-item,
.yg-rating label,
.yg-otp-slots > span {
  transition:
    background-color var(--yg-change, var(--yg-travel)) var(--yg-settle),
    color var(--yg-change, var(--yg-travel)) var(--yg-settle);
}

.yg-otp:focus-within [data-cursor] {
  background-color: var(--yg-action-soft);
}

.yg-rating label > span {
  pointer-events: none;
  transition: transform var(--yg-press) var(--yg-settle);
}

.yg-rating label:has(input:active) > span {
  transform: translateY(1px);
}

.yg-range input:not(:disabled):active {
  accent-color: var(--yg-action-press);
}

.yg-progress {
  position: relative;
}

.yg-progress progress {
  position: absolute;
  inline-size: 1px;
  block-size: 1px;
  clip-path: inset(50%);
}

.yg-progress > .yg-progress-track {
  display: block;
  block-size: var(--boa-space-4);
  overflow: hidden;
  border-radius: var(--boa-radius-round);
  background: var(--yg-field);
}

.yg-progress-track > span {
  display: block;
  block-size: 100%;
  border-radius: inherit;
  background: var(--yg-action);
  transform: scaleX(var(--yg-progress-completion, 0));
  transform-origin: left center;
  transition: transform var(--yg-change, var(--yg-travel)) var(--yg-settle);
}

.yg-progress-track:dir(rtl) > span {
  transform-origin: right center;
}

.yg-progress progress:not([value]) + .yg-progress-track > span {
  inline-size: 33.333%;
  transform: none;
  animation: yg-progress-sweep calc(2 * var(--yg-busy, 750ms)) var(--yg-settle) infinite alternate;
}

.yg-progress progress:not([value]) + .yg-progress-track:dir(rtl) > span {
  animation-name: yg-progress-sweep-rtl;
}

@keyframes yg-progress-sweep {
  to { transform: translateX(200%); }
}

@keyframes yg-progress-sweep-rtl {
  to { transform: translateX(-200%); }
}

.yg-toast {
  animation: yg-toast-arrive var(--yg-change, var(--yg-travel)) var(--yg-settle);
}

@keyframes yg-toast-arrive {
  from {
    translate: 0 var(--boa-space-8);
  }

@media (forced-colors: active) {
  .yg-progress progress {
    position: static;
    inline-size: 100%;
    block-size: 6px;
    clip-path: none;
    appearance: auto;
  }

  .yg-progress > .yg-progress-track {
    display: none;
  }
}

@media (prefers-reduced-motion: reduce) {
  .yg-input,
  .yg-select,
  .yg-standalone,
  .yg-switch [role="switch"],
  .yg-switch [role="switch"] > span,
  .yg-checkbox [role="checkbox"],
  .yg-radio [role="radio"],
  .yg-toggle-item,
  .yg-rating label,
  .yg-otp-slots > span,
  .yg-progress-track > span {
    transition: none;
  }

  .yg-rating label:has(input:active) > span {

.yg-motion-password > input { box-sizing: border-box; inline-size: 100%; padding: var(--yg-inset-regular); border: 1px solid var(--yg-off); border-radius: var(--yg-radius-control); background: var(--yg-field); color: inherit; font: inherit; }
.yg-motion-password-meter { display: flex; gap: 4px; }
.yg-motion-password-meter span { flex: 1; height: 4px; border-radius: 4px; background: var(--yg-field); transition: background-color var(--yg-change, 180ms); }
.yg-motion-password-meter span[data-active] { background: var(--yg-action); }
.yg-motion-password-checks { font-size: .85em; color: var(--yg-muted); }
.yg-motion-password-checks ul { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 4px; }
.yg-motion-password-checks li[data-passed] { color: var(--yg-text, inherit); }
.yg-motion-checklist { border: 0; padding: 0; margin: 0; display: grid; gap: var(--yg-gap-inline); min-inline-size: 0; }
.yg-motion-checklist legend { font-weight: 600; margin-bottom: 12px; }
.yg-motion-checklist-item { display: flex; gap: 10px; align-items: center; padding: var(--yg-inset-regular); border: 1px solid var(--yg-off); border-radius: var(--yg-radius-control); cursor: pointer; }
.yg-motion-checklist-item:has(input:checked) { background: var(--yg-action-soft); }
.yg-motion-checklist-item input { accent-color: var(--yg-action); }
.yg-motion-dial { justify-items: center; }
.yg-motion-dial-face { position: relative; display: grid; place-items: center; inline-size: 144px; aspect-ratio: 1; border: 1px solid var(--yg-off); border-radius: 50%; background: var(--yg-field); box-shadow: inset 0 0 0 8px var(--yg-surface, transparent); }
.yg-motion-dial-marker { position: absolute; inset: 8px; border-radius: 50%; transform: rotate(var(--yg-dial-angle)); transition: transform var(--yg-change, 180ms) var(--yg-settle, ease); }
.yg-motion-dial-marker::before { content: ""; position: absolute; inset-block-start: 0; inset-inline-start: calc(50% - 2px); inline-size: 4px; block-size: 13px; border-radius: 4px; background: var(--yg-action); }
.yg-motion-dial-value { max-inline-size: 90px; text-align: center; font-weight: 600; }
.yg-motion-dial-options { inline-size: 100%; flex-wrap: wrap; }
.yg-motion-dial-options [data-selected] { color: var(--yg-text, inherit); font-weight: 600; }
@media (prefers-reduced-motion: reduce) { .yg-motion-password-meter span, .yg-motion-dial-marker { transition: none; } }

.yg-motion-password > input { padding: 12px 14px; border-color: var(--yg-surface-edge); background: color-mix(in srgb, var(--yg-surface) 78%, var(--yg-field)); }
.yg-motion-password > input:focus-visible { outline: 2px solid var(--yg-action); outline-offset: 2px; }
.yg-motion-password-meter span { background: color-mix(in srgb, var(--yg-text) 14%, transparent); }
.yg-motion-checklist-item { padding: 11px 14px; border-color: var(--yg-surface-edge); border-radius: var(--yg-radius-control); background: color-mix(in srgb, var(--yg-surface) 82%, var(--yg-field)); }
.yg-motion-checklist-item:has(input:checked) { border-color: color-mix(in srgb, var(--yg-action) 35%, transparent); background: var(--yg-action-soft); }
.yg-motion-dial-face { border-color: var(--yg-surface-edge); background: color-mix(in srgb, var(--yg-surface) 65%, var(--yg-field)); box-shadow: inset 0 0 0 8px var(--yg-surface); }

.yg-motion-range, .yg-motion-password, .yg-motion-dial { gap: 8px; }
.yg-motion-range-heading, .yg-motion-password label, .yg-motion-dial > label { font-size: 13px; line-height: 18px; }
.yg-motion-range-ends, .yg-motion-dial-options, .yg-motion-password-checks { font-size: 12px; line-height: 16px; }
.yg-motion-password > input { min-height: 36px; padding: 8px 12px; border-radius: 8px; font-size: 14px; line-height: 20px; }
.yg-motion-password-checks ul { margin-top: 8px; gap: 4px; }
.yg-motion-checklist legend { margin-bottom: 8px; font-size: 13px; line-height: 18px; }
.yg-motion-checklist-item { min-height: 36px; box-sizing: border-box; gap: 8px; padding: 8px 12px; border-radius: 8px; font-size: 14px; line-height: 20px; }
.yg-motion-dial-face { inline-size: 120px; }
.yg-motion-dial-value { font-size: 14px; line-height: 20px; }

.yg-hold-confirm, .yg-slide-confirm {
  position: relative;
  display: inline-grid;
  place-items: center;
  min-block-size: var(--yg-size-touch);
  min-inline-size: 180px;
  padding: 8px 12px;
  overflow: hidden;
  border: 1px solid var(--yg-off);
  border-radius: var(--yg-radius-control);
  background: var(--yg-field);
  color: var(--yg-text);
  font: inherit;
  font-weight: 600;
  line-height: 1.25;
  cursor: pointer;
  user-select: none;
  box-sizing: border-box;
}
.yg-hold-confirm:focus-visible, .yg-slide-confirm:focus-visible {
  outline: var(--boa-stroke-focus) solid var(--yg-action);
  outline-offset: 3px;
}
.yg-hold-confirm:hover, .yg-slide-confirm:hover { background: var(--yg-hover); }
.yg-hold-confirm:active, .yg-slide-confirm:active { border-color: var(--yg-action); }
.yg-confirm-fill {
  position: absolute;
  inset: 0;
  background: var(--yg-action-soft);
  border-inline-end: 2px solid var(--yg-action);
  transform: scaleX(var(--yg-confirm-progress, 0));
  transform-origin: left center;
  pointer-events: none;
}
.yg-confirm-label { position: relative; z-index: 1; text-align: center; pointer-events: none; }
.yg-slide-confirm { touch-action: pan-y; padding-inline: 48px 12px; }
.yg-slide-confirm-handle {
  position: absolute;
  z-index: 2;
  left: calc(4px + var(--yg-confirm-progress, 0) * (100% - 40px));
  inline-size: 32px;
  block-size: 32px;
  display: grid;
  place-items: center;
  border-radius: var(--yg-radius-control);
  background: var(--yg-action);
  color: var(--yg-on-action, white);
  font-size: 18px;
  line-height: 1;
  pointer-events: none;
}
@media (prefers-reduced-motion: reduce) {
  .yg-hold-confirm, .yg-slide-confirm, .yg-confirm-fill, .yg-slide-confirm-handle { transition: none; animation: none; }
}

.yg-cart-control {
  --yg-cart-slot: var(--yg-size-regular);
  --yg-cart-open: calc(2 * var(--yg-cart-slot) + var(--boa-space-20));
  display: grid;
  justify-items: end;
  inline-size: var(--yg-cart-open);
  max-inline-size: 100%;
  min-block-size: var(--yg-cart-slot);
}
.yg-cart-stepper {
  isolation: isolate;
  position: relative;
  display: grid;
  place-items: center;
  inline-size: min(100%, calc(2 * var(--boa-control-height) + var(--yg-gap-inline)));
  block-size: var(--yg-cart-slot);
  border-radius: var(--yg-radius-control);
  background: var(--yg-action-soft);
  color: var(--yg-action);
}
.yg-cart-control[data-open="true"] .yg-cart-stepper {
  inline-size: 100%;
  background: var(--yg-action);
  color: var(--yg-on-action);
}
.yg-cart-stepper > button {
  position: absolute;
  inset-block: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-wrap: nowrap;
  gap: var(--boa-space-4);
  padding: 0;
  border: 0;
  border-radius: var(--yg-radius-control);
  background: transparent;
  color: inherit;
  font: var(--yg-font-action);
  line-height: 1;
  white-space: nowrap;
  touch-action: manipulation;
  user-select: none;
}
.yg-cart-stepper > button:focus-visible {
  outline: var(--boa-stroke-focus) solid currentColor;
  outline-offset: -3px;
}
.yg-cart-decrease {
  inset-inline-start: 0;
  inline-size: var(--yg-cart-slot);
}
.yg-cart-increase {
  inset-inline-end: 0;
  inline-size: 100%;
}
.yg-cart-control[data-open="true"] .yg-cart-increase {
  inline-size: var(--yg-cart-slot);
}
.yg-cart-increase[aria-disabled="true"] {
  opacity: .55;
}
.yg-cart-stepper .yg-icon { inline-size: var(--yg-glyph); block-size: var(--yg-glyph); flex: none; }
.yg-cart-quantity {
  font: var(--yg-font-action);
  font-weight: var(--boa-weight-semibold);
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.yg-cart-quantity span {
  display: inline-block;
}
@media (hover: hover) {
  .yg-cart-stepper > button:hover:not([aria-disabled="true"]) {
    background: color-mix(in srgb, currentColor 12%, transparent);
  }
}
@media (pointer: coarse) {
  .yg-cart-control { --yg-cart-slot: var(--yg-size-touch); }
}
@media (prefers-reduced-motion: no-preference) {
  .yg-cart-stepper {
    transition: inline-size var(--yg-expand) var(--yg-arrive), color var(--yg-panel) var(--yg-settle),
      background-color var(--yg-panel) var(--yg-settle);
  }
  .yg-cart-quantity span {
    animation: yg-cart-count var(--yg-travel) var(--yg-settle);
  }
  .yg-cart-decrease, .yg-cart-increase > span {
    animation: yg-cart-label var(--yg-panel) var(--yg-settle);
  }
}
@keyframes yg-cart-count {
  from { opacity: .35; translate: 0 var(--boa-space-4); }
}
@keyframes yg-cart-label {
  from { opacity: .4; }
}
@media (forced-colors: active) {
  .yg-cart-stepper { box-shadow: inset 0 0 0 1px ButtonText; border: 1px solid ButtonText; }
}

.yg-cart-stepper { overflow: hidden; }
.yg-cart-quantity { min-inline-size: 2ch; text-align: center; }
.yg-cart-control[data-open="true"] .yg-cart-quantity { padding-inline: var(--boa-space-4); }
.yg-cart-stepper > button { cursor: pointer; }

.yg-root {
  --yg-surface-edge: color-mix(in srgb, var(--yg-text) 11%, transparent);
  --yg-active-edge: color-mix(in srgb, var(--yg-action) 17%, transparent);
  --yg-raised-surface: light-dark(var(--yg-canvas), var(--yg-surface));
  color-scheme: light dark;
  color: var(--yg-text);
  background: var(--yg-canvas);
  font: var(--yg-font-body);
  letter-spacing: var(--boa-tracking-body);
  text-align: start;
}
.yg-root[data-appearance="light"] {
  color-scheme: light;
}
.yg-root[data-appearance="dark"] {
  color-scheme: dark;
}
.yg-root,
.yg-root :where(*, ::before, ::after) {
  box-sizing: border-box;
}
.yg-root :where(button, input, select, textarea) {
  font: inherit;
  color: inherit;
}
.yg-root :where(button, summary, select) {
  cursor: pointer;
  touch-action: manipulation;
}
.yg-root :where(:disabled, [aria-disabled="true"]) {
  cursor: default;
}
.yg-root :where(:focus-visible) {
  outline: var(--boa-stroke-focus) solid var(--yg-action);
  outline-offset: 2px;
}
.yg-root [hidden] {
  display: none !important;
}
.yg-heading {
  margin: 0;
  letter-spacing: var(--boa-tracking-heading);
  font: var(--yg-font-heading);
  text-wrap: balance;
}
.yg-text {
  font: var(--yg-font-body);
}
.yg-help,
.yg-text[data-type="help"],
.yg-error {
  display: block;
  margin: 0;
  font: var(--yg-font-help);
  color: var(--yg-muted);
}
.yg-meta,
.yg-text[data-type="meta"] {
  font: var(--yg-font-meta);
  letter-spacing: var(--boa-tracking-meta);
  color: var(--yg-muted);
  font-variant-numeric: tabular-nums;
}
.yg-error {
  color: var(--yg-danger);
}
.yg-label {
  display: block;
  font: var(--yg-font-label);
  letter-spacing: var(--boa-tracking-label);
}
.yg-stack,
.yg-grid,
.yg-field {
  display: grid;
  gap: var(--yg-gap, var(--boa-space-8));
  min-width: 0;
  align-content: start;
}
.yg-inline,
.yg-bottom-action,
.yg-modal-header {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--yg-gap, var(--boa-space-8));
  min-width: 0;
}
.yg-grid {
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 12rem), 1fr));
}
.yg-surface {
  padding: var(--boa-space-16);
  border-radius: var(--yg-radius-panel);
  background: var(--yg-surface);
}
.yg-divider {
  border: 0;
  height: 1px;
  width: 100%;
  background: var(--yg-hover);
  margin: var(--boa-space-8) 0;
}
.yg-scroll {
  overflow: auto;
  overscroll-behavior: contain;
  max-block-size: 15rem;
  scrollbar-width: thin;
}
.yg-icon {
  inline-size: var(--yg-glyph);
  block-size: var(--yg-glyph);
  flex: none;
  vertical-align: middle;
}
.yg-button,
.yg-reading-anchor {
  border: 0;
  appearance: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  vertical-align: middle;
  gap: var(--yg-gap-tight);
  min-block-size: var(--yg-size-regular);
  padding: var(--boa-space-4) var(--yg-inset-regular);
  border-radius: var(--yg-radius-control);
  background: var(--yg-action);
  color: var(--yg-on-action);
  font: var(--yg-font-action);
  letter-spacing: var(--boa-tracking-label);
  text-align: center;
  overflow-wrap: anywhere;
  transition: background-color var(--yg-press) var(--yg-settle), box-shadow var(--yg-press) var(--yg-settle);
}
.yg-button[data-control-size="compact"] {
  min-block-size: var(--yg-size-compact);
  padding-inline: var(--yg-inset-compact);
  border-radius: var(--yg-radius-small);
  font: var(--yg-font-compact);
}
.yg-button[data-control-size="touch"] {
  min-block-size: var(--yg-size-touch);
  padding-inline: var(--yg-inset-roomy);
}
.yg-button[data-emphasis="soft"] {
  background: var(--yg-action-soft);
  color: var(--yg-action);
}
.yg-button[data-emphasis="quiet"],
.yg-reading-anchor {
  background: transparent;
  color: var(--yg-action);
}
.yg-button[data-tone="danger"] {
  --yg-action: var(--yg-danger);
  --yg-on-action: light-dark(
    var(--boa-color-coral-50),
    var(--boa-color-coral-950)
  );
  --yg-action-soft: var(--yg-danger-soft);
  --yg-action-hover: light-dark(
    var(--boa-color-coral-800),
    var(--boa-color-coral-100)
  );
  --yg-action-press: light-dark(
    var(--boa-color-coral-900),
    var(--boa-color-coral-300)
  );
  --yg-action-soft-hover: light-dark(
    var(--boa-color-coral-100),
    var(--boa-color-coral-850)
  );
}
.yg-button-label,
.yg-sdk-Button-ButtonInner {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--yg-gap-tight);
}
.yg-button-label {
  min-inline-size: 0;
  transition: transform var(--yg-press) var(--yg-settle);
}
.yg-button:active:not(:disabled, [aria-disabled="true"]) .yg-button-label {
  transform: translateY(1px);
}
.yg-button[data-emphasis="filled"]:active:not(
    :disabled,
    [aria-disabled="true"]
  ) {
  background: var(--yg-action-press);
}
.yg-button:is(:disabled, [aria-disabled="true"]):not([aria-busy="true"]) {
  color: var(--yg-muted);
  background: var(--yg-field);
  box-shadow: none;
}
.yg-icon-button {
  width: var(--yg-size-icon);
  min-height: var(--yg-size-icon);
  border-radius: var(--yg-radius-small);
  padding: 0;
  flex: none;
}
