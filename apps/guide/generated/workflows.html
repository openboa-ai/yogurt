  @keyframes yg-hold-draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
  @keyframes yg-confirm-check { from { opacity: 0; transform: translateY(6px); } }
  @media (forced-colors: active) {
    .yg-hold-confirm, .yg-slide-confirm { box-shadow: inset 0 0 0 1px ButtonText; }
    .yg-slide-confirm-handle { outline: 1px solid ButtonText; }
  }
}

@layer yg.patterns {
  .yg-cart-control {
    --yg-cart-slot: var(--yg-size-regular);
    --yg-cart-open: calc(3 * var(--yg-cart-slot));
    --yg-cart-closed: calc(2 * var(--yg-cart-slot) + var(--boa-space-8));
    --yg-cart-ease: var(--yg-arrive);
    position: relative;
    display: grid;
    justify-items: end;
    inline-size: var(--yg-cart-open);
    max-inline-size: 100%;
    min-block-size: var(--yg-cart-slot);
  }
  .yg-cart-stepper {
    isolation: isolate;
    position: relative;
    display: grid;
    place-items: center;
    inline-size: min(100%, var(--yg-cart-closed));
    block-size: var(--yg-cart-slot);
    border: 1px solid var(--yg-border-subtle);
    border-radius: var(--yg-radius-control);
    background: var(--yg-raised-surface);
    color: var(--yg-text);
  }
  .yg-cart-control[data-open="true"] .yg-cart-stepper {
    inline-size: 100%;
    background: var(--yg-text);
    color: var(--yg-canvas);
  }
  .yg-cart-stepper > button {
    position: absolute;
    inset-block: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-wrap: nowrap;
    cursor: pointer;
    gap: var(--boa-space-4);
    padding: 0;
    border: 0;
    border-radius: var(--yg-radius-control);
    background: transparent;
    color: inherit;
    font: var(--yg-font-action);
    line-height: 1;
    white-space: nowrap;
    touch-action: manipulation;
    user-select: none;
  }
  .yg-cart-stepper > [hidden] { display: none; }
  .yg-cart-stepper > button:focus-visible {
    outline: none;
    box-shadow: 0 0 0 1.5px var(--yg-focus-ring), 0 0 0 3.5px var(--yg-focus-halo);
  }
  @media (forced-colors: active) {
    .yg-cart-stepper > button:focus-visible {
      outline: var(--boa-stroke-focus) solid Highlight;
      outline-offset: -3px;
      box-shadow: none;
    }
  }
  .yg-cart-decrease {
    inset-inline-start: 0;
    inline-size: var(--yg-cart-slot);
  }
  .yg-cart-increase {
    inset-inline-end: 0;
    inline-size: 100%;
    justify-content: space-between;
    padding-inline: var(--yg-inset-row) calc((var(--yg-cart-slot) - var(--yg-glyph)) / 2);
  }
  .yg-cart-control[data-open="true"] .yg-cart-increase {
    inline-size: var(--yg-cart-slot);
    justify-content: center;
    padding: 0;
  }
  .yg-cart-increase[aria-disabled="true"] {
    opacity: .55;
  }
  .yg-cart-stepper .yg-icon { inline-size: var(--yg-glyph); block-size: var(--yg-glyph); flex: none; }
  .yg-cart-quantity {
    font: var(--yg-font-action);
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .yg-cart-quantity { overflow: hidden; }
  .yg-cart-roll { position: relative; display: inline-grid; }
  .yg-cart-previous { display: none; position: absolute; inset: 0; }
  .yg-cart-current { display: block; }
  @media (hover: hover) {
    .yg-cart-stepper > button:hover:not([aria-disabled="true"]) {
      background: color-mix(in srgb, currentColor 12%, transparent);
    }
  }
  @media (prefers-reduced-motion: no-preference) {
    .yg-cart-stepper {
      transition:
        inline-size var(--yg-travel) var(--yg-cart-ease),
        background-color var(--yg-change) var(--yg-cart-ease),
        color var(--yg-change) var(--yg-cart-ease);
    }
    .yg-cart-current { animation: yg-cart-count var(--yg-change) var(--yg-cart-ease) both; }
    .yg-cart-previous {
      display: block;
      animation: yg-cart-count-out var(--yg-change) var(--yg-cart-ease) both;
    }
    .yg-cart-increase > span { animation: yg-cart-label var(--yg-press) var(--yg-cart-ease) both; }
  }
  @media (prefers-reduced-motion: reduce) {
    .yg-cart-stepper { transition: none; }
    .yg-cart-stepper :is(.yg-cart-current, .yg-cart-previous, .yg-cart-increase > span) {
      animation: none;
    }
  }
  @keyframes yg-cart-count {
    from { opacity: 0; translate: 0 var(--yg-cart-count-offset, 12px); }
  }
  @keyframes yg-cart-count-out {
    from { opacity: 1; translate: 0 0; }
    to { opacity: 0; translate: 0 calc(-1 * var(--yg-cart-count-offset, 12px)); }
  }
  @keyframes yg-cart-label {
    from { opacity: 0; scale: .75; }
  }
  @media (forced-colors: active) {
    .yg-cart-stepper { box-shadow: inset 0 0 0 1px ButtonText; border: 1px solid ButtonText; }
  }

  .yg-cart-stepper { overflow: hidden; }
  .yg-cart-quantity { min-inline-size: 2ch; text-align: center; }
  .yg-cart-control[data-open="true"] .yg-cart-quantity { padding-inline: var(--boa-space-4); }
  .yg-cart-quantity [data-direction="down"] { --yg-cart-count-offset: -12px; }
  .yg-cart-limit {
    position: absolute;
    z-index: 1;
    inset-block-end: calc(100% + var(--yg-gap-tight));
    inset-inline-end: 0;
    inline-size: max-content;
    max-inline-size: min(90vw, 14rem);
    pointer-events: none;
    font: var(--yg-font-meta);
  }
  .yg-cart-limit:not(:empty) {
    color: var(--yg-canvas);
    background: var(--yg-text);
    padding: var(--boa-space-4) var(--yg-inset-compact);
    border-radius: var(--yg-radius-small);
  }
}

@layer yg.base {
  .yg-root {
    --yg-surface-edge: var(--yg-border-subtle);
    --yg-active-edge: var(--yg-border-strong);
    --yg-focus-surface: var(--yg-input-surface);
    --yg-raised-surface: var(--yg-raised);
    color-scheme: light dark;
    color: var(--yg-text);
    background: var(--yg-canvas);
    font: var(--yg-font-body);
    font-feature-settings: "cv02", "cv03", "cv04", "ss01";
    -webkit-font-smoothing: antialiased;
    letter-spacing: var(--yg-tracking-body);
    text-align: start;
  }
  /* Keep 1rem anchored to the browser root font size when .yg-root is placed on <html>. */
  :root.yg-root {
    font-size: 100%;
  }
  :root.yg-root > body {
    font: var(--yg-font-body);
    font-feature-settings: "cv02", "cv03", "cv04", "ss01";
    letter-spacing: var(--yg-tracking-body);
  }
  .yg-root[data-appearance="light"] {
    color-scheme: light;
  }
  .yg-root[data-appearance="dark"] {
    color-scheme: dark;
  }
  .yg-root,
  .yg-root :where(*, ::before, ::after) {
    box-sizing: border-box;
  }
  :where(.yg-root) :where(button, input, select, textarea) {
    font: inherit;
    color: inherit;
  }
  .yg-root :where(button, summary, select) {
    cursor: pointer;
    touch-action: manipulation;
  }
  .yg-root :where(:disabled, [aria-disabled="true"]) {
    cursor: default;
  }
  .yg-root :where(:focus-visible) {
    outline: none;
    box-shadow: 0 0 0 1.5px var(--yg-focus-ring), 0 0 0 3.5px var(--yg-focus-halo);
  }
  @media (forced-colors: active) {
    .yg-root :where(:focus-visible) {
      outline: var(--boa-stroke-focus) solid CanvasText;
      outline-offset: 2px;
      box-shadow: none;
    }
  }
  .yg-root [hidden] {
    display: none !important;
  }

  .yg-heading {
    margin: 0;
    font: var(--yg-font-heading);
    letter-spacing: var(--yg-tracking-heading);
    text-wrap: balance;
  }
  h1.yg-heading,
  .yg-heading[data-level="1"] {
    font-size: 1.5rem;
    line-height: 1.875rem;
  }
  h2.yg-heading,
  .yg-heading[data-level="2"] {
    font-size: 1.125rem;
    line-height: 1.5rem;
  }
  h3.yg-heading,
  .yg-heading[data-level="3"] {
    font-size: 1rem;
    line-height: 1.375rem;
  }
  h4.yg-heading,
  .yg-heading[data-level="4"] {
    font-size: 0.875rem;
    line-height: 1.25rem;
  }
  h5.yg-heading,
  .yg-heading[data-level="5"] {
    font-size: 0.8125rem;
    line-height: 1.125rem;
  }
  h6.yg-heading,
  .yg-heading[data-level="6"] {
    font-size: 0.75rem;
    line-height: 1rem;
  }
  .yg-text {
    font: var(--yg-font-body);
    letter-spacing: var(--yg-tracking-body);
  }
  .yg-help,
  .yg-text[data-type="help"],
  .yg-error {
    display: block;
    margin: 0;
    font: var(--yg-font-help);
    letter-spacing: var(--yg-tracking-help);
    color: var(--yg-muted);
  }
  .yg-meta,
  .yg-text[data-type="meta"] {
    font: var(--yg-font-meta);
    letter-spacing: var(--yg-tracking-meta);
    color: var(--yg-muted);
    font-variant-numeric: tabular-nums;
  }
  .yg-cap,
  .yg-text[data-type="cap"] {
    font: var(--yg-font-cap);
    letter-spacing: var(--yg-tracking-cap);
    text-transform: uppercase;
    color: var(--yg-muted);
  }
  .yg-error {
    color: var(--yg-danger);
  }
  .yg-label {
    display: block;
    font: var(--yg-font-label);
    letter-spacing: var(--yg-tracking-label);
    color: var(--yg-muted);
  }

  .yg-stack {
    display: flex;
    flex-direction: column;
    gap: var(--yg-gap, var(--yg-gap-inline));
    min-width: 0;
  }
  .yg-stack > :is(.yg-button, .yg-badge, .yg-count, .yg-segment, .yg-anchor, .yg-status) {
    align-self: flex-start;
  }
  .yg-stack[data-align="stretch"] {
    align-items: stretch;
  }
  .yg-stack[data-align="stretch"] > * {
    align-self: stretch;
  }
  .yg-stack[data-align="start"] {
    align-items: flex-start;
  }
  .yg-stack[data-align="center"] {
    align-items: center;
  }
  .yg-stack[data-align="end"] {
    align-items: flex-end;
  }

  .yg-grid,
  .yg-field {
    display: grid;
    gap: var(--yg-gap, var(--yg-gap-inline));
    min-width: 0;
    align-content: start;
  }
  .yg-inline,
  .yg-bottom-action,
  .yg-modal-header {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: var(--yg-gap, var(--yg-gap-inline));
    min-width: 0;
  }
  .yg-inline[data-align="start"] { align-items: flex-start; }
  .yg-inline[data-align="center"] { align-items: center; }
  .yg-inline[data-align="end"] { align-items: flex-end; }
  .yg-inline[data-align="baseline"] { align-items: baseline; }
  .yg-inline[data-align="stretch"] { align-items: stretch; }
  .yg-inline[data-justify="start"] { justify-content: flex-start; }
  .yg-inline[data-justify="center"] { justify-content: center; }
  .yg-inline[data-justify="end"] { justify-content: flex-end; }
  .yg-inline[data-justify="between"] { justify-content: space-between; }
  .yg-inline[data-wrap="false"] { flex-wrap: nowrap; }

  .yg-grid {
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 12rem), 1fr));
  }

  .yg-surface {
    padding: var(--yg-card-inset-regular);
    border-radius: var(--yg-radius-panel);
    background: var(--yg-surface);
    border: 1px solid var(--yg-border-subtle);
    box-shadow: none;

  }
  .yg-dialog {
    inset: 0;
    margin: auto;
    width: min(25rem, calc(100% - 32px));
    max-height: calc(100dvh - 32px);
    overflow: auto;
    padding: var(--yg-inset-sheet);
    color: var(--yg-text);
    background: var(--yg-elevated);
    border: 1px solid var(--yg-border-subtle);
    border-radius: var(--yg-radius-sheet);
    box-shadow: var(--yg-panel-shadow);
    gap: var(--yg-gap-stack);
  }
  .yg-dialog[open] {
    display: grid;
    --yg-enter-y: var(--boa-space-8);
    animation: yg-enter var(--yg-panel) var(--yg-arrive);
  }
  .yg-dialog::backdrop {
    background: color-mix(in srgb, var(--yg-overlay-ink) var(--yg-overlay-scrim), transparent);
  }
  .yg-dialog[open]::backdrop {
    animation: yg-dim var(--yg-travel) var(--yg-settle);
  }
  @keyframes yg-dim {
    from { opacity: 0; }
  }
  .yg-modal-header {
    justify-content: space-between;
    flex-wrap: nowrap;
  }
  .yg-sheet[open] {
    --yg-enter-x: var(--boa-space-16);
    --yg-enter-y: 0;
  }
  .yg-sheet[open]:dir(rtl) { --yg-enter-x: calc(-1 * var(--boa-space-16)); }
  .yg-dialog.yg-drawer[open] { --yg-enter-y: var(--boa-space-16); }
  .yg-sheet {
    margin-inline-end: 0;
    height: 100dvh;
    max-height: 100dvh;
    align-content: start;
    border-start-end-radius: 0;
    border-end-end-radius: 0;
  }
  @media (max-width: 38rem) {
    .yg-sheet[open],
    .yg-sheet[open]:dir(rtl) {
      --yg-enter-x: 0px;
      --yg-enter-y: var(--boa-space-16);
    }
    .yg-sheet {
      margin: auto 0 0;
      width: 100%;
      height: auto;
      max-height: 85dvh;
      padding-bottom: max(var(--boa-space-24), env(safe-area-inset-bottom));
      border-radius: var(--yg-radius-panel) var(--yg-radius-panel) 0 0;
    }
  }
  @supports (overlay: auto) {
    @media (prefers-reduced-motion: no-preference) {
      .yg-dialog {
        --yg-modal-x: 0px;
        --yg-modal-y: var(--boa-space-8);
        opacity: 0;
        translate: var(--yg-modal-x) var(--yg-modal-y);
        transition: opacity var(--yg-layer) var(--yg-settle),
          translate var(--yg-layer) var(--yg-settle),
          overlay var(--yg-layer) allow-discrete,
          display var(--yg-layer) allow-discrete;
      }
      .yg-dialog[open] {
        opacity: 1;
        translate: 0 0;
        animation: none;
        transition-duration: var(--yg-panel);
      }
      .yg-dialog[open]::backdrop { opacity: 1; animation: none; }
      .yg-dialog::backdrop {
        opacity: 0;
        transition: opacity var(--yg-travel) var(--yg-settle),
          overlay var(--yg-layer) allow-discrete,
          display var(--yg-layer) allow-discrete;
      }
      .yg-dialog:not([open]),
      .yg-dialog:not([open])::backdrop { pointer-events: none; }
      .yg-dialog.yg-drawer { --yg-modal-y: var(--boa-space-16); translate: 0 var(--yg-modal-y); }
      .yg-dialog.yg-drawer[open] { translate: 0 var(--yg-drag-distance, 0px); }
      .yg-dialog.yg-drawer[data-dragging] { transition: none; }
      .yg-dialog.yg-sheet { --yg-modal-x: var(--boa-space-16); --yg-modal-y: 0px; }
      .yg-dialog.yg-sheet:dir(rtl) { --yg-modal-x: calc(-1 * var(--boa-space-16)); }
      @media (max-width: 38rem) {
        .yg-dialog.yg-sheet,
        .yg-dialog.yg-sheet:dir(rtl) {
          --yg-modal-x: 0px;
          --yg-modal-y: var(--boa-space-16);
        }
      }
      @starting-style {
        .yg-dialog[open] { opacity: 0; translate: var(--yg-modal-x) var(--yg-modal-y); }
        .yg-dialog.yg-drawer[open] { translate: 0 var(--yg-modal-y); }
        .yg-dialog[open]::backdrop { opacity: 0; }
      }
    }
  }

  /* Card */
  .yg-card {
    display: grid;
    box-sizing: border-box;
    min-inline-size: 0;
    padding: var(--yg-card-inset-regular);
    border-radius: var(--yg-card-corner);
    gap: var(--yg-gap-stack);
    align-content: start;
    background: var(--yg-raised);
    border: 1px solid var(--yg-border-subtle);
    box-shadow: none;
  }
  .yg-card[data-variant="outlined"] {
    background: var(--yg-canvas);
    border-color: var(--yg-border-chrome);
  }
  .yg-card[data-variant="subtle"] {
    background: var(--yg-surface);
    border-color: var(--yg-border-subtle);
  }
  .yg-card[data-density="compact"] {
    padding: var(--yg-card-inset-compact);
    gap: var(--yg-gap-row);
  }
  .yg-card[data-density="spacious"] {
    padding: var(--yg-card-inset-spacious);
    gap: var(--yg-gap-panel);
  }
  .yg-card-header {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    justify-content: space-between;
    gap: var(--yg-gap-inline) var(--yg-gap-stack);
    min-width: 0;
  }
  .yg-card-header-copy {
    display: grid;
    gap: var(--yg-gap-card-copy);
    min-width: 0;
    flex: 1 1 10rem;
  }
  .yg-card-header-copy > .yg-heading {
    font: var(--yg-font-card-title);
    letter-spacing: var(--yg-tracking-card-title);
  }
  .yg-card-header-action {
    flex: 0 1 auto;
    min-width: 0;
    max-inline-size: 100%;
    display: inline-flex;
    align-items: center;
  }
  .yg-card-body {
    min-width: 0;
  }
  .yg-card-body h4.yg-heading,
  .yg-card-body .yg-heading[data-level="4"] {
    font-size: var(--yg-type-action-size);
    line-height: var(--yg-type-action-line);
  }
  .yg-card-footer {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: var(--yg-gap-inline);
    padding-block-start: var(--yg-gap-stack);
    border-block-start: 1px solid var(--yg-border-subtle);
  }
  .yg-decision-card {
    border-color: color-mix(in srgb, var(--yg-brand-ink) 26%, var(--yg-border-subtle));
  }
  .yg-decision-card[data-state="held"] {
    border-color: color-mix(in srgb, var(--yg-warning) 30%, var(--yg-border-subtle));
  }
  .yg-decision-card[data-state="approved"] {
    border-color: color-mix(in srgb, var(--yg-success) 30%, var(--yg-border-subtle));
  }
  .yg-decision-card[data-state="destructive"],
  .yg-decision-card[data-state="rejected"] {
    border-color: color-mix(in srgb, var(--yg-danger) 30%, var(--yg-border-subtle));
  }
  .yg-settings-grid {
    display: grid;
    gap: var(--boa-space-12);
    grid-template-columns: minmax(0, 1fr);
    min-inline-size: 0;
  }

  /* List & ListRow */
  .yg-list {
    container-type: inline-size;
    display: flex;
    flex-direction: column;
    gap: var(--boa-space-2);
    min-width: 0;
  }
  .yg-list[data-divided] {
    gap: 0;
  }
  .yg-list[data-divided] > .yg-list-item + .yg-list-item,
  .yg-list-item[data-separator] {
    border-block-start: 1px solid var(--yg-border-subtle);
  }
  .yg-list[data-divided] > .yg-list-item:first-child[data-separator] {
    border-block-start: 0;
  }
  .yg-list-item {
    min-width: 0;
  }
  .yg-row {
    display: flex;
    align-items: center;
    gap: var(--yg-list-row-gap);
    color: var(--yg-text);
    font: var(--yg-font-body);
    text-decoration: none;
    background: transparent;
    border: 0;
    width: 100%;
    min-height: var(--yg-list-row-height);
    padding: 5px var(--yg-list-row-inset);
    border-radius: var(--yg-radius-control);
    text-align: start;
  }
  .yg-row[aria-current="true"],
  .yg-row[data-current="true"] {
    background: var(--yg-field);
    color: var(--yg-text);
  }
  .yg-row-split {
    padding: 0;
    gap: var(--yg-gap-inline);
  }
  .yg-row-trigger {
    display: flex;
    align-items: center;
    gap: var(--yg-list-row-gap);
    flex: 1;
    min-width: 0;
    min-height: var(--yg-list-row-height);
    padding: 5px var(--yg-list-row-inset);
    border: 0;
    border-radius: var(--yg-radius-control);
    background: transparent;
    color: inherit;
    font: inherit;
    text-align: start;
    text-decoration: none;
    cursor: pointer;
  }
  .yg-row-label {
    display: grid;
    flex: 1;
    min-width: 0;
    gap: var(--boa-space-2);
    overflow-wrap: anywhere;
  }
  .yg-row-title-line {
    display: inline-flex;
    align-items: center;
    flex-wrap: wrap;
    gap: var(--boa-space-6);
    min-width: 0;
  }
  .yg-row-title {
    font: var(--yg-font-action);
    letter-spacing: var(--yg-tracking-action);
    color: var(--yg-text);
  }
  .yg-row-inline-meta {
    display: inline-flex;
    align-items: center;
    gap: var(--boa-space-4);
    flex: none;
  }
  .yg-row-end {
    display: inline-flex;
    align-items: center;
    gap: var(--yg-gap-inline);
    flex: none;
    margin-inline-start: auto;
  }
  .yg-row-value {
    display: inline-flex;
    align-items: center;
    color: var(--yg-muted);
    font: var(--yg-font-meta);
    font-variant-numeric: tabular-nums;
  }
  .yg-row-actions {
    display: inline-flex;
    align-items: center;
    gap: var(--boa-space-4);
  }
  .yg-leading,
  .yg-trailing {
    display: inline-flex;
    align-items: center;
    flex: none;
  }
  .yg-trailing {
    color: var(--yg-muted);
    font: var(--yg-font-meta);
  }
  @container (max-width: 24rem) {
    .yg-row,
    .yg-row-split {
      flex-wrap: wrap;
      row-gap: var(--boa-space-6);
    }
    .yg-row-end {
      margin-inline-start: 0;
      width: 100%;
      justify-content: flex-end;
    }
  }

  /* Filter, Pure Yogurt Badge & Feedback */
  .yg-filter {
    display: flex;
    align-items: end;
    gap: var(--boa-space-8);
    flex-wrap: wrap;
  }
  .yg-filter > .yg-field {
    flex: 1;
    min-width: min(100%, 10rem);
  }
  .yg-count,
  .yg-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: fit-content;
    max-inline-size: 100%;
    min-block-size: 24px;
    box-sizing: border-box;
    overflow: hidden;
    text-overflow: ellipsis;
    gap: var(--boa-space-6);
    background: var(--yg-field);
    color: var(--yg-tone-fg, var(--yg-muted));
    border: 1px solid var(--yg-border-subtle);
    padding: 2px 10px;
    border-radius: var(--yg-radius-pill);
    font: var(--yg-font-badge);
    letter-spacing: var(--yg-tracking-badge);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .yg-badge-dot {
    inline-size: 6px;
    block-size: 6px;
    border-radius: 50%;
    background: var(--yg-tone-fg, var(--yg-text-subtle));
    flex: none;
  }
  .yg-badge[data-variant="soft"][data-tone]:not([data-tone="neutral"]) {
    background: color-mix(in srgb, var(--yg-tone-fg) 8%, transparent);
    border-color: color-mix(in srgb, var(--yg-tone-fg) 22%, transparent);
  }
  .yg-count {
    border-radius: var(--yg-radius-chip);
    min-block-size: 20px;
    padding: 1px 7px;
    gap: var(--boa-space-4);
    background: light-dark(var(--yg-raised), var(--yg-field));
    border-color: var(--yg-border-chrome);
  }
  .yg-badge[data-variant="outline"] {
    background: transparent;
    color: var(--yg-tone-fg, var(--yg-text));
    border-color: var(--yg-tone-border, var(--yg-border-chrome));
  }
  .yg-badge[data-variant="outline"][data-tone]:not([data-tone="neutral"]) {
    background: transparent;
    border-color: color-mix(in srgb, var(--yg-tone-fg) 32%, transparent);
  }
  .yg-signal-dot {
    display: inline-block;
    inline-size: 6px;
    block-size: 6px;
    border-radius: 50%;
    background: var(--yg-brand-ink);
    flex: none;
  }
  .yg-notice {
    display: flex;
    align-items: start;
    gap: var(--boa-space-8);
    padding: var(--boa-space-12) var(--boa-space-16);
    border-radius: var(--yg-radius-card);
    background: var(--yg-tone-bg, var(--yg-raised));
    border: 1px solid var(--yg-tone-border, var(--yg-border-subtle));
    color: var(--yg-tone-fg, var(--yg-text));
  }
  .yg-notice > .yg-icon { margin-block-start: var(--boa-space-2); }
  .yg-notice strong { font: var(--yg-font-action); letter-spacing: var(--yg-tracking-action); }
  .yg-message strong { font: var(--yg-font-action); letter-spacing: var(--yg-tracking-action); }
  .yg-notice > div > div { font: var(--yg-font-help); }
  .yg-status,
  .yg-activity,
  .yg-legend {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font: var(--yg-font-compact);
    letter-spacing: var(--yg-tracking-compact);
    color: var(--yg-tone-fg, var(--yg-muted));
  }
  .yg-status-dot,
  .yg-legend i {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
    flex: none;
  }
  .yg-progress {
    display: grid;
    gap: var(--boa-space-4);
  }
  .yg-progress > span,
  .yg-facts dl > div,
  .yg-chart-range {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: var(--boa-space-12);
  }
  .yg-progress progress {
    border: 0;
    accent-color: var(--yg-inverse);
  }
  .yg-skeleton {
    display: grid;
    gap: var(--boa-space-8);
  }
  .yg-skeleton span {
    height: 12px;
    background: light-dark(var(--yg-hover), var(--yg-field));
    border-radius: var(--yg-radius-small);
  }
  .yg-skeleton span:last-child { width: 64%; }
  .yg-toast {
    display: flex;
    gap: var(--boa-space-12);
    align-items: center;
    justify-content: space-between;
    width: fit-content;
    max-width: 100%;
    min-block-size: 36px;
    background: var(--yg-inverse);
    color: var(--yg-on-inverse);
    border: 1px solid var(--yg-border-subtle);
    padding: var(--boa-space-4) var(--boa-space-8) var(--boa-space-4) var(--boa-space-16);
    border-radius: var(--boa-radius-round);
    box-shadow: var(--yg-float-shadow);
  }
  .yg-toast .yg-icon-button { color: inherit; }
  .yg-result {
    padding-block: var(--boa-space-12);
  }
  .yg-receipt {
    padding: var(--boa-space-16);
    background: var(--yg-surface);
    border: 1px solid var(--yg-border-subtle);
    border-radius: var(--yg-radius-card);
    box-shadow: none;
  }

  /* Data, Table, Chart, Avatar & Message */
  .yg-facts {
    box-sizing: border-box;
    padding: var(--boa-space-12) var(--boa-space-16);
    background: var(--yg-raised);
    border: 1px solid var(--yg-border-subtle);
    border-radius: var(--yg-radius-card);
  }
  :is(.yg-decision-card, .yg-runtime-preview, .yg-card) .yg-facts {
    padding: 0;
    background: transparent;
    border: 0;
    border-radius: 0;
  }
  .yg-facts dl {
    margin: var(--boa-space-10) 0;
  }
  .yg-facts dl > div {
    padding-block: var(--boa-space-6);
    border-block-end: 1px solid var(--yg-border-subtle);
  }
  .yg-facts dl > div:last-child {
    border-block-end: 0;
  }
  .yg-facts dt { color: var(--yg-muted); font: var(--yg-font-help); }
  .yg-facts dd { margin: 0; text-align: end; font: var(--yg-font-action); font-variant-numeric: tabular-nums; }
  .yg-table-scroll {
    overflow: auto;
    background: var(--yg-raised);
    border: 1px solid var(--yg-border-subtle);
    border-radius: var(--yg-radius-card);
  }
  .yg-table {
    border-collapse: collapse;
    width: 100%;
    font: var(--yg-font-body);
  }
  .yg-table caption {
    text-align: start;
    font: var(--yg-font-action);
    letter-spacing: var(--yg-tracking-action);
    padding: var(--boa-space-10) var(--yg-inset-regular);
    border-block-end: 1px solid var(--yg-border-subtle);
    background: var(--yg-raised);
  }
  .yg-table :is(th, td) {
    text-align: start;
    padding: 7px 11px;
    overflow-wrap: anywhere;
    border-block-end: 1px solid var(--yg-border-subtle);
    vertical-align: middle;
  }
  .yg-table tbody tr:last-child :is(th, td) {
    border-block-end: 0;
  }
  .yg-table thead th,
  .yg-table th[scope="col"] {
    font: var(--yg-font-label);
    letter-spacing: var(--yg-tracking-label);
    color: var(--yg-muted);
    background: var(--yg-surface);
    white-space: nowrap;
  }
  .yg-table tbody th {
    font: var(--yg-font-action);
    color: var(--yg-text);
    background: transparent;
  }
  .yg-table-sort {
    display: inline-flex;
    align-items: center;
    gap: var(--boa-space-4);
    border: 0;
    padding: 0;
    background: transparent;
    color: inherit;
    font: inherit;
    cursor: pointer;
  }
  @media (hover: hover) {
    .yg-table tbody tr:hover { background: var(--yg-surface); }
  }
  .yg-table [data-align="end"],
  .yg-table [data-numeric="true"] {
    text-align: end;
  }
  .yg-table [data-numeric="true"],
  .yg-table [data-kind="numeric"] {
    font-variant-numeric: tabular-nums;
  }
  .yg-table td[data-kind="identity"] {
    font: var(--yg-font-action);
    letter-spacing: var(--yg-tracking-action);
    color: var(--yg-text);
  }
  .yg-table td[data-kind="role"] {
    color: var(--yg-muted);
    white-space: nowrap;
  }
  .yg-table [data-kind="actions"] {
    white-space: nowrap;
    width: 1%;
  }
  .yg-avatar {
    border: 1px solid var(--yg-border-subtle);
    background: var(--yg-field);
    color: var(--yg-text);
    font: var(--yg-font-label);
    letter-spacing: var(--yg-tracking-label);
  }
  .yg-chart { margin: 0; }
  .yg-chart-range { font: var(--yg-font-meta); letter-spacing: var(--yg-tracking-meta); color: var(--yg-muted); }
  .yg-legend i { width: 12px; height: 3px; border-radius: 2px; background: var(--yg-brand-ink); }
  .yg-chart details { margin-top: var(--boa-space-12); }
  .yg-chart summary { width: fit-content; }
  .yg-avatar-body .yg-eye-round { opacity: var(--yg-mark-round, 1); }
  .yg-avatar-body .yg-eye-cross { opacity: var(--yg-mark-cross, 0); }
  .yg-avatar-body .yg-eye-smile { opacity: var(--yg-mark-smile, 0); }
  .yg-avatar-body { transform-box: view-box; transform-origin: center; }
  .yg-mark,
  .yg-agent-avatar { display: inline-block; vertical-align: middle; flex: none; }
  .yg-message { display: grid; gap: var(--boa-space-4); padding-block: var(--boa-space-8); overflow-wrap: anywhere; }
  .yg-message[data-variant="sent"] { justify-items: end; }
  .yg-message[data-variant="sent"] .yg-message-body { display: grid; justify-items: end; }
  .yg-message[data-variant="sent"] .yg-message-content {
    background: var(--yg-surface);
    border: 1px solid var(--yg-border-subtle);
    border-radius: var(--boa-radius-feature) var(--boa-radius-feature) var(--boa-radius-small) var(--boa-radius-feature);
    padding: var(--boa-space-10) var(--boa-space-16);
  }
  .yg-transcript {
    max-block-size: none;
    display: grid;
    gap: var(--boa-space-8);
  }
  .yg-reading-anchor {
    width: fit-content;
    padding: 4px 12px;
    border: 1px solid var(--yg-border-chrome);
    border-radius: var(--boa-radius-round);
    background: var(--yg-raised);
    color: var(--yg-text);
    font: var(--yg-font-compact);
  }

  /* Hover states */
  @media (hover: hover) {
    .yg-button[data-emphasis="filled"]:hover:not(:disabled, [aria-disabled="true"], :active) {
      background: var(--yg-button-hover);
    }
    .yg-button[data-emphasis="soft"]:hover:not(:disabled, [aria-disabled="true"]) {
      background: var(--yg-button-soft-hover);
    }
    .yg-button[data-emphasis="quiet"]:hover:not(:disabled, [aria-disabled="true"]) {
      background: var(--yg-button-quiet-hover);
    }
    .yg-options [role="option"]:hover:not([aria-disabled="true"]),
    .yg-popup-menu :is([role="menuitem"], [role="menuitemcheckbox"], [role="menuitemradio"]):hover:not([aria-disabled="true"]) {
      background: var(--yg-hover);
    }
    a.yg-row:hover:not([aria-current]),
    button.yg-row:hover:not([aria-current]),
    .yg-row-trigger:hover:not([aria-current]),
    .yg-nav-list a:hover:not([aria-current]) {
      background: var(--yg-hover);
    }
  }
}

@layer yg.utilities {
  .yg-sr-only {
    position: absolute;
    inline-size: 1px;
    block-size: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
    border: 0;
  }

  @media (pointer: coarse) {
    .yg-root {

  .workflow-records, .workflow-decision { grid-template-columns: minmax(0, 1fr); gap: var(--boa-space-12); }
  .workflow-records[data-show-detail=false] .workflow-record-detail,
  .workflow-records[data-show-detail=true] .workflow-record-list { display: none; }
  .workflow-back { display: inline-flex; margin-block-end: var(--boa-space-16); }
  .workflow-body h1 { font: var(--yg-font-heading); }
}
.workflow-body .yg-sidebar-layout[data-compact="true"] > .yg-sidebar-main:has(.workflow-records) { padding-inline-start: 0; }
@media (pointer: coarse) {
  .workflow-parts a { min-block-size: var(--yg-size-touch); }
}
