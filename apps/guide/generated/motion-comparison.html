.yg-root[data-material="paper"] {
  --yg-canvas: light-dark(var(--boa-color-paper-25), var(--boa-color-paper-975));
  --yg-surface: light-dark(var(--boa-color-paper-50), var(--boa-color-paper-950));
  --yg-field: light-dark(var(--boa-color-paper-100), var(--boa-color-paper-850));
  --yg-hover: light-dark(var(--boa-color-paper-200), var(--boa-color-paper-800));
  --yg-text: light-dark(var(--boa-color-paper-950), var(--boa-color-paper-50));
  --yg-muted: light-dark(var(--boa-color-paper-700), var(--boa-color-paper-300));
}
.yg-root[data-material="mist"] {
  --yg-canvas: light-dark(var(--boa-color-mist-25), var(--boa-color-mist-975));
  --yg-surface: light-dark(var(--boa-color-mist-50), var(--boa-color-mist-950));
  --yg-field: light-dark(var(--boa-color-mist-100), var(--boa-color-mist-850));
  --yg-hover: light-dark(var(--boa-color-mist-200), var(--boa-color-mist-800));
  --yg-text: light-dark(var(--boa-color-mist-950), var(--boa-color-mist-50));
  --yg-muted: light-dark(var(--boa-color-mist-700), var(--boa-color-mist-300));
}

/* Extended component anatomy. All color roles follow the nearest Yogurt. */
.yg-bottom-action[data-fixed] {
  position: fixed;
  inset-inline: 0;
  inset-block-end: 0;
  z-index: 3;
  padding: var(--boa-space-12) var(--boa-space-16)
    max(var(--boa-space-12), env(safe-area-inset-bottom));
  background: var(--yg-canvas);
}
.yg-aspect {
  width: 100%;
  overflow: hidden;
  border-radius: var(--yg-radius-control);
}
.yg-aspect > :is(img, video) {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.yg-card,
.yg-elevation,
.yg-gradient,
.yg-slide,
.yg-sidebar {
  padding: var(--yg-inset-panel);
  border-radius: var(--yg-radius-panel);
  background: var(--yg-surface);
}
.yg-card {
  display: grid;
  gap: var(--yg-gap-stack);
  align-content: start;
  background: var(--yg-raised-surface);
  box-shadow: inset 0 0 0 1px var(--yg-surface-edge);
}
.yg-card .yg-heading {
  line-height: 1.25;
}
.yg-card p,
.yg-section-line p,
.yg-stepper p,
.yg-post p {
  margin: 0;
}
.yg-asset,
.yg-avatar {
  display: inline-grid;
  place-items: center;
  flex: none;
  overflow: hidden;
  vertical-align: middle;
}
.yg-asset[data-framed],
.yg-avatar {
  background: var(--yg-action-soft);
  color: var(--yg-action);
  border-radius: var(--yg-radius-control);
}
.yg-asset > :is(img, video, svg),
.yg-avatar img {
  max-width: 100%;
  max-height: 100%;
  object-fit: cover;
}
.yg-avatar {
  border-radius: 50%;
  font: var(--yg-font-action);
}
.yg-gradient {
  background: linear-gradient(115deg, var(--yg-action-soft), var(--yg-surface));
}
.yg-gradient[data-tone="accent"] {
  background: linear-gradient(
    115deg,
    var(--yg-accent-soft),
    var(--yg-action-soft)
  );
}
.yg-gradient[data-tone="success"] {
  background: linear-gradient(
    115deg,
    var(--yg-success-soft),
    var(--yg-surface)
  );
}
.yg-gradient[data-tone="warning"] {
  background: linear-gradient(
    115deg,
    var(--yg-warning-soft),
    var(--yg-surface)
  );
}
.yg-gradient[data-tone="danger"] {
  background: linear-gradient(115deg, var(--yg-danger-soft), var(--yg-surface));
}
.yg-gradient[data-tone="neutral"] {
  background: linear-gradient(115deg, var(--yg-field), var(--yg-surface));
}
.yg-elevation {
  background: var(--yg-canvas);
}
.yg-elevation[data-level="raised"] {
  box-shadow: var(--yg-lift-shadow);
}
.yg-elevation[data-level="floating"],
.yg-flyout {
  box-shadow: var(--yg-float-shadow);
}
.yg-shortcut {
  display: inline-flex;
  gap: var(--boa-space-4);
}
.yg-shortcut kbd {
  font: var(--yg-font-help);
  color: var(--yg-muted);
  background: var(--yg-field);
  border-radius: var(--yg-radius-small);
  padding: var(--boa-space-2) var(--boa-space-8);
}
.yg-post {
  max-inline-size: 65ch;
  line-height: 1.6;
  overflow-wrap: anywhere;
}
.yg-post > * + * {
  margin-block-start: var(--boa-space-12);
}
.yg-grid-list,
.yg-stepper,
.yg-trace ol,
.yg-bars ul,
.yg-navigation-menu ul {
  list-style: none;
  margin: 0;
  padding: 0;
}
.yg-grid-list {
  display: grid;
  gap: var(--boa-space-12);
  grid-template-columns: repeat(
    auto-fit,
    minmax(min(100%, var(--yg-cell)), 1fr)
  );
}
.yg-section-line,
.yg-value-row,
.yg-code header,
.yg-carousel footer,
.yg-quantity,
.yg-range > div,
.yg-sidebar header,
.yg-navbar,
.yg-attachment {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--boa-space-12);
  min-width: 0;
}
.yg-section-line,
.yg-value-row {
  flex-wrap: wrap;
}
.yg-section-line .yg-heading {
  font: var(--yg-font-action);
}
.yg-bottom-info {
  padding: var(--boa-space-12);
  background: var(--yg-field);
  color: var(--yg-muted);
  font: var(--yg-font-help);
  border-radius: var(--yg-radius-control);
}
.yg-highlight {
  background: var(--yg-warning-soft);
  color: var(--yg-warning);
  border-radius: var(--boa-space-2);
  padding-inline: var(--boa-space-2);
}
.yg-loading {
  display: inline-flex;
  align-items: center;
  color: var(--yg-action);
}
.yg-value-row {
  margin: 0;
  min-height: var(--yg-size-regular);
}
.yg-value-row dt {
  color: var(--yg-muted);
}
.yg-value-row dd {
  margin: 0;
  font-weight: var(--boa-weight-medium);
}
.yg-amount {
  display: grid;
  gap: var(--boa-space-4);
}
.yg-amount strong {
  font-size: 1.75rem;
  line-height: 1.2;
  letter-spacing: -0.035em;
}
.yg-amount small {
  font: var(--yg-font-action);
}
.yg-bars {
  margin: 0;
}
.yg-bars figcaption,
.yg-file-name strong {
  font: var(--yg-font-action);
}
.yg-bars ul {
  margin-block: var(--boa-space-8);
}
.yg-bars li {
  display: grid;
  grid-template-columns: minmax(4ch, auto) minmax(3rem, 1fr) auto;
  align-items: center;
  gap: var(--boa-space-8);
  min-height: var(--yg-size-compact);
}
.yg-bar-track {
  position: relative;
  height: var(--boa-space-8);
  background: var(--yg-field);
  border-radius: var(--yg-radius-small);
  overflow: hidden;
}
.yg-bar-track i {
  position: absolute;
  inset-block: 0;
  background: var(--yg-action);
}
.yg-bars small,
.yg-attachment small,
.yg-carousel footer > span,
.yg-trace small {
  font: var(--yg-font-help);
  color: var(--yg-muted);
}
.yg-bubble {
  width: fit-content;
  max-width: 90%;
  padding: var(--boa-space-8) var(--boa-space-12);
  border-radius: var(--yg-radius-panel);
  border-end-start-radius: var(--yg-radius-small);
  background: var(--yg-field);
  overflow-wrap: anywhere;
}
.yg-bubble[data-outgoing] {
  margin-inline-start: auto;
  border-end-start-radius: var(--yg-radius-panel);
  border-end-end-radius: var(--yg-radius-small);
  background: var(--yg-action-soft);
  color: var(--yg-action);
}
.yg-attachment,
.yg-code,
.yg-quantity > div,
.yg-context-target,
.yg-toggle-group {
  background: var(--yg-field);
  border-radius: var(--yg-radius-control);
}
.yg-attachment {
  justify-content: start;
  padding: var(--boa-space-8) var(--boa-space-12);
  flex-wrap: wrap;
  box-shadow: inset 0 0 0 1px var(--yg-surface-edge);
}
.yg-file-name {
  display: grid;
  min-width: 0;
  text-align: start;
  flex: 1;
  overflow-wrap: anywhere;
}
.yg-attachment button.yg-file-name {
  border: 0;
  background: transparent;
}
.yg-marker {
  display: flex;
  align-items: center;
  gap: var(--boa-space-8);
  color: var(--yg-muted);
  font: var(--yg-font-help);
}
.yg-code {
  min-width: 0;
  max-width: 100%;
  overflow: hidden;
}
.yg-code header,
.yg-code pre {
  padding: var(--boa-space-8) var(--boa-space-12);
  margin: 0;
}
.yg-code header {
  color: var(--yg-muted);
  font: var(--yg-font-help);
}
.yg-code pre {
  overflow: auto;
  text-align: start;
}
.yg-code code {
  font: var(--yg-font-body);
  font-variant-numeric: tabular-nums;
}
.yg-trace li {
  padding-block: var(--boa-space-4);
}
.yg-trace small {
  margin-inline-start: var(--boa-space-8);
}
.yg-trace details > div {
  color: var(--yg-muted);
  padding: var(--boa-space-8) var(--boa-space-16);
}
.yg-input-group {
  gap: var(--boa-space-8);
}
.yg-input-group > :not(input) {
  flex: none;
}
.yg-input-group input {
  width: 0;
}
.yg-otp {
  position: relative;
  width: fit-content;
  max-width: 100%;
}
.yg-otp input {
  position: absolute;
  inset: 0;
  z-index: 1;
  width: 100%;
  height: 100%;
  opacity: 0;
  font: var(--yg-font-touch);
}
.yg-otp-slots {
  display: grid;
  grid-template-columns: repeat(
    var(--yg-digits),
    minmax(0, var(--yg-size-regular))
  );
  gap: var(--boa-space-4);
}
.yg-otp-slots > span {
  display: grid;
  place-items: center;
  min-height: var(--yg-size-regular);
  border-radius: var(--yg-radius-small);
  background: var(--yg-field);
  font: var(--yg-font-action);
}
.yg-otp:focus-within [data-cursor] {
  outline: var(--boa-stroke-focus) solid var(--yg-action);
  outline-offset: -2px;
}
.yg-split-inputs,
.yg-split-inputs > span,
.yg-key-actions,
.yg-key-row,
.yg-toggle-group {
  display: flex;
  align-items: center;
  gap: var(--boa-space-8);
}
.yg-split-inputs > span {
  min-width: 0;
  flex: 1;
}
.yg-split-inputs i {
  font-style: normal;
  color: var(--yg-muted);
}
.yg-range {
  display: grid;
  gap: var(--boa-space-4);
}
.yg-range output {
  color: var(--yg-action);
  font: var(--yg-font-action);
  font-variant-numeric: tabular-nums;
}
.yg-range input {
  display: block;
  width: 100%;
  margin: 0;
  min-height: var(--yg-size-regular);
  accent-color: var(--yg-action);
}
.yg-quantity > div {
  display: inline-flex;
  align-items: center;
}
.yg-quantity output {
  min-inline-size: 3ch;
  text-align: center;
  font-variant-numeric: tabular-nums;
}
.yg-rating {
  display: flex;
  flex-wrap: wrap;
}
.yg-rating label {
  position: relative;
  display: grid;
  place-items: center;
  width: var(--yg-size-regular);
  height: var(--yg-size-regular);
  font-size: 1.35rem;
  color: var(--yg-muted);
}
.yg-rating input {
  position: absolute;
  inset: 0;
  opacity: 0;
  cursor: pointer;
}
.yg-rating [data-filled] {
  color: var(--yg-action);
}
.yg-rating label:has(:focus-visible) {
  outline: var(--boa-stroke-focus) solid var(--yg-action);
  border-radius: var(--yg-radius-small);
}
.yg-agreement > div {
  margin-inline-start: var(--boa-space-12);
}
.yg-keypad {
  display: grid;
  gap: var(--boa-space-4);
  max-width: 30rem;
}
.yg-key-row {
  justify-content: center;
  gap: var(--boa-space-2);
}
.yg-key-row > * {
  flex: 1;
  min-width: 0;
  max-width: 3.5rem;
}
.yg-key-row button,
.yg-toggle-item,
.yg-menu-bar > button,
.yg-navigation-menu li > button,
.yg-date-trigger,
.yg-sidebar a,
.yg-flyout [role="menuitem"],
.yg-flyout a,
.yg-command-list [role="option"] {
  border: 0;
  border-radius: var(--yg-radius-small);
  color: var(--yg-text);
  background: transparent;
  font: var(--yg-font-body);
  padding: var(--boa-space-4) var(--boa-space-8);
  min-height: var(--yg-size-regular);
}
.yg-key-row button {
  background: var(--yg-field);
  padding-inline: 0;
}
.yg-key-actions {
  justify-content: flex-end;
}
.yg-keypad[data-mode="number"] .yg-key-row > * {
  max-width: none;
}
.yg-keypad[data-mode="number"] .yg-key-row:last-of-type > * {
  max-width: 33%;
}
.yg-toggle-group {
  width: fit-content;
  max-width: 100%;
  flex-wrap: wrap;
  gap: var(--boa-space-2);
  padding: var(--boa-space-2);
}
.yg-toggle-item[data-state="on"],
.yg-sidebar a[aria-current],
.yg-command-list [aria-selected="true"],
.yg-menu-bar [data-state="open"] {
  background: var(--yg-action-soft);
  color: var(--yg-action);
}
.yg-accordion h3 {
  margin: 0;
  font: inherit;
}
.yg-accordion h3 button,
.yg-date-trigger {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--boa-space-8);
  width: 100%;
  min-height: var(--yg-size-touch);
  border: 0;
  background: none;
  text-align: start;
}
.yg-accordion h3 button {
  padding: var(--boa-space-8) 0;
  font: var(--yg-font-action);
}
.yg-accordion h3 button[data-state="open"] .yg-icon {
  rotate: 180deg;
}
.yg-accordion-content {
  padding-block: 0 var(--boa-space-12);
  color: var(--yg-muted);
}
.yg-context-target {
  padding: var(--boa-space-16);
}
.yg-flyout,
.yg-command-list {
  padding: var(--yg-inset-layer);
  border-radius: var(--yg-radius-panel);
  background: var(--yg-raised-surface);
  color: var(--yg-text);
  max-width: min(22rem, 92vi);
  z-index: 8;
}
.yg-flyout {
  box-shadow: inset 0 0 0 1px var(--yg-surface-edge), var(--yg-float-shadow);
  max-height: var(--radix-popper-available-height, 80dvh);
  overflow: auto;
}
.yg-flyout [role="menuitem"],
.yg-flyout a,
.yg-command-list [role="option"] {
  display: flex;
  align-items: center;
  cursor: pointer;
  white-space: normal;
  text-decoration: none;
  outline-offset: -2px;
}
.yg-flyout [data-highlighted],
.yg-flyout a:focus-visible,
.yg-key-row button:active {
  background: var(--yg-hover);
}
.yg-flyout [data-disabled],
.yg-command-list [aria-disabled="true"] {
  color: var(--yg-off);
  cursor: default;
}
.yg-command-list {
  max-width: 100%;
  max-height: 16rem;
  overflow: auto;
}
.yg-hover-content {
  padding: var(--boa-space-12);
}
.yg-menu-bar,
.yg-navigation-menu ul {
  display: flex;
  align-items: center;
  gap: var(--boa-space-4);
  flex-wrap: wrap;
}
.yg-navigation-menu li {
  position: relative;
}
.yg-navigation-menu li > button {
  display: flex;
  align-items: center;
  gap: var(--boa-space-4);
}
.yg-navigation-menu .yg-flyout {
  position: absolute;
  inset-block-start: 100%;
  inset-inline-start: 0;
  min-width: min(11rem, 80vi);
}
.yg-sidebar {
  max-width: 18rem;
}
.yg-sidebar nav a {
  display: flex;
  align-items: center;
  text-decoration: none;
}
.yg-navbar {
  min-height: var(--yg-size-touch);
}
.yg-navbar > strong {
  flex: 1;
}
.yg-carousel {
  min-width: 0;
}
.yg-slide {
  background: color-mix(in srgb, var(--yg-field) 65%, var(--yg-canvas));
  box-shadow: inset 0 0 0 1px var(--yg-surface-edge);
  touch-action: pan-y;
}
.yg-carousel footer {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
  align-items: center;
  gap: var(--boa-space-4);
  margin-block-start: var(--boa-space-12);
}
.yg-carousel footer > span {
  overflow-wrap: anywhere;
}
.yg-carousel-nav {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--boa-space-4);
}
.yg-stepper {
  display: grid;
  gap: var(--boa-space-12);
}
.yg-stepper li {
  display: flex;
  align-items: center;
  gap: var(--boa-space-8);
}
.yg-step-number {
  display: grid;
  place-items: center;
  background: var(--yg-field);
  color: var(--yg-muted);
  width: var(--yg-size-compact);
  height: var(--yg-size-compact);
  border-radius: 50%;
  flex: none;
  font: var(--yg-font-meta);
}
.yg-stepper [aria-current] .yg-step-number,
.yg-stepper [data-complete] .yg-step-number {
  background: var(--yg-action-soft);
  color: var(--yg-action);
}
.yg-stepper[data-variant="progress"] {
  grid-template-columns: repeat(auto-fit, minmax(min(6rem, 100%), 1fr));
}
.yg-stepper[data-variant="progress"] li {
  flex-direction: column;
  align-items: flex-start;
}
.yg-resizable > [data-panel] {
  background: var(--yg-field);
  border-radius: var(--yg-radius-control);
  padding: var(--boa-space-12);
  overflow-wrap: anywhere;
}
.yg-resize-handle {
  width: var(--boa-space-12);
  display: grid;
  place-items: center;
}
.yg-resize-handle::before {
  content: "";
  width: var(--boa-space-2);
  height: var(--boa-space-24);
  background: var(--yg-muted);
  border-radius: var(--yg-radius-small);
}
.yg-date-trigger {
  background: var(--yg-field);
  padding-inline: var(--yg-inset-regular);
  min-height: var(--yg-size-regular);
  border-radius: var(--yg-radius-control);
}
.yg-calendar {
  position: relative;
  width: fit-content;
  max-width: 100%;
  --yg-date-size: clamp(1.75rem, 8.5vi, 2.5rem);
}
.yg-date-popup {
  padding: var(--boa-space-8);
}
.yg-calendar .rdp-month_caption {
  min-height: var(--yg-size-touch);
  display: flex;
  align-items: center;
  font: var(--yg-font-action);
  padding-inline: var(--boa-space-8) 5rem;
}
.yg-calendar .rdp-nav {
  position: absolute;
  inset-block-start: 0;
  inset-inline-end: 0;
  display: flex;
  gap: var(--boa-space-2);
}
.yg-calendar table {
  border-collapse: collapse;
}
.yg-calendar td,
.yg-calendar th {
  padding: 0;
  text-align: center;
}
.yg-calendar th {
  color: var(--yg-muted);
  font: var(--yg-font-meta);
  height: var(--yg-size-compact);
}
.yg-calendar button {
  border: 0;
  background: transparent;
  border-radius: var(--yg-radius-small);
  color: var(--yg-text);
  display: grid;
  place-items: center;
  width: var(--yg-date-size);
  height: var(--yg-date-size);
  padding: 0;
  font: var(--yg-font-body);
}
.yg-calendar .rdp-chevron {
  fill: currentColor;
  width: var(--yg-glyph);
  height: var(--yg-glyph);
}
.yg-calendar .rdp-selected button {
  background: var(--yg-action);
  color: var(--yg-on-action);
}
.yg-calendar .rdp-today:not(.rdp-selected) button {
  font-weight: var(--boa-weight-medium);
  color: var(--yg-action);
}
.yg-calendar .rdp-disabled button {
  color: var(--yg-off);
  cursor: default;
}
.yg-question {
  justify-items: stretch;
}
@media (hover: hover) {
  .yg-calendar button:not(:disabled):hover,
  .yg-toggle-item:not(:disabled):hover,
  .yg-sidebar a:hover,
  .yg-menu-bar > button:hover,
  .yg-navigation-menu li > button:hover {
    background: var(--yg-hover);
    color: var(--yg-text);
  }
}
@media (pointer: coarse) {
  .yg-resize-handle {
    width: var(--boa-space-24);
  }
  .yg-rating label,
  .yg-key-row button,
  .yg-calendar button {
    min-height: var(--yg-size-touch);
  }
  .yg-flyout [role="menuitem"] {
    min-height: var(--yg-size-touch);
  }
}
@media (forced-colors: active) {
  .yg-otp-slots > span,
  .yg-key-row button {
    outline: 1px solid ButtonText;
  }
  .yg-calendar .rdp-selected button,
  .yg-stepper [aria-current] .yg-step-number {
    outline: 2px solid Highlight;
  }
}

.yg-stage-list > progress {
  display: block;
  width: 100%;
  height: var(--boa-space-4);

.yg-input,

.yg-select:has(select:focus-visible),
.yg-standalone:focus-visible {
  background-color: var(--yg-hover);
}

.yg-switch [role="switch"] {
  transition: background-color var(--yg-travel) var(--yg-settle);
}

.yg-switch [role="switch"] > span {
  transition:
    transform var(--yg-travel) var(--yg-settle),
    background-color var(--yg-travel) var(--yg-settle);
}

.yg-checkbox [role="checkbox"],
.yg-radio [role="radio"],
.yg-toggle-item,
.yg-rating label,
.yg-otp-slots > span {
  transition:
    background-color var(--yg-change, var(--yg-travel)) var(--yg-settle),
    color var(--yg-change, var(--yg-travel)) var(--yg-settle);
}

.yg-otp:focus-within [data-cursor] {
  background-color: var(--yg-action-soft);
}

  pointer-events: none;
  transition: transform var(--yg-press) var(--yg-settle);
}

  transform: translateY(1px);
}

.yg-range input:not(:disabled):active {
  accent-color: var(--yg-action-press);
}

.yg-progress {
  position: relative;
}

.yg-progress progress {
  position: absolute;
  inline-size: 1px;
  block-size: 1px;
  clip-path: inset(50%);
}

.yg-progress > .yg-progress-track {
  display: block;
  block-size: 6px;
  overflow: hidden;
  border-radius: var(--boa-radius-round);
  background: var(--yg-field);
}

.yg-progress-track > span {
  display: block;
  block-size: 100%;
  border-radius: inherit;
  background: var(--yg-action);
  transform: scaleX(var(--yg-progress-completion, 0));
  transform-origin: left center;
  transition: transform var(--yg-change, var(--yg-travel)) var(--yg-settle);
}

.yg-progress-track:dir(rtl) > span {
  transform-origin: right center;
}

.yg-progress progress:not([value]) + .yg-progress-track > span {
  inline-size: 33.333%;
  transform: none;
  animation: yg-progress-sweep calc(2 * var(--yg-busy, 750ms)) var(--yg-settle) infinite alternate;
}

.yg-progress progress:not([value]) + .yg-progress-track:dir(rtl) > span {
  animation-name: yg-progress-sweep-rtl;
}

@keyframes yg-progress-sweep {
  to { transform: translateX(200%); }
}

@keyframes yg-progress-sweep-rtl {
  to { transform: translateX(-200%); }
}

.yg-toast {
  animation: yg-toast-arrive var(--yg-change, var(--yg-travel)) var(--yg-settle);
}

  from {
    translate: 0 var(--boa-space-8);

    inline-size: 100%;

    display: none;
  }

  .yg-radio [role="radio"],
  .yg-toggle-item,
  .yg-rating label,
  .yg-otp-slots > span,
  .yg-progress-track > span {
    transition: none;

.yg-root {
  --yg-surface-edge: color-mix(in srgb, var(--yg-text) 11%, transparent);
  --yg-active-edge: color-mix(in srgb, var(--yg-action) 17%, transparent);
  --yg-raised-surface: light-dark(var(--yg-canvas), var(--yg-surface));
  color-scheme: light dark;
  color: var(--yg-text);
  background: var(--yg-canvas);
  font: var(--yg-font-body);
  letter-spacing: var(--boa-tracking-body);
  text-align: start;
}
.yg-root[data-appearance="light"] {
  color-scheme: light;
}
.yg-root[data-appearance="dark"] {
  color-scheme: dark;
}
.yg-root,
.yg-root :where(*, ::before, ::after) {
  box-sizing: border-box;
}
.yg-root :where(button, input, select, textarea) {
  font: inherit;
  color: inherit;
}
.yg-root :where(button, summary, select) {
  cursor: pointer;
  touch-action: manipulation;
}
.yg-root :where(:disabled, [aria-disabled="true"]) {
  cursor: default;
}
.yg-root :where(:focus-visible) {
  outline: var(--boa-stroke-focus) solid var(--yg-action);
  outline-offset: 2px;
}
.yg-root [hidden] {
  display: none !important;
}
.yg-heading {
  margin: 0;
  letter-spacing: var(--boa-tracking-heading);
  font: var(--yg-font-heading);
  text-wrap: balance;
}
.yg-text {
  font: var(--yg-font-body);
}
.yg-help,
.yg-text[data-type="help"],
.yg-error {
  display: block;
  margin: 0;
  font: var(--yg-font-help);
  color: var(--yg-muted);
}
.yg-meta,
.yg-text[data-type="meta"] {
  font: var(--yg-font-meta);
  letter-spacing: var(--boa-tracking-meta);
  color: var(--yg-muted);
  font-variant-numeric: tabular-nums;
}
.yg-error {
  color: var(--yg-danger);
}
.yg-label {
  display: block;
  font: var(--yg-font-action);
  letter-spacing: var(--boa-tracking-label);
}
.yg-stack,
.yg-grid,
.yg-field {
  display: grid;
  gap: var(--yg-gap, var(--boa-space-8));
  min-width: 0;
  align-content: start;
}
.yg-inline,
.yg-bottom-action,
.yg-modal-header {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--yg-gap, var(--boa-space-8));
  min-width: 0;
}
.yg-grid {
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 12rem), 1fr));
}
.yg-surface {
  padding: var(--boa-space-16);
  border-radius: var(--yg-radius-panel);
  background: var(--yg-surface);
}
.yg-divider {
  border: 0;
  height: 1px;
  width: 100%;
  background: var(--yg-hover);
  margin: var(--boa-space-8) 0;
}
.yg-scroll {
  overflow: auto;
  overscroll-behavior: contain;
  max-block-size: 15rem;
  scrollbar-width: thin;
}
.yg-icon {
  inline-size: var(--yg-glyph);
  block-size: var(--yg-glyph);
  flex: none;
  vertical-align: middle;
}
.yg-button,
.yg-reading-anchor {
  border: 0;
  appearance: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  vertical-align: middle;
  gap: var(--boa-space-8);
  min-block-size: var(--yg-size-regular);
  padding: var(--boa-space-4) var(--yg-inset-regular);
  border-radius: var(--yg-radius-control);
  background: var(--yg-action);
  color: var(--yg-on-action);
  font: var(--yg-font-action);
  letter-spacing: var(--boa-tracking-label);
  text-align: center;
  overflow-wrap: anywhere;
  transition: background-color var(--yg-press) linear;
}
.yg-button[data-control-size="compact"] {
  min-block-size: var(--yg-size-compact);
  padding-inline: var(--yg-inset-compact);
  border-radius: var(--yg-radius-small);
}
.yg-button[data-control-size="touch"] {
  min-block-size: var(--yg-size-touch);
  padding-inline: var(--yg-inset-roomy);
}
.yg-button[data-emphasis="filled"] {
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--yg-on-action) 14%, transparent);
}
.yg-button[data-emphasis="soft"] {
  background: var(--yg-action-soft);
  color: var(--yg-action);
}
.yg-button[data-emphasis="quiet"],
.yg-reading-anchor {
  background: transparent;
  color: var(--yg-action);
}
.yg-button[data-tone="danger"] {
  --yg-action: var(--yg-danger);
  --yg-on-action: light-dark(
    var(--boa-color-coral-50),
    var(--boa-color-coral-950)
  );
  --yg-action-soft: var(--yg-danger-soft);
  --yg-action-hover: light-dark(
    var(--boa-color-coral-800),
    var(--boa-color-coral-100)
  );
  --yg-action-press: light-dark(
    var(--boa-color-coral-900),
    var(--boa-color-coral-300)
  );
  --yg-action-soft-hover: light-dark(
    var(--boa-color-coral-100),
    var(--boa-color-coral-850)
  );
}
.yg-button-label,
.yg-sdk-Button-ButtonInner {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--boa-space-8);
}
.yg-button-label {
  transition: transform var(--yg-press) var(--yg-settle);
}
.yg-button:active:not(:disabled, [aria-disabled="true"]) .yg-button-label {
  transform: translateY(1px);
}
.yg-button[data-emphasis="filled"]:active:not(
    :disabled,
    [aria-disabled="true"]
  ) {
  background: var(--yg-action-press);
}
.yg-button:is(:disabled, [aria-disabled="true"]):not([aria-busy="true"]) {
  color: var(--yg-muted);
  background: var(--yg-field);
  box-shadow: none;
}
.yg-icon-button {
  width: var(--yg-size-icon);
  min-height: var(--yg-size-icon);
  border-radius: var(--yg-radius-small);
  padding: 0;
  flex: none;

.yg-avatar-body .yg-eye-smile {
  opacity: var(--yg-mark-smile, 0);
}
.yg-avatar-body {
  transform-box: view-box;
  transform-origin: center;
}
.yg-mark,
.yg-agent-avatar {
  display: inline-block;
  vertical-align: middle;
  flex: none;
}
.yg-message {
  display: grid;
  gap: var(--boa-space-4);
  padding-block: var(--boa-space-8);
  overflow-wrap: anywhere;
}
.yg-reading-anchor {
  width: fit-content;
  font: var(--yg-font-help);
}
@media (hover: hover) {
  .yg-button[data-emphasis="filled"]:hover:not(
      :disabled,
      [aria-disabled="true"],
      :active
    ) {
    background: var(--yg-action-hover);
  }
  .yg-button[data-emphasis="soft"]:hover:not(:disabled, [aria-disabled="true"]),
  .yg-options [role="option"]:hover:not([aria-disabled="true"]) {
    background: var(--yg-action-soft-hover);
  }
  .yg-button[data-emphasis="quiet"]:hover:not(
      :disabled,
      [aria-disabled="true"]
    ),
  a.yg-row:hover,
  button.yg-row:hover,
  .yg-nav-list a:hover {
    background: var(--yg-field);
  }
}
@media (pointer: coarse) {
  .yg-root {
    --yg-size-regular: var(--yg-size-touch);
    --yg-size-compact: var(--yg-size-touch);
    --yg-size-icon: var(--yg-size-touch);
  }
  .yg-input :is(input, textarea),
  .yg-select select,
  .yg-standalone {
    font: var(--yg-font-touch);
  }
}
@media (prefers-reduced-motion: reduce) {
  .yg-root {
    --yg-press: 0ms;
    --yg-layer: 0ms;
    --yg-travel: 0ms;
    --yg-change: 0ms;
    --yg-panel: 0ms;
  }
  .yg-button:active .yg-button-label {
    transform: none !important;
  }
  .yg-spinner {
    animation: none;
  }
}
@media (forced-colors: active) {
  .yg-button,
  .yg-input,
  .yg-standalone,
  .yg-switch [role="switch"],
  .yg-select,
  .yg-segment button[data-state="on"] {
    outline: 1px solid ButtonText;
  }
  .yg-switch [role="switch"] > span,
  .yg-status-dot {
    background: ButtonText;
  }
  .yg-switch [aria-checked="true"] {
    outline: 2px solid Highlight;
  }
  .yg-switch [aria-checked="true"] > span {
    background: Highlight;
  }
}

body {
  margin: 0;
}
.catalog {
  min-height: 100vh;
}
.catalog-header {
  display: flex;
  align-items: center;
  gap: var(--boa-space-24);
  min-height: 68px;
  max-inline-size: 90rem;
  margin-inline: auto;
  padding: 0 clamp(16px, 3.5vw, 56px);
  background: var(--yg-canvas);
}
.catalog-identity {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 22px;
  font-weight: 650;
  letter-spacing: -0.055em;
}
.catalog-section {
  color: var(--yg-muted);
  font: var(--yg-font-help);
}
.header-actions {
  display: flex;
  gap: 4px;
  margin-inline-start: auto;
}
.menu-toggle.yg-icon-button {
  display: none;
}
.catalog-body {
  display: grid;
  grid-template-columns: minmax(11rem, 14rem) minmax(0, 1fr);
  gap: clamp(24px, 4vw, 64px);
  max-inline-size: 90rem;
  padding: 16px clamp(16px, 3.5vw, 56px) 48px;
  margin: auto;
  align-items: start;
}
.catalog-body > aside {
  position: sticky;
  top: 12px;
  max-height: calc(100dvh - 24px);
  overflow: auto;
  scrollbar-width: thin;
}
.catalog-search {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--yg-field);
  border-radius: var(--yg-radius-control);
  min-height: 36px;
  padding: 0 10px;
  margin: 0 0 16px;
  color: var(--yg-muted);
}
.catalog-search input {
  color: var(--yg-text);
  border: 0;
  background: transparent;
  outline: 0;
  width: 100%;
  min-width: 0;
  font: var(--yg-font-help);
}
.catalog-search:focus-within {
  outline: 2px solid var(--yg-action);
}
.catalog-search .yg-icon {
  width: 15px;
}
.nav-family {
  margin: 0 0 4px;
}
.nav-family > button,
.nav-family a {
  width: 100%;
  display: flex;
  gap: 4px;
  align-items: center;
  justify-content: space-between;
  min-height: 32px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  text-decoration: none;
  color: var(--yg-text);
  text-align: start;
  padding: 4px 8px;
  font: var(--yg-font-action);
}
.nav-family > button svg {
  width: 13px;
  color: var(--yg-muted);
}
.nav-family a {
  padding-inline-start: 18px;
  color: var(--yg-muted);
  font: var(--yg-font-help);
}
.nav-family a[aria-current] {
  color: var(--yg-action);
  background: var(--yg-action-soft);
  font-weight: 550;
}
.nav-family a:hover,
.nav-family > button:hover {
  background: var(--yg-field);
}
.catalog-body > main {
  width: 100%;
  min-width: 0;
  padding: 0 0 24px;
  outline: 0;
}
.catalog-intro {
  margin-bottom: 28px;
}
.catalog-intro p {
  margin: 5px 0 0;
  font: var(--yg-font-body);
  color: var(--yg-muted);
}
.catalog-intro p.catalog-family {
  font: var(--yg-font-help);
  color: var(--yg-muted);
  margin: 0 0 5px;
}
.catalog-intro h1 {
  margin: 0;
  font: var(--yg-font-display);
  font-size: clamp(var(--boa-size-title), 4.5vw, var(--boa-size-headline));
  line-height: 1.08;
  letter-spacing: var(--boa-tracking-display);
}
.preview-tools,
.preview-caption {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
}
.preview-tools {
  margin-bottom: 8px;
  font: var(--yg-font-action);
}
.preview-tools .yg-segment button {
  font: var(--yg-font-meta);
  padding-inline: 10px;
}
.specimen {
  background: var(--yg-surface);
  border-radius: var(--yg-radius-panel);
  min-height: 205px;
  padding: clamp(20px, 3.5vw, 44px);
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  align-items: center;
}
.specimen-inner {
  min-width: 0;
  inline-size: min(100%, 31rem);
  margin-inline: auto;
}
.specimen[data-layout="compact"] .specimen-inner {
  inline-size: fit-content;
  max-inline-size: 100%;
}
.specimen[data-layout="wide"] {
  padding: clamp(8px, 2vw, 24px);
}
.specimen[data-layout="wide"] .specimen-inner {
  inline-size: 100%;
}
.sample-response {
  color: var(--yg-muted);
  font: var(--yg-font-help);
}
.sample-response:empty {
  display: none;
}
.preview-caption,
.preview-caption button {
  font: var(--yg-font-meta);
  color: var(--yg-muted);
}
.preview-caption {
  margin: 8px 0 20px;
}
.preview-caption button,
.install-code > button {
  color: var(--yg-action);
  border: 0;
  background: none;
  padding: 4px 0;
}
.variation {
  margin: 24px 0;
}
.variant-body {
  margin: var(--boa-space-12) 0;
  min-block-size: 0;
}
.surface-comparison {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
}
.surface-comparison > .yg-root {
  border-radius: 8px;
  background: var(--yg-surface);
  padding: 12px;
}
.sample-material {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 8px;
}
.sample-scroll {
  max-height: 90px;
}
.install-code {
  margin-top: 24px;
}
.install-code > button {
  display: flex;
  align-items: center;
  gap: 8px;
  font: var(--yg-font-action);
}
.install-code code {
  display: block;
  overflow-wrap: anywhere;
  margin-top: 8px;
  color: var(--yg-text);
  font: var(--yg-font-help);
  background: var(--yg-field);
  padding: 8px;
  border-radius: 6px;
}
.skip {
  position: absolute;
  left: -300vw;
}
.skip:focus {
  left: 8px;
  top: 8px;
  z-index: 3;
  background: var(--yg-canvas);
  padding: 8px;
}
@media (max-width: 740px) {
  .catalog-header {
    min-height: 54px;
    gap: 14px;
  }
  .catalog-body {
    display: block;
    padding-top: 12px;
  }
  .catalog-body > aside {
    display: none;
    position: static;
    max-height: 48vh;
    padding: 0 4px 8px;
  }
  .catalog-body > aside[data-open="true"] {
    display: block;
  }
  .menu-toggle.yg-icon-button {
    display: inline-flex;
  }
  .catalog-body > main {
    padding-top: 4px;
  }
  .catalog-intro {
    margin-bottom: 20px;
  }
  .specimen {
    min-height: 155px;
    padding: 24px 20px;
  }
  .catalog-identity {
    font-size: 20px;
  }
  .surface-comparison {
    grid-template-columns: 1fr;
  }
  .sample-material {
    margin-top: 0;
  }
}
@media (max-width: 370px) {
  .catalog-section {
    font-size: 11px;
  }
  .catalog-header {
    gap: 8px;
  }
  .specimen {
    padding-inline: 14px;
  }
  .preview-tools .yg-segment button {
    padding-inline: 7px;
  }
}
.catalog-top {
  display: flex;
  gap: 4px;
  align-items: center;
}
.catalog-top :is(button, a) {
  border: 0;
  background: transparent;
  border-radius: 6px;
  padding: 5px 8px;
  font: var(--yg-font-help);
  color: var(--yg-muted);
  text-decoration: none;
  white-space: nowrap;
}
.catalog-top button[aria-current] {
  color: var(--yg-text);
  background: var(--yg-field);
}
.specimen[data-component="select"] {
  align-items: start;
  min-block-size: calc(4 * var(--yg-size-regular) + var(--boa-space-64) + var(--boa-space-16));
  padding-block: var(--boa-space-24);
}
.specimen[data-component="select"] .specimen-inner {
  max-inline-size: 20rem;
}

.brand-reference section > h2 {
  margin-bottom: 12px;
}
.brand-reference section > p {
  margin: 8px 0 4px;
}
.brand-mode {
  margin-bottom: var(--boa-space-12);
}
.brand-mode .yg-field {
  display: grid;
  grid-template-columns: auto minmax(0, 8rem);
  align-items: center;
  justify-content: start;
  gap: var(--boa-space-12);
}
.brand-role-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(155px, 1fr));
  gap: 10px 14px;
}
.brand-role-grid > div {
  display: flex;
  align-items: center;
  gap: 8px;
}
.brand-role-grid > div > span {
  width: 24px;
  height: 28px;
  border-radius: 6px;
  box-shadow: inset 0 0 0 1px
    color-mix(in srgb, var(--yg-text) 10%, transparent);
}
.brand-role-grid small,
.brand-reference dd {
  display: block;
  color: var(--yg-muted);
  font: var(--yg-font-meta);
}
.brand-reference dl > div {
  margin: 0 0 8px;
}
.brand-reference dd {
  margin: 0;
}
.brand-reference dt {
  font: var(--yg-font-action);
}
@media (max-width: 420px) {
  .catalog-top {
    gap: 0;
  }
  .catalog-top :is(button, a) {
    padding: 4px;
    font-size: 12px;
  }
  .catalog-identity {
    gap: 5px;
  }
  .catalog-header {
    gap: 8px;
  }
  .header-actions {
    gap: 0;
  }
}
@media (max-width: 370px) {
  .catalog-header {
    gap: var(--boa-space-4);
  }
  .catalog-identity {
    gap: var(--boa-space-4);
  }
  .catalog-top {
    gap: 0;
  }
  .catalog-top :is(button, a) {
    padding-inline: var(--boa-space-4);
  }
}

.specimen[data-component="calendar"] .specimen-inner {width:fit-content;max-width:100%;}
.sidebar-sample-main {
  min-block-size: 17rem;
  padding: var(--boa-space-16);
  background: var(--yg-canvas);
  border-radius: var(--yg-radius-panel);
}

.agent-motion-stage {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--boa-space-24);
}
.agent-motion-sample {
  display: grid;
  gap: var(--boa-space-8);
  justify-items: center;
}
.agent-motion-tools {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--boa-space-8);
}


@media (max-width: 480px) {
  .catalog-header {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    padding-block: var(--boa-space-8);
    row-gap: var(--boa-space-4);
  }
  .catalog-top {
    grid-column: 1 / -1;
    grid-row: 2;
  }
  .header-actions {
    grid-column: 2;
    grid-row: 1;
  }
}

body:has(#yogurt-motion-comparison) {
  margin: 0;
}

.motion-comparison-theme {
  min-block-size: 100vh;
  color: var(--yg-text);
  background: var(--yg-canvas);
}

.motion-comparison {
  display: grid;
  gap: var(--boa-space-32);
  max-inline-size: 68rem;
  margin-inline: auto;
  padding: clamp(1rem, 4vw, 3rem);
}

.motion-heading,
.motion-scene-heading,
.motion-save-row {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--boa-space-12);
}

.motion-heading,
.motion-scene-heading {
  justify-content: space-between;
  align-items: end;
}

.motion-heading h1 {
  margin: var(--boa-space-8) 0;
  font-size: clamp(2rem, 5vw, 3rem);
  line-height: 1.08;
}

.motion-home {
  color: var(--yg-action);
  font-weight: 700;
}

.motion-scene,
.motion-control-stack {
  display: grid;
  gap: var(--boa-space-12);
}

.motion-scene h2 {
  margin: 0;
}

.motion-pair {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--boa-space-12);
}

.motion-example {
  min-inline-size: 0;
  display: grid;
  align-content: start;
  gap: var(--boa-space-24);
  padding: var(--boa-space-24);
  border-radius: var(--yg-radius-panel);
  background: var(--yg-surface);
}

.motion-variant {
  color: var(--yg-muted);
  font: var(--yg-font-action);
}

.motion-result[data-result="success"] { color: var(--yg-success); }
.motion-result[data-result="failure"] { color: var(--yg-danger); }

.motion-save-row > button {
  min-inline-size: 8rem;
}

.motion-visually-hidden {
  position: absolute;
  inline-size: 1px;
  block-size: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

.motion-button-result {
  display: inline-flex;
  align-items: center;
  gap: var(--boa-space-4);
  animation: motion-confirm var(--yg-panel) cubic-bezier(.22, .85, .32, 1.15) both;
}

@keyframes motion-confirm {
  from { translate: 0 5px; scale: .92; }
  to { translate: 0 0; scale: 1; }
}

.motion-segment-panel {
  min-block-size: var(--boa-space-24);
}

[data-motion-candidate] .motion-segment-panel > span {
  display: inline-block;
  animation: motion-panel-arrive var(--yg-change) var(--yg-settle) both;
}

@keyframes motion-panel-arrive {
  from { translate: 6px 0; }
  to { translate: 0 0; }
}

.motion-slide-card {
  display: grid;
  align-content: center;
  gap: var(--boa-space-4);
  min-block-size: 7rem;
  padding: var(--boa-space-12);
  border-radius: var(--yg-radius-control);
  background: var(--yg-surface);
}

.motion-slide-card > * {
  margin: 0;
}

/* Candidate timing is scoped to the comparison. */
[data-motion-candidate] .yg-button.motion-press[data-result="success"] {
  background: var(--yg-success-soft);
  color: var(--yg-success);
}

[data-motion-candidate] .yg-button.motion-press[data-result="failure"] {
  background: var(--yg-danger-soft);
  color: var(--yg-danger);
}

@media (prefers-reduced-motion: reduce) {
  .motion-button-result,
  [data-motion-candidate] .motion-segment-panel > span { animation: none; }
}

.motion-links {
  display: flex;
  flex-wrap: wrap;
  gap: var(--boa-space-12);
}

@media (max-width: 36rem) {
  .motion-pair { grid-template-columns: 1fr; }
}
